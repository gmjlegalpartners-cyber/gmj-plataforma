<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/es.js"></script>
<meta name="googlebot" content="noindex, nofollow">
<title>GMJ Legal Partners — Plataforma de Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0f1f3d; --navy2:#16294d; --slate:#1e293b; --slate2:#334155;
  --muted:#64748b; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f1f5f9; --card:#ffffff;
  --gold:#c0972f; --gold-soft:#f7efda; --primary:#1f4e8c; --primary-d:#163a69;
  --green:#15803d; --green-bg:#dcfce7; --amber:#b45309; --amber-bg:#fef3c7;
  --red:#b91c1c; --red-bg:#fee2e2; --blue:#1d4ed8; --blue-bg:#dbeafe;
  --grey-bg:#f1f5f9; --text:#0f172a; --shadow:0 1px 3px rgba(15,31,61,.08),0 1px 2px rgba(15,31,61,.06);
  --shadow-lg:0 10px 30px rgba(15,31,61,.12); --radius:12px;
}
/* ===== MODO OSCURO ===== (los documentos/plantillas usan background:#fff inline y quedan en blanco a propósito) */
:root[data-theme="dark"]{
  --navy:#e7ebf3; --navy2:#0f1d34; --slate:#cbd5e1; --slate2:#aab6c8;
  --muted:#93a1b8; --line:#26324a; --line2:#3a4967; --bg:#0b1220; --card:#151f33;
  --gold:#d6b24e; --gold-soft:#332a12; --primary:#3b82f6; --primary-d:#2563eb;
  --green:#4ade80; --green-bg:#123321; --amber:#fbbf24; --amber-bg:#3a2c10;
  --red:#f87171; --red-bg:#3a1a1a; --blue:#60a5fa; --blue-bg:#14273f;
  --grey-bg:#1c2740; --text:#e6eaf2;
  --shadow:0 1px 3px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 14px 36px rgba(0,0,0,.6);
}
[data-theme="dark"] .sidebar{background:#0c1626}
[data-theme="dark"] #login{background:linear-gradient(135deg,#0c1626,#0f1d34 60%,#10233f)}
[data-theme="dark"] .toast{background:#1e293b}
[data-theme="dark"] .topbar,[data-theme="dark"] .stat,[data-theme="dark"] .modal,[data-theme="dark"] .notif-panel,[data-theme="dark"] .notif-h,[data-theme="dark"] .bell-btn,[data-theme="dark"] .tk-kebab,[data-theme="dark"] .tk-menu,[data-theme="dark"] .tk-estado,[data-theme="dark"] .btn-ghost,[data-theme="dark"] .btn-danger,[data-theme="dark"] .login-card,[data-theme="dark"] .field input,[data-theme="dark"] .field select,[data-theme="dark"] .field textarea,[data-theme="dark"] .filters input,[data-theme="dark"] .filters select{background:var(--card);color:var(--text)}
[data-theme="dark"] .btn-ghost{border-color:var(--line2)}
[data-theme="dark"] th{background:#0f1a2c}
[data-theme="dark"] tr.clickable:hover,[data-theme="dark"] .btn-ghost:hover,[data-theme="dark"] .role-opt:hover,[data-theme="dark"] .tk-menu button:hover{background:rgba(255,255,255,.05)}
[data-theme="dark"] .notif-item.unread{background:rgba(59,130,246,.16)}
[data-theme="dark"] .alert-warn{color:#fbbf24}
[data-theme="dark"] .alert-info{color:#93c5fd}
[data-theme="dark"] .alert-ok{color:#86efac}
[data-theme="dark"] .flatpickr-calendar{background:var(--card);color:var(--text);box-shadow:0 8px 28px rgba(0,0,0,.6)}
[data-theme="dark"] .flatpickr-calendar.arrowTop:before,[data-theme="dark"] .flatpickr-calendar.arrowTop:after{border-bottom-color:var(--card)}
[data-theme="dark"] .flatpickr-calendar.arrowBottom:before,[data-theme="dark"] .flatpickr-calendar.arrowBottom:after{border-top-color:var(--card)}
[data-theme="dark"] .flatpickr-months,[data-theme="dark"] .flatpickr-current-month,[data-theme="dark"] .flatpickr-current-month input.cur-year,[data-theme="dark"] .flatpickr-monthDropdown-months,[data-theme="dark"] span.flatpickr-weekday{color:var(--text);fill:var(--text);background:transparent}
[data-theme="dark"] .flatpickr-day{color:var(--text)}
[data-theme="dark"] .flatpickr-day:hover,[data-theme="dark"] .flatpickr-day:focus{background:var(--grey-bg);border-color:var(--grey-bg)}
[data-theme="dark"] .flatpickr-day.selected{background:var(--primary);border-color:var(--primary);color:#fff}
[data-theme="dark"] .flatpickr-day.flatpickr-disabled,[data-theme="dark"] .flatpickr-day.prevMonthDay,[data-theme="dark"] .flatpickr-day.nextMonthDay{color:var(--muted)}
[data-theme="dark"] .flatpickr-time input,[data-theme="dark"] .flatpickr-time .flatpickr-am-pm,[data-theme="dark"] .flatpickr-time .flatpickr-time-separator{color:var(--text)}
[data-theme="dark"] .flatpickr-time input:hover,[data-theme="dark"] .flatpickr-time .flatpickr-am-pm:hover{background:var(--grey-bg)}
[data-theme="dark"] .flatpickr-months .flatpickr-prev-month svg,[data-theme="dark"] .flatpickr-months .flatpickr-next-month svg{fill:var(--text)}
[data-theme="dark"] .numInputWrapper span{border-color:var(--line2)}
/* ===== Calendario de audiencias ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{margin-bottom:6px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:4px 0}
.cal-cell{min-height:98px;border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--card);display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-cell.cal-out{background:transparent;border:none;min-height:0}
.cal-cell.cal-today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal-dnum{font-size:12px;font-weight:700;color:var(--muted)}
.cal-cell.cal-today .cal-dnum{color:var(--primary)}
.cal-chip{font-size:10.5px;line-height:1.3;padding:3px 6px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.cal-chip.cal-pend{background:var(--gold)}
.cal-chip.cal-cal{background:var(--primary)}
.cal-chip.cal-done{background:var(--green)}
.cal-chip.cal-past{background:var(--muted)}
.cal-chip:hover{filter:brightness(1.1)}
.cal-legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.cal-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
.cal-dot.cal-pend{background:var(--gold)}.cal-dot.cal-cal{background:var(--primary)}.cal-dot.cal-done{background:var(--green)}.cal-dot.cal-past{background:var(--muted)}
@media(max-width:860px){.cal-grid{gap:3px}.cal-cell{min-height:64px;padding:3px}.cal-chip{font-size:9px;padding:2px 3px}.cal-dow{font-size:9px}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.stat .val,.money,td.num,.tabular{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--primary);text-decoration:none}
.hidden{display:none!important}

/* LOGIN */
#login{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2) 60%,var(--primary-d));display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{background:#fff;border-radius:18px;padding:42px 40px;width:420px;max-width:92vw;box-shadow:var(--shadow-lg);text-align:center}
.brand-mark{width:86px;height:100px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.login-card h1{font-size:20px;color:var(--navy);letter-spacing:.5px}
.login-card .sub{color:var(--muted);font-size:13px;margin-top:4px;margin-bottom:26px}
.role-opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;transition:.15s;width:100%}
.role-opt:hover{border-color:var(--primary);background:var(--grey-bg);transform:translateY(-1px)}
.role-opt .ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.role-opt .t{font-weight:600;color:var(--navy)}
.role-opt .d{font-size:12px;color:var(--muted)}
.usersel{margin-top:6px}

/* LAYOUT */
#app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);color:#cdd7e6;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20}
.sidebar .logo{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .logo .m{width:40px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar .logo .n{font-weight:700;color:#fff;font-size:14px;line-height:1.1}
.sidebar .logo .n small{display:block;font-weight:400;color:#8ba0bf;font-size:11px;margin-top:2px}
.nav{padding:14px 12px;flex:1;overflow-y:auto}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6f86a8;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#cdd7e6;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.12s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(31,78,140,.4)}
.nav a .i{width:18px;text-align:center;font-size:15px}
.sidebar .foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.userbox{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.userbox .av{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#3a2c06;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.userbox .nm{font-size:13px;color:#fff;font-weight:600}
.userbox .rl{font-size:11px;color:#8ba0bf}
.logout{margin-top:8px;width:100%;padding:8px;border-radius:8px;color:#9fb1cc;font-size:12px;background:rgba(255,255,255,.05)}
.logout:hover{background:rgba(255,255,255,.1);color:#fff}

.main{margin-left:248px;flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:15}
.topbar .crumb{font-size:13px;color:var(--muted)}
.topbar .crumb b{color:var(--navy);font-weight:600;font-size:16px;display:block}
.bell-btn{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s}
.bell-btn:hover{background:var(--bg)}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e23b3b;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.notif-panel{position:absolute;right:0;top:46px;width:360px;max-height:460px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:40}
.notif-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.notif-h h4{margin:0;font-size:14px;color:var(--navy)}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.notif-item:hover{background:var(--bg)}
.notif-item.unread{background:#f3f8ff}
.notif-item .ni-ic{flex-shrink:0;font-size:17px}
.notif-item .ni-t{font-weight:600;color:var(--navy);font-size:13px}
.notif-item .ni-b{color:var(--muted);font-size:12px;margin-top:1px}
.notif-item .ni-d{color:var(--muted);font-size:11px;margin-top:3px}
.tk-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tk-row:hover{background:var(--bg)}
.tk-row .tk-chk{margin-top:0}
.tk-main{flex:1;cursor:pointer;min-width:0}
.tk-title{font-weight:600;color:var(--navy);font-size:13.5px}
.tk-meta{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-estado{border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:12px;background:#fff;cursor:pointer;text-transform:capitalize}
.tk-estado.est-realizada{background:#e8f7ee;border-color:#bce3c9;color:#1c7a40}
.tk-estado.est-cancelada{background:#f0f0f0;color:#888}
.tk-estado.est-vencida{background:#fdeaea;border-color:#f3c0c0;color:#c0392b}
.tk-estado.est-en_curso{background:#eaf2fd;border-color:#bcd4f3;color:#2563b8}
.tk-kebab{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:17px;line-height:1;color:var(--muted);flex-shrink:0}
.tk-kebab:hover{background:var(--bg)}
.tk-menu{position:fixed;z-index:60;width:228px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.16);padding:6px}
.tk-menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--navy)}
.tk-menu button:hover{background:var(--bg)}
.tk-menu button.danger{color:#d12f2f}
.tk-menu-sep{height:1px;background:var(--line);margin:5px 4px}
.content{padding:26px 28px 60px}

/* COMPONENTS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;transition:.13s;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{filter:brightness(.94)}
.btn-ghost{background:#fff;border:1px solid var(--line2);color:var(--slate)}
.btn-ghost:hover{background:var(--grey-bg);border-color:var(--muted)}
.btn-danger{background:#fff;border:1px solid var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:15px;color:var(--navy)}
.card-b{padding:20px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}

.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:28px;font-weight:700;color:var(--navy);margin-top:6px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
.stat.accent{border-left:4px solid var(--primary)}
.stat.gold{border-left:4px solid var(--gold)}
.stat.green{border-left:4px solid var(--green)}
.stat.amber{border-left:4px solid var(--amber)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:#fafbfc}
td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr.clickable{cursor:pointer;transition:.1s}
tr.clickable:hover{background:var(--grey-bg)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-grey{background:var(--grey-bg);color:var(--slate2)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gold{background:var(--gold-soft);color:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:6px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--text);transition:.12s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,78,140,.12)}
.field textarea{resize:vertical;min-height:80px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red)}
.frow{display:grid;gap:14px}
.fr2{grid-template-columns:1fr 1fr}
.fr3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:760px){.fr2,.fr3{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:9px;padding:8px 0}
.check input{width:auto}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:22px;padding-bottom:0}
.tabs button{padding:11px 15px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--slate)}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.tabs button .pill{display:inline-block;margin-left:6px;background:var(--grey-bg);color:var(--slate2);border-radius:10px;padding:0 7px;font-size:11px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,31,61,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:760px;max-width:96vw;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.modal.sm{width:480px}.modal.lg{width:920px}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{font-size:16px;color:var(--navy)}
.modal-h .x{font-size:22px;color:var(--muted);width:30px;height:30px;border-radius:7px}
.modal-h .x:hover{background:var(--grey-bg)}
.modal-b{padding:22px;max-height:68vh;overflow-y:auto}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gold);margin:6px 0 12px;padding-bottom:6px;border-bottom:1px dashed var(--line2)}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{color:var(--text);font-weight:500}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ico{font-size:38px;opacity:.4;margin-bottom:10px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:200;font-size:13.5px;display:flex;align-items:center;gap:10px;animation:slidein .25s ease}
.toast.err{background:var(--red)}
.toast.ok .i{color:#86efac}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.pagehead h2{font-size:20px;color:var(--navy)}
.pagehead .sub{font-size:13px;color:var(--muted);margin-top:2px}

.timeline{position:relative;padding-left:24px}
.timeline:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item .d{position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}

.tl-item .meta{font-size:12px;color:var(--muted);margin-top:2px}

.alert{padding:12px 15px;border-radius:9px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.alert-warn{background:var(--amber-bg);color:#92400e;border:1px solid #fde68a}
.alert-info{background:var(--blue-bg);color:#1e40af;border:1px solid #bfdbfe}
.alert-ok{background:var(--green-bg);color:#166534;border:1px solid #bbf7d0}
.alert ul{margin:6px 0 0 18px}

.progress{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:8px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:5px;transition:.3s}

.doc-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
.doc-row .ic{width:40px;height:40px;border-radius:9px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.doc-row .meta small{color:var(--muted);font-size:12px}
.driveitem{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:9px;transition:.1s}
.driveitem:hover{background:var(--grey-bg)}
.driveitem .fi{font-size:18px}
.fileinput{border:1.5px dashed var(--line2);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px}

.copy-link{display:flex;gap:8px;align-items:center;background:var(--grey-bg);border:1px solid var(--line);border-radius:9px;padding:8px 8px 8px 14px}
.copy-link input{flex:1;border:none;background:none;font-size:13px;color:var(--slate);outline:none}

/* Convierte un pago a la moneda del caso.
   Convención de tipo de cambio: p.tc = pesos (ARS) por 1 USD. */
function pagoEnMonedaCaso(p, casoMoneda){
  const imp=Number(p.importe||0); if(!imp) return 0;
  if((p.moneda||casoMoneda)===casoMoneda) return imp;            // misma moneda
  const tc=Number(p.tc||0); if(tc>0){
    if(casoMoneda==="USD" && p.moneda==="ARS") return imp/tc;    // pago en pesos sobre precio en USD
    if(casoMoneda==="ARS" && p.moneda==="USD") return imp*tc;    // pago en USD sobre precio en ARS
  }
  return 0; // moneda distinta sin TC: no se puede imputar
}
function cobradoDe(c){ const f=c.finanzas; return (c.pagos||[]).reduce((s,p)=>s+pagoEnMonedaCaso(p,f.moneda),0); }
// Lo cobrado que proviene del SALDO / segunda cuota (todo lo cobrado menos el adelanto).
// La reserva por posible devolución (stand by) se respalda con esta parte, no con el primer pago.
function cobradoSaldoDe(c){ const f=c.finanzas||{};
  const adel=(c.pagos||[]).filter(p=>p.esAdelanto).reduce((s,p)=>s+pagoEnMonedaCaso(p,f.moneda),0);
  return Math.max(cobradoDe(c)-adel,0);
}
// Base de plata cobrada que respalda el stand by (posible devolución) de un caso:
// - Si el caso tiene SALDO / 2ª cuota (pago dividido): se respalda con lo cobrado del saldo,
//   así no se aparta nada hasta que empiecen a pagar esa segunda parte.
// - Si se pagó TODO JUNTO (sin saldo, el pago entra como adelanto): se respalda con TODO lo
//   cobrado, para poder apartar el total del reembolso igual.
function baseReservaStandBy(c){
  const saldoPactado = saldoDe(c);
  return saldoPactado > 0 ? cobradoSaldoDe(c) : cobradoDe(c);
}
function syncAdelanto(c){
  const f=c.finanzas; const ade=Number(f.adelanto||0); c.pagos=c.pagos||[];
  // Si el adelanto se cobró en otra moneda, lo guardamos con su TC.
  const enOtra = f.monedaAdelanto && f.monedaAdelanto!==f.moneda && Number(f.tcAdelanto)>0;
  const aMon = enOtra ? f.monedaAdelanto : f.moneda;
  const aImp = enOtra ? (f.moneda==="USD" ? ade*Number(f.tcAdelanto) : ade/Number(f.tcAdelanto)) : ade;
  const aTc  = enOtra ? Number(f.tcAdelanto) : undefined;
  let p=c.pagos.find(x=>x.esAdelanto);
  if(ade>0){
    if(p){ p.importe=aImp; p.moneda=aMon; p.tc=aTc; p.fecha=f.fechaAdelanto||p.fecha||todayISO(); p.medio=f.medioPago||p.medio; }
    else { c.pagos.push({id:uid("p"),importe:aImp,moneda:aMon,tc:aTc,fecha:f.fechaAdelanto||todayISO(),medio:f.medioPago,obs:"Adelanto inicial",esAdelanto:true}); }
  } else if(p){ c.pagos=c.pagos.filter(x=>!x.esAdelanto); }
}
function saldoDe(c){ const f=c.finanzas; return Math.max(Number(f.montoTotal||0)-Number(f.adelanto||0),0); }
function syncSaldo(c){
  const f=c.finanzas; c.pagos=c.pagos||[]; const saldo=saldoDe(c);
  // Si el saldo se cobró en otra moneda, lo guardamos con su TC; si no, en la moneda del caso.
  const enOtra = f.monedaSaldo && f.monedaSaldo!==f.moneda && Number(f.tcSaldo)>0;
  const sMon = enOtra ? f.monedaSaldo : f.moneda;
  const sImp = enOtra ? (f.moneda==="USD" ? saldo*Number(f.tcSaldo) : saldo/Number(f.tcSaldo)) : saldo;
  const sTc  = enOtra ? Number(f.tcSaldo) : undefined;
  let p=c.pagos.find(x=>x.esSaldo);
  if(f.saldoPagado && saldo>0){
    if(p){ p.importe=sImp; p.moneda=sMon; p.tc=sTc; p.fecha=f.fechaSaldoPago||p.fecha||todayISO(); p.medio=f.medioSaldo||f.medioPago||p.medio; }
    else { c.pagos.push({id:uid("p"),importe:sImp,moneda:sMon,tc:sTc,fecha:f.fechaSaldoPago||todayISO(),medio:f.medioSaldo||f.medioPago,obs:"Saldo / diferencia",esSaldo:true}); }
  } else if(p){ c.pagos=c.pagos.filter(x=>!x.esSaldo); }
}
function recalcEstadoPago(c){ const f=c.finanzas; const cob=cobradoDe(c); const tot=Number(f.montoTotal||0);
  if(f.estadoPago!=='vencido') f.estadoPago = cob<=0?'pendiente':(tot>0&&cob>=tot?'completo':'parcial');
  // mantener sincronizado el estado de cobro nuevo (salvo override manual a vencido/saldo)
  if(f.estadoCobro!=='vencido' && f.estadoCobro!=='saldo_pendiente') f.estadoCobro = cob<=0?'no_cobrado':(tot>0&&cob>=tot?'cobrado_completo':'cobro_parcial');
}

// PROTECCIÓN ANTI-PISADA: nunca dejar en blanco los datos cargados por el cliente.
// Antes de guardar, compara con lo último de la nube y conserva lo que el cliente ya cargó.
function protegerDatosCliente(local, db){
  if(!db || typeof db!=='object' || !local) return;
  ['cliente','cuenta','relato'].forEach(k=>{
    const d=db[k];
    if(d && typeof d==='object'){
      local[k]=local[k]||{};
      for(const f in d){ const lv=local[k][f], dv=d[f];
        if((lv==null||lv==='') && dv!=null && dv!=='') local[k][f]=dv;
      }
    }
  });
  ['adjuntos','cuentasAfectadas','docs'].forEach(k=>{
    if(Array.isArray(db[k]) && db[k].length && (!Array.isArray(local[k]) || local[k].length===0)) local[k]=db[k];
  });
  if(db.formCompletado && !local.formCompletado){ local.formCompletado=true; if(db.formCompletadoFecha)local.formCompletadoFecha=db.formCompletadoFecha; }
  if(db.drive && db.drive.link && (!local.drive || !local.drive.link)){ local.drive=Object.assign({},local.drive,{link:db.drive.link, creada:true}); }
}
async function _proteger(c, noFin){

    if(row&&row.data){ protegerDatosCliente(noFin, row.data);
      // reflejar en memoria para no volver a pisar en el próximo guardado
      ['cliente','cuenta','relato','adjuntos','cuentasAfectadas','docs','drive'].forEach(k=>{ if(noFin[k]!==undefined) c[k]=noFin[k]; });
      if(noFin.formCompletado){ c.formCompletado=noFin.formCompletado; c.formCompletadoFecha=noFin.formCompletadoFecha; }
    }
  }catch(e){ console.error("proteger",e); }
}

async function tareaUpsert(t, isNew){
  if(CLOUD){
    // En altas usamos INSERT (política de inserción); en ediciones usamos UPDATE
    // (política de edición: socio, creador o asignado). Evita el choque de RLS del upsert.
    const exists = (DB.tareas||[]).some(x=>x.id===t.id);
    const insert = isNew===true || (isNew===undefined && !exists);
    const row={ id:t.id, titulo:t.titulo, descripcion:t.descripcion||null, asignados:t.asignados||[], creado_por:t.creado_por, caso_id:t.caso_id||null, cliente_nombre:t.cliente_nombre||null, vence:t.vence||null, hora:t.hora||null, duracion:t.duracion||null, prioridad:t.prioridad||"media", estado:t.estado||"pendiente", observaciones:t.observaciones||null, recordatorio:t.recordatorio||null, privacidad:t.privacidad||"equipo", eventos:t.eventos||{}, updated_at:new Date().toISOString() };
    let res;
    if(insert){ res=await sb.from("tareas").insert(row).select().maybeSingle(); }
    else { const up={...row}; delete up.creado_por; res=await sb.from("tareas").update(up).eq("id",t.id).select().maybeSingle(); }
    if(res.error){ console.error("tareaUpsert",res.error); toast("Error al guardar la tarea: "+res.error.message,"err"); return null; }
    return res.data;
  } else {
    DB.tareas=DB.tareas||[]; const i=DB.tareas.findIndex(x=>x.id===t.id);
    if(i>=0) DB.tareas[i]=t; else DB.tareas.push(t); saveLocal(); return t;
  }
}

// Traduce los errores de Supabase Auth a mensajes en español.
function authErrorEs(error){
  const m=((error&&error.message)||"").toLowerCase();
  if(m.includes("invalid login")||m.includes("invalid credentials")) return "Email o contraseña incorrectos.";
  if(m.includes("email not confirmed")) return "Tu email todavía no fue confirmado. Revisá tu casilla.";
  if(m.includes("invalid email")||m.includes("unable to validate email")) return "El email no tiene un formato válido.";
  if(m.includes("rate limit")||m.includes("too many")) return "Demasiados intentos. Esperá un momento y volvé a probar.";
  if(m.includes("network")||m.includes("failed to fetch")) return "No se pudo conectar. Revisá tu conexión a internet.";
  if(m.includes("user not found")) return "No encontramos una cuenta con ese email.";
  return "No pudimos ingresar. Revisá tu email y contraseña e intentá de nuevo.";
}

let ROUTE="dashboard";
// Token de navegación: se incrementa en cada go(). Cualquier callback asíncrono (carga de
// datos, sync de Drive, refresco realtime) captura el token al arrancar y solo repinta si el
// token sigue igual al terminar. Evita que una carga tardía te cambie a una pantalla anterior.
let NAV_TOKEN=0;
// ---- Routing por URL (hash) ----
// El hash refleja la pantalla actual (#casos, #caso=C-0001, #finanzas…) para que F5 te devuelva
// donde estabas y puedas compartir el link a un caso. No interfiere con el formulario del cliente (#form=).
let _suppressHash=false;
const HASH_ROUTES=["dashboard","casos","calendario","tareas","presupuestos","finanzas","operativa","config","usuarios"];
function routeFromHash(){
  const h=(location.hash||"").replace(/^#/,"");
  if(!h || h.startsWith("form=") || h.startsWith("google=")) return null;
  if(h.startsWith("caso=")){ const id=h.slice(5); return DB.casos&&DB.casos.some(c=>c.id===id)?{route:"caso",arg:id}:{route:"casos"}; }
  return HASH_ROUTES.includes(h)?{route:h}:null;
}
function syncHash(route,arg){
  if(route==="form") return;
  const h = route==="caso" ? ("caso="+(arg||"")) : route;
  if((location.hash||"").replace(/^#/,"")!==h){ _suppressHash=true; try{ location.hash=h; }catch(e){} }
}
window.addEventListener("hashchange",function(){
  if(_suppressHash){ _suppressHash=false; return; }
  if((location.hash||"").startsWith("#form=")) return;
  if(!SESSION) return;
  const r=routeFromHash(); if(r) go(r.route, r.arg);
});
function initApp(){
  document.getElementById("uav").textContent = SESSION.nombre.split(" ").map(s=>s[0]).slice(0,2).join("");
  document.getElementById("unm").textContent = SESSION.nombre;
  document.getElementById("url").textContent = isSocio()?"Socio / Administrador":"Colaborador";
  setLogos(); buildNav(); renderBell();
  const _r=routeFromHash(); if(_r){ go(_r.route, _r.arg); } else { go("dashboard"); }
  loadPresupuestosCloud(); startDatePickers();
  const bt=document.getElementById("buildTag"); if(bt)bt.textContent="Versión "+BUILD;
}
function buildNav(){
  const items=[
    {k:"dashboard", i:"▦", t:"Panel"},
    {k:"casos", i:"📁", t:"Casos"},
    {k:"calendario", i:"🗓️", t:"Calendario"},
    {k:"tareas", i:"✅", t:"Tareas"},
    {k:"presupuestos", i:"🧾", t:"Presupuestos"},
  ];
  if(isSocio()) items.push({k:"finanzas", i:"💰", t:"Finanzas global"});
  if(isSocio()) items.push({k:"operativa", i:"📅", t:"Caja operativa"});
  items.push({k:"config", i:"⚙️", t:"Configuración"});
  if(isSocio()) items.push({k:"usuarios", i:"👥", t:"Usuarios y abogados"});
  let h=`<div class="sec">General</div>`;
  items.forEach(it=>{ h+=`<a id="nav-${it.k}" onclick="go('${it.k}')"><span class="i">${it.i}</span><span>${it.t}</span></a>`; });
  document.getElementById("nav").innerHTML=h;
}
function setActiveNav(k){ document.querySelectorAll(".nav a").forEach(a=>a.classList.remove("active")); const el=document.getElementById("nav-"+k); if(el) el.classList.add("active"); }
/* ---- Modo oscuro ---- */
function applyTheme(t){ t=(t==='dark')?'dark':'light'; document.documentElement.setAttribute('data-theme',t); try{localStorage.setItem('gmj_theme',t);}catch(e){} const b=document.getElementById('themeToggle'); if(b) b.textContent=(t==='dark')?'☀️':'🌙'; }
function toggleTheme(){ const cur=(document.documentElement.getAttribute('data-theme')==='dark')?'dark':'light'; applyTheme(cur==='dark'?'light':'dark'); }
function initTheme(){ let t='light'; try{ t=localStorage.getItem('gmj_theme')||'light'; }catch(e){} applyTheme(t); }
/* ---- Menú lateral en celular (cajón) ---- */
function toggleSidebar(){ const s=document.querySelector('.sidebar'); const o=document.getElementById('navOverlay'); if(!s)return; const open=!s.classList.contains('open'); s.classList.toggle('open',open); if(o)o.classList.toggle('show',open); }
function closeSidebar(){ const s=document.querySelector('.sidebar'); const o=document.getElementById('navOverlay'); if(s)s.classList.remove('open'); if(o)o.classList.remove('show'); }
function setCrumb(t, sub){ document.getElementById("crumb").innerHTML = (sub?`${esc(sub)} `:"")+`<b>${esc(t)}</b>`; }
function topActions(html){ document.getElementById("topActions").innerHTML=html||""; }

function go(route, arg){
  ROUTE=route; NAV_TOKEN++; topActions(""); closeSidebar();
  if(route==="dashboard"){ setActiveNav("dashboard"); renderDashboard(); }
  else if(route==="casos"){ setActiveNav("casos"); renderCasos(); }
  else if(route==="calendario"){ setActiveNav("calendario"); renderCalendario(); }
  else if(route==="tareas"){ setActiveNav("tareas"); renderTareas(); }
  else if(route==="presupuestos"){ setActiveNav("presupuestos"); renderPresupuestos(); }
  else if(route==="caso"){ setActiveNav("casos"); CURRENT=DB.casos.find(c=>c.id===arg); ACTIVE_TAB="resumen"; EDIT_AUD=null; renderCaso(); autoSyncDrive(CURRENT); }
  else if(route==="finanzas"){ setActiveNav("finanzas"); renderFinanzasGlobal(); }
  else if(route==="operativa"){ setActiveNav("operativa"); renderCajaOperativa(); }
  else if(route==="config"){ setActiveNav("config"); renderConfig(); }
  else if(route==="usuarios"){ setActiveNav("usuarios"); renderUsuarios(); }
  else if(route==="form"){ renderClientForm(arg); }
  syncHash(route,arg);
  window.scrollTo(0,0);
}

/* ============================================================
   CALENDARIO DE AUDIENCIAS
   ============================================================ */
let CAL_MONTH="";
// Número de audiencia dentro del caso (1 = la más temprana por fecha/hora).
function audOrdN(c,a){ const A=audsOf(c).filter(x=>x.fecha).slice().sort((x,y)=>((x.fecha||'')+(x.hora||'')).localeCompare((y.fecha||'')+(y.hora||''))); const idx=A.findIndex(x=>x.id===a.id); return idx>=0?idx+1:1; }
function _ordFem(n){ return n+'ª'; }
function audEventos(){ const evs=[]; casosActivos().forEach(c=>audsOf(c).forEach(a=>{ if(a.fecha) evs.push({c,a,n:audOrdN(c,a)}); })); return evs; }
// Agenda de próximas audiencias (lista cronológica, agrupada por día).
function calAgendaHtml(){
  const hoy=todayISO();
  const man=new Date(Date.now()+864e5).toISOString().slice(0,10);
  const fut=audEventos().filter(e=>!e.a.realizada && e.a.fecha>=hoy).sort((x,y)=>((x.a.fecha)+(x.a.hora||'')).localeCompare((y.a.fecha)+(y.a.hora||''))).slice(0,15);
  if(!fut.length) return `<div class="card" style="padding:16px;margin-bottom:16px"><div class="card-h" style="padding:0 0 6px 0"><h3>⏭️ Próximas audiencias</h3></div><div class="empty" style="padding:16px">No hay audiencias próximas.</div></div>`;
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  let rows='', curDay='';
  fut.forEach(e=>{
    if(e.a.fecha!==curDay){ curDay=e.a.fecha; const dd=new Date(e.a.fecha+'T00:00:00'); const rel=e.a.fecha===hoy?'HOY · ':(e.a.fecha===man?'MAÑANA · ':''); rows+=`<div style="font-size:12px;font-weight:700;color:${e.a.fecha===hoy?'var(--primary)':'var(--muted)'};text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px">${rel}${dias[dd.getDay()]} ${fdate(e.a.fecha)}</div>`; }
    rows+=`<div class="clickable" onclick="calAudMenu('${e.c.id}','${e.a.id}')" style="display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer">
      <div style="font-weight:700;font-size:15px;min-width:52px;color:var(--primary)">${esc(e.a.hora||'--:--')}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(clienteFull(e.c))} <span class="badge b-grey" style="font-size:10.5px">${e.n}ª audiencia</span></div><div style="font-size:12px;color:var(--muted)">${esc(e.c.id)}${e.a.modalidad?' · '+esc(e.a.modalidad):''}${e.a.lugar?' · '+esc(e.a.lugar):''}</div></div>
      <span class="badge ${e.a.calCreado?'b-blue':'b-gold'}">${e.a.calCreado?'En calendario':'Agendada'}</span>
    </div>`;
  });
  return `<div class="card" style="padding:16px;margin-bottom:16px"><div class="card-h" style="padding:0 0 6px 0"><h3>⏭️ Próximas audiencias</h3><span class="badge b-gold">${fut.length}</span></div>${rows}</div>`;
}
function renderCalendario(){
  setCrumb("Calendario de audiencias"); topActions("");
  if(!/^\d{4}-\d{2}$/.test(CAL_MONTH)) CAL_MONTH=new Date().toISOString().slice(0,7);
  const [Y,M]=CAL_MONTH.split('-').map(Number);
  const evs=audEventos();
  const byDay={}; evs.forEach(e=>{ (byDay[e.a.fecha]=byDay[e.a.fecha]||[]).push(e); });
  Object.values(byDay).forEach(arr=>arr.sort((x,y)=>(x.a.hora||'').localeCompare(y.a.hora||'')));
  const startDow=(new Date(Y,M-1,1).getDay()+6)%7, dim=new Date(Y,M,0).getDate();
  const hoy=todayISO();
  const mesNom=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][M-1];
  const dowNames=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell cal-out"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const chips=(byDay[ds]||[]).map(e=>{
      const col=e.a.realizada?'cal-done':(ds<hoy?'cal-past':(e.a.calCreado?'cal-cal':'cal-pend'));
      const ape=(e.c.cliente.apellido||clienteFull(e.c)).split(' ')[0];
      return `<div class="cal-chip ${col}" title="${esc(clienteFull(e.c))} · ${esc(e.a.hora||'')} · ${_ordFem(e.n)} audiencia (${esc(e.c.id)})" onclick="event.stopPropagation();calAudMenu('${e.c.id}','${e.a.id}')">${esc(e.a.hora||'')} ${esc(ape)} · ${_ordFem(e.n)}</div>`;
    }).join("");
    cells+=`<div class="cal-cell ${ds===hoy?'cal-today':''}"><div class="cal-dnum">${d}</div>${chips}</div>`;
  }
  const t=new Date(), dow=(t.getDay()+6)%7, lun=new Date(t); lun.setDate(t.getDate()-dow); const dom=new Date(lun); dom.setDate(lun.getDate()+6);
  const iso=x=>x.toISOString().slice(0,10);
  document.getElementById("view").innerHTML=`
    <div class="pagehead"><div><h2>Calendario de audiencias</h2><div class="sub">${evs.length} audiencias cargadas</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-ghost btn-sm" onclick="calMes(-1)">←</button>
        <b style="min-width:140px;text-align:center">${mesNom} ${Y}</b>
        <button class="btn btn-ghost btn-sm" onclick="calMes(1)">→</button>
        <button class="btn btn-ghost btn-sm" onclick="CAL_MONTH='';renderCalendario()">Hoy</button>
      </div></div>
    ${calAgendaHtml()}
    <div class="card" style="padding:14px;margin-bottom:16px">
      <div class="card-h" style="padding:0 0 10px 0"><h3>🗓️ Vista mensual</h3></div>
      <div class="cal-grid cal-head">${dowNames.map(n=>`<div class="cal-dow">${n}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-legend"><span><span class="cal-dot cal-pend"></span>Agendada</span><span><span class="cal-dot cal-cal"></span>En calendario</span><span><span class="cal-dot cal-done"></span>Realizada</span><span><span class="cal-dot cal-past"></span>Pasada</span></div>
    </div>
    <div class="card" style="padding:16px">
      <div class="card-h" style="padding:0 0 10px 0"><h3>📄 Exportar a texto para compartir</h3></div>
      <div class="frow fr3" style="align-items:end">
        <div class="field" style="margin:0"><label>Desde</label><input type="date" id="cal_desde" value="${iso(lun)}"></div>
        <div class="field" style="margin:0"><label>Hasta</label><input type="date" id="cal_hasta" value="${iso(dom)}"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="calRango('semana')">Esta semana</button><button class="btn btn-ghost btn-sm" onclick="calRango('mes')">Este mes</button></div>
      </div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="calExportar()">Generar texto</button>
      <div id="cal_out" style="margin-top:12px"></div>
    </div>`;
  setTimeout(initCalPickers,0);
}
function calMes(delta){ if(!/^\d{4}-\d{2}$/.test(CAL_MONTH)) CAL_MONTH=new Date().toISOString().slice(0,7); let [Y,M]=CAL_MONTH.split('-').map(Number); M+=delta; if(M<1){M=12;Y--;} if(M>12){M=1;Y++;} CAL_MONTH=`${Y}-${String(M).padStart(2,'0')}`; renderCalendario(); }
function calSetFecha(id,v){ const el=document.getElementById(id); if(el){ el.value=v; if(el._flatpickr) el._flatpickr.setDate(v,false); } }
function calRango(tipo){
  const t=new Date();
  if(tipo==='semana'){ const dow=(t.getDay()+6)%7; const lun=new Date(t); lun.setDate(t.getDate()-dow); const dom=new Date(lun); dom.setDate(lun.getDate()+6); calSetFecha('cal_desde',lun.toISOString().slice(0,10)); calSetFecha('cal_hasta',dom.toISOString().slice(0,10)); }
  else { const Y=t.getFullYear(),M=t.getMonth(); calSetFecha('cal_desde',new Date(Y,M,1).toISOString().slice(0,10)); calSetFecha('cal_hasta',new Date(Y,M+1,0).toISOString().slice(0,10)); }
  calExportar();
}
function calExportar(){
  const desde=val("cal_desde"), hasta=val("cal_hasta"); if(!desde||!hasta){ toast("Elegí el rango de fechas","err"); return; }
  const evs=audEventos().filter(e=>e.a.fecha>=desde && e.a.fecha<=hasta).sort((x,y)=>((x.a.fecha)+(x.a.hora||'')).localeCompare((y.a.fecha)+(y.a.hora||'')));
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  let txt=`AUDIENCIAS · ${fdate(desde)} al ${fdate(hasta)}\n`;
  if(!evs.length){ txt+='\n(No hay audiencias en ese rango.)'; }
  let curDay='';
  evs.forEach(e=>{
    if(e.a.fecha!==curDay){ curDay=e.a.fecha; const dd=new Date(e.a.fecha+'T00:00:00'); txt+=`\n${dias[dd.getDay()]} ${fdate(e.a.fecha)}\n`; }
    txt+=`  ${e.a.hora||'--:--'} · ${clienteFull(e.c)} (${e.c.id}) — ${_ordFem(e.n)} audiencia${e.a.modalidad?' · '+e.a.modalidad:''}${e.a.linkReunion?' · '+e.a.linkReunion:''}${e.a.realizada?' [realizada]':''}\n`;
  });
  document.getElementById("cal_out").innerHTML=`<textarea id="cal_txt" rows="12" style="width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:pre">${esc(txt)}</textarea>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-primary btn-sm" onclick="calCopiar()">📋 Copiar</button><button class="btn btn-ghost btn-sm" onclick="calDescargar()">⬇ Descargar .txt</button></div>`;
}
function calCopiar(){ const t=document.getElementById("cal_txt"); if(!t)return; t.select(); try{ navigator.clipboard.writeText(t.value); }catch(e){ try{document.execCommand('copy');}catch(_){} } toast("Copiado al portapapeles ✓"); }
function calDescargar(){ const t=document.getElementById("cal_txt"); if(!t)return; const blob=new Blob([t.value],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="audiencias.txt"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
function initCalPickers(){ if(typeof flatpickr==='undefined')return; try{ ['cal_desde','cal_hasta'].forEach(id=>{ var el=document.getElementById(id); if(el && !el._flatpickr) flatpickr(el,{dateFormat:"Y-m-d",altInput:true,altFormat:"j M Y",locale:(flatpickr.l10ns&&flatpickr.l10ns.es)?"es":"default"}); }); }catch(e){} }
// Unifica TODOS los selectores de fecha del portal: flatpickr en español, dd/mm/aaaa.
// (Los input[type=month] quedan nativos porque flatpickr requeriría un plugin extra.)
function fpDate(el){ if(!el||el._flatpickr) return; try{ flatpickr(el,{dateFormat:"Y-m-d",altInput:true,altFormat:"d/m/Y",allowInput:true,locale:(flatpickr.l10ns&&flatpickr.l10ns.es)?"es":"default"}); }catch(e){} }
function initDatePickers(root){ if(typeof flatpickr==='undefined')return; (root||document).querySelectorAll('input[type="date"]:not([data-fp])').forEach(el=>{ el.setAttribute('data-fp','1'); fpDate(el); }); }
let _dpStarted=false;
function startDatePickers(){ if(_dpStarted||typeof flatpickr==='undefined')return; _dpStarted=true; initDatePickers(document);
  if(typeof MutationObserver==='undefined')return; let _q=false;
  new MutationObserver(()=>{ if(_q)return; _q=true; requestAnimationFrame(()=>{ _q=false; initDatePickers(document); }); }).observe(document.body,{childList:true,subtree:true}); }
// Menú rápido desde el calendario/agenda: ver y cambiar el estado de la audiencia sin entrar al caso.
function calAudMenu(cid,aid){
  const c=DB.casos.find(x=>x.id===cid); if(!c) return;
  const a=audsOf(c).find(x=>x.id===aid); if(!a) return;
  const n=audOrdN(c,a);
  const estBadge=a.realizada?'<span class="badge b-green">Realizada</span>':(a.calCreado?'<span class="badge b-blue">En calendario</span>':'<span class="badge b-gold">Agendada</span>');
  modal({title:"Audiencia · "+clienteFull(c), size:"", body:`
    <div style="font-size:14px;line-height:1.7">
      <div><b>📅 ${fdate(a.fecha)} · ${esc(a.hora||'—')}</b> <span class="badge b-grey">${n}ª audiencia</span></div>
      <div style="color:var(--muted);font-size:13px">${esc(c.id)}${a.modalidad?' · '+esc(a.modalidad):''}${a.lugar?' · '+esc(a.lugar):''}${a.linkReunion?' · con link':''}</div>
      <div style="margin-top:8px">Estado: ${estBadge}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
      ${a.realizada
        ? `<button class="btn btn-ghost" onclick="calSetRealizada('${cid}','${aid}',false)">↩ Marcar como pendiente</button>`
        : `<button class="btn btn-primary" onclick="calSetRealizada('${cid}','${aid}',true)">✓ Marcar como realizada</button>`}
      <button class="btn btn-ghost" onclick="closeModal();ACTIVE_TAB='mediacion';go('caso','${cid}')">📁 Abrir el caso</button>
    </div>`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`});
}
async function calSetRealizada(cid,aid,val){
  const c=DB.casos.find(x=>x.id===cid); if(!c) return; ensureAudiencias(c);
  const a=c.audiencias.find(x=>x.id===aid); if(!a) return;
  a.realizada=!!val;
  logAction(c, val?"Audiencia marcada como realizada (desde el calendario)":"Audiencia marcada como pendiente (desde el calendario)");
  await persistCaso(c);
  closeModal(); toast(val?"Marcada como realizada ✓":"Marcada como pendiente");
  if(ROUTE==="calendario") renderCalendario(); else if(ROUTE==="dashboard") renderDashboard();
}

function renderDashboard(){
  setCrumb("Panel de control");
  const cs=casosActivos();
  const activos=cs.filter(c=>!["Cerrado","Resultado negativo"].includes(c.estado)).length;
  const rehab=cs.filter(c=>c.estado==="Cuenta rehabilitada").length;
  const pendDoc=cs.filter(c=>c.estado==="Documentación pendiente").length;
  // próximas acciones
  const today=todayISO();
  const venc=cs.filter(c=>c.fechaLimite).sort((a,b)=>a.fechaLimite.localeCompare(b.fechaLimite));
  let finCards="", gastosRow="";
  if(isSocio()){
    let totalUSD=0, cobradoUSD=0, totalARS=0, cobradoARS=0, dejUSD=0, dejARS=0;
    cs.forEach(c=>{ const f=c.finanzas; const pagado=cobradoDe(c); // cobrado en la moneda pactada (convierte pagos en pesos)
      const noCob=Math.max(Number(f.montoTotal||0)-pagado,0);
      if(f.moneda==="USD"){ totalUSD+=Number(f.montoTotal||0); cobradoUSD+=pagado; if(f.saldoIncobrable) dejUSD+=noCob; } else { totalARS+=Number(f.montoTotal||0); cobradoARS+=pagado; if(f.saldoIncobrable) dejARS+=noCob; } });
    const pendUSD=Math.max(totalUSD-cobradoUSD-dejUSD,0), pendARS=Math.max(totalARS-cobradoARS-dejARS,0);
    finCards=`
      <div class="stat gold"><div class="lab">Facturación pactada (USD)</div><div class="val">${money(totalUSD,"USD")}</div><div class="sub">Cobrado: ${money(cobradoUSD,"USD")} · Pendiente: ${money(pendUSD,"USD")}</div></div>
      <div class="stat green"><div class="lab">Facturación pactada (ARS)</div><div class="val">${money(totalARS,"ARS")}</div><div class="sub">Cobrado: ${money(cobradoARS,"ARS")}</div></div>`;
    // gastos generales del estudio (suma de todos los casos)
    let gPendARS=0,gAbonARS=0,gPendUSD=0,gAbonUSD=0;
    const sumarGasto=g=>{ if(g.categoria==="adelanto_socio"||g.categoria==="ingreso")return; const imp=Number(g.importe||0); if(!imp||g.estado==="no corresponde")return; const usd=g.moneda==="USD"; const ab=g.estado==="abonado"; if(usd){ ab?gAbonUSD+=imp:gPendUSD+=imp; } else { ab?gAbonARS+=imp:gPendARS+=imp; } };
    cs.forEach(c=>(c.gastos||[]).forEach(sumarGasto));
    (DB.gastosGen||[]).forEach(sumarGasto);
    gastosRow=`<div class="grid g4" style="margin-bottom:18px">

async function archivarCaso(id, arch){
  const c=DB.casos.find(x=>x.id===id); if(!c) return;
  if(arch && !confirm("¿Archivar este caso? Dejará de aparecer en el listado principal. Se puede restaurar cuando quieras.")) return;
  c.archivado=arch; c.archivadoPor=arch?SESSION.id:null; c.archivadoEn=arch?now():null;
  logAction(c, arch?"Caso archivado":"Caso restaurado");
  await persistCaso(c);
  toast(arch?"Caso archivado":"Caso restaurado");
  if(arch && ROUTE==="caso"){ go("casos"); } else if(ROUTE==="caso"){ renderCaso(); } else { renderCasos(); }
}
function eliminarCasoDef(id){
  if(!isSocio()){ toast("Solo los socios pueden eliminar definitivamente","err"); return; }
  const c=DB.casos.find(x=>x.id===id);
  modal({title:"Eliminar caso definitivamente", size:"sm", body:`
    <div class="alert alert-warn" style="margin-bottom:12px"><span>⚠</span><div>Vas a eliminar <b>${esc(c?clienteFull(c):id)}</b> (${esc(id)}) de forma <b>definitiva</b>. Esta acción <b>no se puede deshacer</b>.</div></div>
    <div class="field" style="margin:0"><label>Motivo de la eliminación (opcional)</label><textarea id="del_motivo" rows="2" placeholder="Ej: caso duplicado, cargado por error…"></textarea></div>`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="eliminarCasoConfirmado('${id}')">🗑 Eliminar definitivamente</button>`});

async function eliminarCasoConfirmado(id){
  const motivo=(document.getElementById("del_motivo")||{}).value||"";
  closeModal();
  if(CLOUD){
    try{
      await sb.from("audit_log").insert({accion:"Caso eliminado definitivamente", caso_id:id, detalle:motivo, usuario:SESSION.id});
      const {error}=await sb.from("casos").delete().eq("id",id);
      if(error){ toast("Error al eliminar: "+error.message,"err"); return; }
    }catch(e){ console.error(e); toast("Error al eliminar","err"); return; }
  }
  DB.casos=DB.casos.filter(c=>c.id!==id);
  if(!CLOUD) saveLocal();
  CURRENT=null; toast("Caso eliminado"); go("casos");
}
function caseProgress(c){
  let done=0,total=7;
  if(c.cliente.dni) done++;
  if(c.cuenta.url) done++;
  if(c.relato.original||c.relato.sintesis) done++;
  if((c.adjuntos||[]).some(a=>a.tipo==="DNI frente")) done++;
  if(c.docs.some(d=>d.tipo==="contrato")) done++;
  if(c.docs.some(d=>d.tipo==="carta_poder")) done++;
  if(c.docs.some(d=>d.tipo==="mediacion")) done++;
  return Math.round(done/total*100);
}

  if(CLOUD && sb){ try{ const {data,error}=await sb.rpc('siguiente_caso_num'); if(!error && data!=null){ const n=Number(data); if(n>(DB.counter||0)) DB.counter=n; return {n, id:"C-"+String(n).padStart(4,"0")}; } }catch(e){ console.warn("siguiente_caso_num",e); } }

const AV_STATUS={completo:{c:'st-completo',i:'✓',t:'Completo'},pendiente:{c:'st-pendiente',i:'•',t:'Pendiente'},nc:{c:'st-nc',i:'–',t:'No corresponde'},revision:{c:'st-revision',i:'?',t:'En revisión'},observado:{c:'st-observado',i:'!',t:'Observado'}};
function avBlocks(c){
  const cl=c.cliente,cu=c.cuenta,re=c.relato,f=c.finanzas;
  const adj=t=>(c.adjuntos||[]).some(a=>a.tipo===t);
  const doc=t=>c.docs.filter(d=>d.tipo===t).sort((a,b)=>b.version-a.version)[0];
  const dmin=(t,es)=>{const d=doc(t);return !!(d&&es.includes(d.estado));};
  const b=v=>v?'completo':'pendiente';
  const blocks=[
    {t:"Datos del cliente", items:[
      ["cli_pers","Datos personales completos",b(cl.nombre&&cl.apellido&&cl.dni)],
      ["cli_dom","Domicilio completo",b(cl.domicilio&&cl.localidad&&cl.provincia)],
      ["cli_tel","Teléfono",b(cl.tel)],["cli_mail","Mail",b(cl.email)],
      ["cli_dnif","DNI frente",b(adj("DNI frente"))],["cli_dnid","DNI dorso",b(adj("DNI dorso"))],
    ]},
    {t:"Cuenta afectada", items:[
      ["cu_url","URL de la cuenta",b(cu.url)],["cu_handle","Usuario / handle",b(cu.handle)],
      ["cu_mail","Mail vinculado",b(cu.emailVinc)],["cu_tel","Teléfono vinculado",b(cu.telVinc)],
      ["cu_relato","Relato de hechos",b(re.original||re.sintesis)],
      ["cu_capt","Capturas de suspensión",b(adj("Captura aviso de suspensión"))],
      ["cu_pru","Pruebas adicionales",b(adj("Otra documentación")||adj("Conversaciones / pruebas")||adj("Captura de la cuenta"))],
    ]},
    {t:"Documentación legal", items:[
      ["dl_cg","Contrato generado",b(doc("contrato"))],
      ["dl_ce","Contrato enviado",b(dmin("contrato",["enviado","firmado","final"]))],
      ["dl_cf","Contrato firmado",b(dmin("contrato",["firmado","final"]))],
      ["dl_pg","Carta poder generada",b(doc("carta_poder"))],
      ["dl_pe","Carta poder enviada",b(dmin("carta_poder",["enviado","firmado","final"]))],
      ["dl_pf","Carta poder firmada",b(dmin("carta_poder",["firmado","final"]))],
      ["dl_mg","Planilla de mediación generada",b(doc("mediacion"))],
    ]},
    {t:"Mediación", items:[
      ["me_med","Mediador asignado",b(DB.config.mediador)],
      ["me_gen","Solicitud de mediación generada",b(doc("mediacion"))],
      ["me_env","Solicitud enviada",b(dmin("mediacion",["enviado","firmado","final"]))],
      ["me_fec","Fecha de audiencia",b(audsOf(c).some(a=>a.fecha))],
      ["me_cal","Audiencia cargada en calendario",b(audsOf(c).some(a=>a.calCreado))],
      ["me_real","Audiencia realizada",b(audsOf(c).some(a=>a.realizada))],
    ]},
  ];
  if(isSocio()){
    blocks.splice(3,0,{t:"Finanzas", items:[
      ["fi_comp","Comprobante de pago recibido",b(adj("Comprobante de pago"))],
      ["fi_adel","Adelanto abonado",b(Number(f.adelanto||0)>0)],
      ["fi_sal","Saldo cancelado",f.montoTotal!==""?b(Number(f.saldo||0)<=0):'pendiente'],
      ["fi_full","Pago completo",b(f.estadoPago==='completo')],
    ]});
  }
  return blocks;
}
function avEff(c,key,auto){ return (c.avance&&c.avance[key])?c.avance[key]:auto; }
function setAv(key,v){ CURRENT.avance=CURRENT.avance||{}; if(v==="auto"){delete CURRENT.avance[key];}else{CURRENT.avance[key]=v;} save(); renderTab(); }
function tabAvance(c){
  const html=avBlocks(c).map(bl=>{
    const total=bl.items.length;
    const nc=bl.items.filter(([k,l,a])=>avEff(c,k,a)==='nc').length;
    const done=bl.items.filter(([k,l,a])=>avEff(c,k,a)==='completo').length;
    const pct=(total-nc)>0?Math.round(done/(total-nc)*100):100;
    const items=bl.items.map(([k,l,a])=>{
      const st=avEff(c,k,a); const s=AV_STATUS[st]||AV_STATUS.pendiente; const ov=c.avance&&c.avance[k];
      return `<div class="av-item"><div class="lab"><span class="ic ${s.c}">${s.i}</span>${esc(l)}</div>
        <select onchange="setAv('${k}',this.value)"><option value="auto" ${!ov?'selected':''}>Auto · ${AV_STATUS[a].t}</option>
        ${Object.entries(AV_STATUS).map(([v,o])=>`<option value="${v}" ${ov===v?'selected':''}>${o.t}</option>`).join("")}</select></div>`;
    }).join("");
    return `<div class="av-block"><div class="h">${esc(bl.t)}<span class="pct">${pct}%</span></div>${items}</div>`;
  }).join("");
  return `<div class="alert alert-info"><span>🧭</span><div>Cada bloque es independiente y avanza por separado. El estado se calcula solo según los datos cargados; podés sobrescribirlo manualmente (En revisión, Observado, No corresponde).</div></div>
    <div class="av-grid">${html}</div>`;
}

function generarSintesis(){
  const orig=val("re_orig").trim();
  if(!orig){ toast("Cargá primero el relato original","err"); return; }
  const c=CURRENT, cl=c.cliente||{}, cu=c.cuenta||{}, re=c.relato||{};
  const titular = (cl.nombre||cl.apellido)?`${cl.nombre||""} ${cl.apellido||""}`.trim():"el titular";
  const plat = cu.plataforma||"Meta";
  const cuenta = cu.handle||cu.url||"su cuenta";
  const fecha = re.fechaSusp?fdate(re.fechaSusp):null;
  const comercial = (cu.tipo==="Negocio"||cu.tipo==="Comercial"||cu.pautaActiva||cu.businessManager);
  const nAdic=(Array.isArray(c.cuentasAfectadas)?c.cuentasAfectadas.filter(q=>q.url||q.emailVinc).length:0);
  // Borrador siguiendo el prompt: 3ra persona, narrativo, buena fe, sin viñetas.
  const p1=`El presente caso involucra a ${titular}, titular legítimo de la cuenta ${cuenta} en la plataforma ${plat}${comercial?", utilizada como herramienta de trabajo y desarrollo de su actividad profesional y económica":""}. ${titular} se ha desempeñado de buena fe dentro de la plataforma, dando un uso personal y/o profesional legítimo a su cuenta.`;
  const p2=`${fecha?`Con fecha ${fecha}, `:""}la cuenta fue objeto de una medida de suspensión/inhabilitación por parte de la plataforma, la cual fue comunicada con invocación genérica de presuntas infracciones a las Normas Comunitarias, sin brindarse precisiones concretas ni una vía de revisión efectiva que permitiera al titular ejercer adecuadamente su derecho de defensa.${re.mensaje?` La comunicación recibida refirió: “${re.mensaje}”.`:""}`;
  const p3=`Ante dicha medida, ${titular} actuó diligentemente${re.apelo?", presentando la correspondiente apelación a través de los canales oficiales habilitados por la plataforma y aportando la documentación requerida para acreditar su identidad y titularidad":", procurando obtener una revisión de la medida por los canales disponibles"}.${re.recibioResp?" El titular recibió comunicaciones de la plataforma en el marco de dichas gestiones.":""}`;
  const p4=`La medida adoptada ocasionó al titular un perjuicio relevante, privándolo del acceso a su cuenta, a sus contactos, a su contenido y a su actividad${comercial?" comercial, con la consiguiente afectación económica, profesional y reputacional":" personal"}.${nAdic>0?` Cabe destacar que la situación alcanza, además, a otras ${nAdic} cuenta(s) vinculada(s) del mismo titular, individualizadas en el presente informe en orden de prioridad de recuperación.`:""}`;
  const p5=`A partir de los elementos reseñados surge la buena fe del titular y la legitimidad de su reclamo, encontrándose acreditada documentalmente su identidad y titularidad sobre la cuenta. En tal sentido, se solicita respetuosamente que se disponga una nueva revisión humana e integral del caso, contemplando las circunstancias particulares expuestas.`;
  const p6=`El titular manifiesta su plena buena fe, su voluntad de cumplir con las políticas de la plataforma y su total predisposición para aportar cualquier información adicional que resulte necesaria para una adecuada evaluación del caso.`;
  document.getElementById("re_sint").value=[p1,p2,p3,p4,p5,p6].join("\n\n");
  toast("Borrador de síntesis generado — revisalo y editalo");
}

// Importar un backup JSON en el BORRADOR (solo modo local). Aligera los documentos
// generados (html con imágenes) para no exceder el límite de almacenamiento.
function importarBackup(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(String(r.result));
        if(!data||!Array.isArray(data.casos)){ toast("El archivo no parece un backup válido","err"); return; }
        if(!confirm("Esto reemplaza los datos de ESTE BORRADOR con los del backup ("+data.casos.length+" casos). Tus datos reales en la nube NO se tocan. ¿Continuar?"))return;
        // aligerar: quitar el html pesado de los documentos generados (no se necesita para probar)
        (data.casos||[]).forEach(c=>{ (c.docs||[]).forEach(d=>{ if(d&&d.html){ d.html=""; d._aligerado=true; } }); });
        DB=data; migrate();
        try{ saveLocal(); }catch(e){ toast("Datos cargados, pero son muy grandes para guardar localmente: "+e.message,"err"); }
        toast("✓ Backup importado ("+(DB.casos||[]).length+" casos). Recargando…");
        setTimeout(()=>location.reload(),900);
      }catch(e){ toast("No se pudo leer el backup: "+(e.message||e),"err"); }
    };
    r.readAsText(f);
  };
  inp.click();
}

const SUBCARPETAS=["01 - Datos del cliente","02 - DNI","03 - Pruebas y capturas","04 - Mediación","05 - Documentación generada","06 - Contrato y poder","07 - Comprobantes de pago"];
function tabDrive(c){
  if(!c.drive.creada){
    return `<div class="card"><div class="card-b"><div class="empty"><div class="ico">📁</div>
      <p style="margin-bottom:6px">Aún no se creó la carpeta de Google Drive para este caso.</p>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Se creará automáticamente: <b>${esc(driveFolderName(c))}</b></p>
      <button class="btn btn-primary" onclick="createDrive()">📁 Crear carpeta en Drive</button></div></div></div>`;
  }
  const subs=SUBCARPETAS.map(s=>`<div class="driveitem"><span class="fi">📁</span><div style="flex:1"><b>${esc(s)}</b></div><small style="color:var(--muted)">${countSub(c,s)} archivos</small></div>`).join("");
  return `<div class="card"><div class="card-h"><h3>${esc(driveFolderName(c))}</h3>
    <a class="btn btn-gold btn-sm" href="${esc(c.drive.link||'#')}" target="_blank">Abrir en Drive ↗</a></div>
    <div class="card-b">
      <div class="copy-link" style="margin-bottom:16px"><input readonly value="${esc(c.drive.link)}"><button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText('${esc(c.drive.link)}');toast('Link copiado')">Copiar</button></div>
      ${subs}
    </div></div>`;

function countSub(c,s){
  if(s.includes("DNI")) return (c.adjuntos||[]).filter(a=>a.tipo.includes("DNI")).length;
  if(s.includes("Pruebas")) return (c.adjuntos||[]).filter(a=>a.tipo.includes("Captura")||a.tipo.includes("Conversaciones")).length;
  if(s.includes("Documentación generada")||s.includes("Contrato")) return c.docs.length;
  if(s.includes("Comprobantes")) return (c.pagos||[]).length;
  return 0;
}
async function repushDrive(){
  if(!CLOUD){ toast("Disponible solo en la versión nube","err"); return; }
  toast("Pasando respaldos a Drive…");
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(FUNCTIONS_URL+"/drive-sync",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},body:JSON.stringify({casoId:CURRENT.id,action:"repush"})});
    const j=await r.json();
    if(j.error){ toast("Error: "+(j.detail||j.error),"err"); return; }
    logAction(CURRENT,`Respaldos pasados a Drive: ${j.pushed||0} ok${j.failed?(", "+j.failed+" con error"):""}`);
    await cloudLoad(); CURRENT=DB.casos.find(c=>c.id===CURRENT.id)||CURRENT;
    if((j.pushed||0)>0) toast(`✅ ${j.pushed} archivo(s) subido(s) a Drive`);
    else if((j.sinRespaldo||0)>0) toast("No hay respaldos para pasar (esos archivos no tienen copia)","err");
    else toast("No quedaban respaldos pendientes");
    renderCaso();
  }catch(e){ console.error(e); toast("Error al reintentar","err"); }
}
// B53: al abrir un caso, si hay archivos del cliente que aún no están en Drive (respaldo sin link)
// o falta la carpeta, se sube todo automáticamente (crea carpeta + pasa respaldos). Silencioso.
async function autoSyncDrive(c){
  if(!CLOUD||!sb||!c||!c.formCompletado) return;
  const pend=(c.adjuntos||[]).some(a=>a.respaldo && !a.link);
  const faltaCarpeta=!c.drive || !c.drive.creada;
  if(!pend && !faltaCarpeta) return;      // ya está todo en Drive
  if(c._syncing) return; c._syncing=true;
  const myNav=NAV_TOKEN;                   // caso desde el que se disparó; si navegás, no repinta
  try{
    const {data:{session}}=await sb.auth.getSession(); if(!session) return;
    const r=await fetch(FUNCTIONS_URL+"/drive-sync",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},body:JSON.stringify({casoId:c.id,action:"repush"})});
    const j=await r.json().catch(()=>({}));
    if(j && j.ok){
      if((j.pushed||0)>0){
        await cloudLoad(); if(CURRENT&&CURRENT.id===c.id) CURRENT=DB.casos.find(x=>x.id===c.id)||CURRENT;
        if(NAV_TOKEN===myNav && ROUTE==="caso"&&CURRENT&&CURRENT.id===c.id) renderCaso();
        toast(j.pushed+" archivo(s) sincronizado(s) a Drive ✓");
      }
    } else if(j && j.error==="drive-no-conectado"){
      console.warn("autoSyncDrive: Drive no conectado —", j.detail||"");
    }
  }catch(e){ console.warn("autoSyncDrive",e); }
  finally{ c._syncing=false; }
}
// Guarda un documento generado (PDF) en la carpeta de Drive del caso (usa la acción upload de drive-sync).
async function guardarDocEnDrive(d, silent){
  if(!CLOUD||!sb){ if(!silent)toast("Solo en la versión nube","err"); return; }
  try{
    if(!silent) toast("Guardando el documento en Drive…");
    const nombre=docTitle(d.tipo).replace(/[ /]+/g,"_")+"_v"+(d.version||1)+"_"+clienteFull(CURRENT).replace(/[ ,]+/g,"_")+".pdf";
    const b64=await docToPdfBase64(d);
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(FUNCTIONS_URL+"/drive-sync",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},body:JSON.stringify({casoId:CURRENT.id,action:"upload",tipo:docTitle(d.tipo),nombre,mime:"application/pdf",base64:b64})});
    const j=await r.json();
    if(j&&j.ok){ if(j.drive){ if(!silent)toast("✓ Documento guardado en la carpeta de Drive"); } else if(!silent) toast("Guardado en respaldo (Google del estudio no conectado)","err"); }
    else if(!silent) toast("No se pudo guardar en Drive: "+((j&&(j.detail||j.error))||"error"),"err");
  }catch(e){ console.error("guardarDocEnDrive",e); if(!silent)toast("Error al guardar el documento en Drive","err"); }
}
// Genera/actualiza la "Ficha de datos" en Drive para TODOS los casos (para los cargados antes de esta función).
async function generarFichasTodos(){
  if(!CLOUD||!sb){ toast("Solo en la versión nube","err"); return; }
  const casos=(DB.casos||[]).filter(c=>c && ((c.cliente&&(c.cliente.apellido||c.cliente.nombre))||c.formCompletado));
  if(!casos.length){ toast("No hay casos con datos para procesar","err"); return; }
  if(!confirm("Se va a generar/actualizar la 'Ficha de datos' en la carpeta de Drive de "+casos.length+" casos. Puede tardar unos minutos. No cierres la página. ¿Continuar?"))return;
  toast("Generando fichas en Drive… ("+casos.length+" casos)");
  let ok=0,fail=0;
  const {data:{session}}=await sb.auth.getSession(); const tk=session&&session.access_token;
  for(const c of casos){
    try{ const r=await fetch(FUNCTIONS_URL+"/drive-sync",{method:"POST",headers:{"Authorization":"Bearer "+tk,"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},body:JSON.stringify({casoId:c.id,action:"datos"})}); const j=await r.json(); if(j&&j.ok)ok++; else fail++; }
    catch(e){ fail++; }
    await new Promise(res=>setTimeout(res,450));
  }
  toast("✓ Fichas generadas en Drive: "+ok+" ok"+(fail?(" · "+fail+" con error"):""));
}
async function createDrive(){
