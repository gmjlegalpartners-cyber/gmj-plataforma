<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMJ Legal Partners — Plataforma de Gestión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0f1f3d; --navy2:#16294d; --slate:#1e293b; --slate2:#334155;
  --muted:#64748b; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f1f5f9; --card:#ffffff;
  --gold:#c0972f; --gold-soft:#f7efda; --primary:#1f4e8c; --primary-d:#163a69;
  --green:#15803d; --green-bg:#dcfce7; --amber:#b45309; --amber-bg:#fef3c7;
  --red:#b91c1c; --red-bg:#fee2e2; --blue:#1d4ed8; --blue-bg:#dbeafe;
  --grey-bg:#f1f5f9; --text:#0f172a; --shadow:0 1px 3px rgba(15,31,61,.08),0 1px 2px rgba(15,31,61,.06);
  --shadow-lg:0 10px 30px rgba(15,31,61,.12); --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--primary);text-decoration:none}
.hidden{display:none!important}

/* LOGIN */
#login{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2) 60%,var(--primary-d));display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{background:#fff;border-radius:18px;padding:42px 40px;width:420px;max-width:92vw;box-shadow:var(--shadow-lg);text-align:center}
.brand-mark{width:86px;height:100px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.login-card h1{font-size:20px;color:var(--navy);letter-spacing:.5px}
.login-card .sub{color:var(--muted);font-size:13px;margin-top:4px;margin-bottom:26px}
.role-opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;transition:.15s;width:100%}
.role-opt:hover{border-color:var(--primary);background:#f8fafc;transform:translateY(-1px)}
.role-opt .ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.role-opt .t{font-weight:600;color:var(--navy)}
.role-opt .d{font-size:12px;color:var(--muted)}
.usersel{margin-top:6px}

/* LAYOUT */
#app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);color:#cdd7e6;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20}
.sidebar .logo{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .logo .m{width:40px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar .logo .n{font-weight:700;color:#fff;font-size:14px;line-height:1.1}
.sidebar .logo .n small{display:block;font-weight:400;color:#8ba0bf;font-size:11px;margin-top:2px}
.nav{padding:14px 12px;flex:1;overflow-y:auto}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6f86a8;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#cdd7e6;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.12s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(31,78,140,.4)}
.nav a .i{width:18px;text-align:center;font-size:15px}
.sidebar .foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.userbox{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.userbox .av{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#3a2c06;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.userbox .nm{font-size:13px;color:#fff;font-weight:600}
.userbox .rl{font-size:11px;color:#8ba0bf}
.logout{margin-top:8px;width:100%;padding:8px;border-radius:8px;color:#9fb1cc;font-size:12px;background:rgba(255,255,255,.05)}
.logout:hover{background:rgba(255,255,255,.1);color:#fff}

.main{margin-left:248px;flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:15}
.topbar .crumb{font-size:13px;color:var(--muted)}
.topbar .crumb b{color:var(--navy);font-weight:600;font-size:16px;display:block}
.content{padding:26px 28px 60px}

/* COMPONENTS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;transition:.13s;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{filter:brightness(.94)}
.btn-ghost{background:#fff;border:1px solid var(--line2);color:var(--slate)}
.btn-ghost:hover{background:#f8fafc;border-color:var(--muted)}
.btn-danger{background:#fff;border:1px solid var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:15px;color:var(--navy)}
.card-b{padding:20px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}

.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:28px;font-weight:700;color:var(--navy);margin-top:6px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
.stat.accent{border-left:4px solid var(--primary)}
.stat.gold{border-left:4px solid var(--gold)}
.stat.green{border-left:4px solid var(--green)}
.stat.amber{border-left:4px solid var(--amber)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:#fafbfc}
td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr.clickable{cursor:pointer;transition:.1s}
tr.clickable:hover{background:#f8fafc}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-grey{background:var(--grey-bg);color:var(--slate2)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gold{background:var(--gold-soft);color:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:6px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--text);transition:.12s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,78,140,.12)}
.field textarea{resize:vertical;min-height:80px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red)}
.frow{display:grid;gap:14px}
.fr2{grid-template-columns:1fr 1fr}
.fr3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:760px){.fr2,.fr3{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:9px;padding:8px 0}
.check input{width:auto}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:22px;padding-bottom:0}
.tabs button{padding:11px 15px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--slate)}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.tabs button .pill{display:inline-block;margin-left:6px;background:var(--grey-bg);color:var(--slate2);border-radius:10px;padding:0 7px;font-size:11px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,31,61,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:760px;max-width:96vw;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.modal.sm{width:480px}.modal.lg{width:920px}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{font-size:16px;color:var(--navy)}
.modal-h .x{font-size:22px;color:var(--muted);width:30px;height:30px;border-radius:7px}
.modal-h .x:hover{background:var(--grey-bg)}
.modal-b{padding:22px;max-height:68vh;overflow-y:auto}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gold);margin:6px 0 12px;padding-bottom:6px;border-bottom:1px dashed var(--line2)}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{color:var(--text);font-weight:500}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ico{font-size:38px;opacity:.4;margin-bottom:10px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:200;font-size:13.5px;display:flex;align-items:center;gap:10px;animation:slidein .25s ease}
.toast.err{background:var(--red)}
.toast.ok .i{color:#86efac}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.pagehead h2{font-size:20px;color:var(--navy)}
.pagehead .sub{font-size:13px;color:var(--muted);margin-top:2px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{width:100%;padding-left:34px}
.search .si{position:absolute;left:11px;top:8px;color:var(--muted)}

.timeline{position:relative;padding-left:24px}
.timeline:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item .d{position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tl-item .act{font-weight:600;color:var(--navy);font-size:13.5px}
.tl-item .meta{font-size:12px;color:var(--muted);margin-top:2px}

.alert{padding:12px 15px;border-radius:9px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.alert-warn{background:var(--amber-bg);color:#92400e;border:1px solid #fde68a}
.alert-info{background:var(--blue-bg);color:#1e40af;border:1px solid #bfdbfe}
.alert-ok{background:var(--green-bg);color:#166534;border:1px solid #bbf7d0}
.alert ul{margin:6px 0 0 18px}

.progress{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:8px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:5px;transition:.3s}

.doc-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
.doc-row .ic{width:40px;height:40px;border-radius:9px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.doc-row .meta small{color:var(--muted);font-size:12px}
.driveitem{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:9px;transition:.1s}
.driveitem:hover{background:#f8fafc}
.driveitem .fi{font-size:18px}
.fileinput{border:1.5px dashed var(--line2);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px}

.copy-link{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:8px 8px 8px 14px}
.copy-link input{flex:1;border:none;background:none;font-size:13px;color:var(--slate);outline:none}

/* checklist / tablero de avance */
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.av-block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.av-block .h{padding:13px 16px;background:var(--navy);color:#fff;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:space-between}
.av-block .h .pct{font-size:12px;font-weight:700;color:#cbb06a}
.av-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px}
.av-item:last-child{border-bottom:none}
.av-item .lab{display:flex;align-items:center;gap:8px}
.av-item .ic{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:#fff}
.st-completo{background:var(--green)}.st-pendiente{background:#cbd5e1;color:#475569}.st-nc{background:#94a3b8}.st-revision{background:var(--blue)}.st-observado{background:var(--amber)}
.av-item select{font-size:11.5px;padding:3px 6px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--slate)}
.av-item.auto select{display:none}
.av-item .autoflag{font-size:10px;color:var(--muted);font-style:italic}

/* print / document preview */
.docview{font-family:"Times New Roman",Georgia,serif;color:#000;background:#fff;line-height:1.5}
.docview h1{text-align:center;font-size:15px;margin-bottom:2px}
.docview h2{text-align:center;font-size:14px;margin-bottom:18px}
.docview p{margin-bottom:11px;text-align:justify;font-size:13px}
.docview .sig{margin-top:50px;display:flex;justify-content:space-around;text-align:center;font-size:12.5px}

@media(max-width:860px){.sidebar{width:64px}.sidebar .logo .n,.nav .sec,.nav a span:not(.i),.userbox .nm,.userbox .rl,.logout{display:none}.main{margin-left:64px}.nav a{justify-content:center}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="brand-mark" id="loginLogo"></div>
    <h1>GMJ LEGAL PARTNERS</h1>
    <div class="sub">Plataforma interna de gestión de casos</div>

</div>

<div id="modalRoot"></div>

<script>

let DB, SESSION=null, CURRENT=null, ACTIVE_TAB="resumen";
function loadLocal(){ const r=localStorage.getItem("gmj_db_v1"); DB = r?JSON.parse(r):seed(); migrate(); if(!r) saveLocal(); }
function migrate(){
  let changed=false;
  // actualizar domicilio de Meta a la nueva sede
  (DB.config.requeridos||[]).forEach(q=>{ if(/meta/i.test(q.nombre) && /menlo park|1 meta way/i.test(q.domicilio||"")){ q.domicilio="7300 Gateway Boulevard, Shipping & Receiving Dock 15, Newark, CA 94560, United States of America."; changed=true; } });
  if(DB.config.asistenteMail===undefined){ DB.config.asistenteMail="asistente@gmj-abogados.com.ar"; changed=true; }
  // asegurar campos nuevos en casos existentes
  (DB.casos||[]).forEach(c=>{ if(c.citarFacebook===undefined){ c.citarFacebook=true; changed=true; } if(c.avance===undefined){ c.avance={}; changed=true; } if(c.audiencia===undefined){ c.audiencia=null; changed=true; } });
  if(changed) save();
}
function cobradoDe(c){ const f=c.finanzas; return (c.pagos||[]).reduce((s,p)=>s+(p.moneda===f.moneda?Number(p.importe||0):0),0); }
function syncAdelanto(c){
  const f=c.finanzas; const ade=Number(f.adelanto||0); c.pagos=c.pagos||[];
  let p=c.pagos.find(x=>x.esAdelanto);
  if(ade>0){
    if(p){ p.importe=ade; p.moneda=f.moneda; p.fecha=f.fechaAdelanto||p.fecha||new Date().toISOString().slice(0,10); p.medio=f.medioPago||p.medio; }
    else { c.pagos.push({id:uid("p"),importe:ade,moneda:f.moneda,fecha:f.fechaAdelanto||new Date().toISOString().slice(0,10),medio:f.medioPago,obs:"Adelanto inicial",esAdelanto:true}); }
  } else if(p){ c.pagos=c.pagos.filter(x=>!x.esAdelanto); }
}
function recalcEstadoPago(c){ const f=c.finanzas; if(f.estadoPago==='vencido') return; const cob=cobradoDe(c); const tot=Number(f.montoTotal||0); f.estadoPago = cob<=0?'pendiente':(tot>0&&cob>=tot?'completo':'parcial'); }
function saveLocal(){ localStorage.setItem("gmj_db_v1", JSON.stringify(DB)); }
function save(){ if(CLOUD){ cloudSave(); } else { saveLocal(); } }
function uid(p){ return p+Math.random().toString(36).slice(2,8); }

/* ---------- CAPA DE NUBE (Supabase) ---------- */
function isSocioRole(){ return SESSION && SESSION.rol==="socio"; }
async function cloudLoad(){
  const [st, profs, cs, fin] = await Promise.all([
    sb.from("settings").select("data").eq("id",1).maybeSingle(),
    sb.from("profiles").select("id,nombre,rol"),
    sb.from("casos").select("id,data,form_token"),
    sb.from("case_finance").select("*")
  ]);
  const cfg = (st.data && st.data.data) || {};
  DB = {
    config:{ estudio:cfg.estudio||{}, asistenteMail:cfg.asistenteMail||"", mediador:cfg.mediador||"", requeridos:cfg.requeridos||[], objeto:cfg.objeto||"" },
    abogados: cfg.abogados||[],
    usuarios: (profs.data||[]).map(p=>({id:p.id,nombre:p.nombre,rol:p.rol})),
    casos: [],
    counter: cfg.counter||0
  };
  const finMap={}; (fin.data||[]).forEach(f=>finMap[f.caso_id]=f);
  DB.casos = (cs.data||[]).map(row=>{
    const c = row.data||{}; c.id=row.id; c.formToken=row.form_token||c.formToken||null;
    const ff=finMap[row.id];
    if(ff){ c.finanzas=ff.finanzas||c.finanzas; c.pagos=ff.pagos||c.pagos; }
    else if(!isSocioRole()){ c.finanzas={moneda:"USD",montoTotal:"",adelanto:"",saldo:"",devolucion:"",estadoPago:"",fechaAdelanto:"",fechaSaldo:"",medioPago:"",obs:""}; c.pagos=[]; }
    return c;
  });
  DB.casos.sort((a,b)=>(b.id||"").localeCompare(a.id||""));
}
let _saveTimer=null;
function cloudSave(){ if(!sb) return; if(_saveTimer) clearTimeout(_saveTimer); _saveTimer=setTimeout(doCloudSave,350); }
async function doCloudSave(){
  try{
    const cfg={ estudio:DB.config.estudio, asistenteMail:DB.config.asistenteMail, mediador:DB.config.mediador, requeridos:DB.config.requeridos, objeto:DB.config.objeto, abogados:DB.abogados, counter:DB.counter };
    await sb.from("settings").upsert({id:1, data:cfg, updated_at:new Date().toISOString()});
    const c = CURRENT;
    if(c){
      const noFin = JSON.parse(JSON.stringify(c)); delete noFin.finanzas; delete noFin.pagos;
      await sb.from("casos").upsert({ id:c.id, data:noFin, cliente_nombre:clienteFull(c), estado:c.estado, form_token:c.formToken||null, updated_at:new Date().toISOString(), updated_by:SESSION.id });
      if(isSocio()) await sb.from("case_finance").upsert({ caso_id:c.id, finanzas:c.finanzas||{}, pagos:c.pagos||[], updated_at:new Date().toISOString() });
    }
  }catch(e){ console.error("cloudSave",e); toast("Error guardando en la nube","err"); }
}
async function cloudInsertCase(c){
  const noFin = JSON.parse(JSON.stringify(c)); delete noFin.finanzas; delete noFin.pagos;
  await sb.from("casos").insert({ id:c.id, data:noFin, cliente_nombre:clienteFull(c), estado:c.estado, form_token:c.formToken||null, updated_by:SESSION.id });
  if(isSocio()) await sb.from("case_finance").upsert({ caso_id:c.id, finanzas:c.finanzas||{}, pagos:c.pagos||[] });
  const cfg={ estudio:DB.config.estudio, asistenteMail:DB.config.asistenteMail, mediador:DB.config.mediador, requeridos:DB.config.requeridos, objeto:DB.config.objeto, abogados:DB.abogados, counter:DB.counter };
  await sb.from("settings").upsert({id:1, data:cfg});
}
function bindRealtime(){
  if(!sb || RT_BOUND) return; RT_BOUND=true;
  sb.channel("gmj-db")
    .on("postgres_changes",{event:"*",schema:"public",table:"casos"}, cloudRefresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"case_finance"}, cloudRefresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"settings"}, cloudRefresh)
    .subscribe();
}
let _refreshTimer=null;
function cloudRefresh(){
  if(_refreshTimer) clearTimeout(_refreshTimer);
  _refreshTimer=setTimeout(async()=>{
    if(document.getElementById("modalRoot").innerHTML.trim()) return; // no interrumpir edición
    const curId = CURRENT ? CURRENT.id : null; const tab = ACTIVE_TAB;
    await cloudLoad();
    if(ROUTE==="caso" && curId){ CURRENT=DB.casos.find(c=>c.id===curId)||null; ACTIVE_TAB=tab; if(CURRENT) renderCaso(); else go("casos"); }
    else if(ROUTE) go(ROUTE);
  }, 250);
}
function isSocio(){ return SESSION && SESSION.rol==="socio"; }
function userName(id){ const u=DB.usuarios.find(x=>x.id===id); return u?u.nombre:"—"; }
function abLabel(id){ const a=DB.abogados.find(x=>x.id===id); return a?a.nombre:"—"; }
function now(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function logAction(c, accion){ c.historial.unshift({accion, usuario:SESSION.id, fecha:now()}); }

/* ---------- HELPERS ---------- */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function money(n,m){ if(n==null||n==="") return "—"; const sym=m==="USD"?"USD ":"$ "; return sym+Number(n).toLocaleString("es-AR"); }
function fdate(s){ if(!s) return "—"; const p=s.split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s; }
function toast(msg, type){ const r=document.getElementById("toastRoot"); const t=document.createElement("div"); t.className="toast "+(type||"ok"); t.innerHTML=`<span class="i">${type==="err"?"⚠":"✓"}</span>${esc(msg)}`; r.appendChild(t); setTimeout(()=>t.remove(),2800); }
function clienteFull(c){ return ((c.cliente.apellido||"")+" "+(c.cliente.nombre||"")).trim()||"Sin nombre"; }
function driveFolderName(c){ const ap=(c.cliente.apellido||"APELLIDO").toUpperCase(); const no=c.cliente.nombre||"Nombre"; const plat=c.cuenta.plataforma||"Instagram"; return `${ap}, ${no} - Cuenta ${plat} - Reclamo Meta`; }

async function cloudSignIn(){
  const email=val("lg_email").trim(), pass=val("lg_pass");
  const msg=document.getElementById("lg_msg"); msg.textContent="Ingresando…";
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ msg.textContent="No pudimos ingresar: "+error.message; return; }
  await afterAuth();
}
async function afterAuth(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){ renderCloudLogin(); return; }
  const {data:prof}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  SESSION={ id:user.id, nombre:(prof&&prof.nombre)||user.email, rol:(prof&&prof.rol)||"empleado" };
  await cloudLoad();
  bindRealtime();
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  initApp();
  handleGoogleHash();
}

function setActiveNav(k){ document.querySelectorAll(".nav a").forEach(a=>a.classList.remove("active")); const el=document.getElementById("nav-"+k); if(el) el.classList.add("active"); }
function setCrumb(t, sub){ document.getElementById("crumb").innerHTML = (sub?`${esc(sub)} `:"")+`<b>${esc(t)}</b>`; }
function topActions(html){ document.getElementById("topActions").innerHTML=html||""; }

function go(route, arg){
  ROUTE=route; topActions("");
  if(route==="dashboard"){ setActiveNav("dashboard"); renderDashboard(); }
  else if(route==="casos"){ setActiveNav("casos"); renderCasos(); }
  else if(route==="caso"){ setActiveNav("casos"); CURRENT=DB.casos.find(c=>c.id===arg); ACTIVE_TAB="resumen"; renderCaso(); }
  else if(route==="finanzas"){ setActiveNav("finanzas"); renderFinanzasGlobal(); }
  else if(route==="config"){ setActiveNav("config"); renderConfig(); }
  else if(route==="usuarios"){ setActiveNav("usuarios"); renderUsuarios(); }
  else if(route==="form"){ renderClientForm(arg); }
  window.scrollTo(0,0);
}

function renderDashboard(){

  const rehab=cs.filter(c=>c.estado==="Cuenta rehabilitada").length;
  const pendDoc=cs.filter(c=>c.estado==="Documentación pendiente").length;
  // próximas acciones
  const today=new Date().toISOString().slice(0,10);
  const venc=cs.filter(c=>c.fechaLimite).sort((a,b)=>a.fechaLimite.localeCompare(b.fechaLimite));
  let finCards="";

    let totalUSD=0, cobradoUSD=0, totalARS=0, cobradoARS=0;
    cs.forEach(c=>{ const f=c.finanzas; const pagado=(c.pagos||[]).reduce((s,p)=>s+(p.moneda===f.moneda?Number(p.importe||0):0),0);
      if(f.moneda==="USD"){ totalUSD+=Number(f.montoTotal||0); cobradoUSD+=pagado; } else { totalARS+=Number(f.montoTotal||0); cobradoARS+=pagado; } });

  let estadoBreak={};
  cs.forEach(c=>estadoBreak[c.estado]=(estadoBreak[c.estado]||0)+1);

      <td><span class="badge ${ESTADO_COLOR[c.estado]||'b-grey'}">${esc(c.estado)}</span></td>
    </tr>`;
  }).join("") || `<tr><td colspan="4" class="empty">Sin fechas límite cargadas</td></tr>`;

  document.getElementById("view").innerHTML=`
    <div class="pagehead"><div><h2>Hola, ${esc(SESSION.nombre.split(" ")[0])} 👋</h2><div class="sub">${isSocio()?"Vista completa del estudio":"Vista operativa"} · ${cs.length} casos en total</div></div>

    <div class="grid g4" style="margin-bottom:18px">
      <div class="stat accent"><div class="lab">Casos activos</div><div class="val">${activos}</div><div class="sub">de ${cs.length} totales</div></div>
      <div class="stat amber"><div class="lab">Documentación pendiente</div><div class="val">${pendDoc}</div><div class="sub">requieren seguimiento</div></div>
      ${isSocio()?finCards:`<div class="stat green"><div class="lab">Cuentas rehabilitadas</div><div class="val">${rehab}</div><div class="sub">resultados positivos</div></div><div class="stat"><div class="lab">Tareas abiertas</div><div class="val">${cs.reduce((s,c)=>s+(c.tareas||[]).filter(t=>!t.hecha).length,0)}</div></div>`}
    </div>
    <div class="grid" style="grid-template-columns:1.6fr 1fr">
      <div class="card"><div class="card-h"><h3>Próximas acciones y vencimientos</h3></div>
        <table><thead><tr><th>Cliente</th><th>Próxima acción</th><th>Fecha límite</th><th>Estado</th></tr></thead><tbody>${vencRows}</tbody></table></div>

   ============================================================ */
let FILTER={q:"",estado:""};
function renderCasos(){
  setCrumb("Casos");
  topActions(`<button class="btn btn-primary" onclick="openNewCase()">＋ Nuevo caso</button>`);
  const opts=ESTADOS.map(e=>`<option ${FILTER.estado===e?'selected':''}>${e}</option>`).join("");
  let list=DB.casos.filter(c=>{
    const matchQ=!FILTER.q || (clienteFull(c)+c.id+(c.cuenta.handle||"")).toLowerCase().includes(FILTER.q.toLowerCase());
    const matchE=!FILTER.estado || c.estado===FILTER.estado;
    return matchQ && matchE;
  });
  const rows=list.map(c=>{
    const prog=caseProgress(c);
    return `<tr class="clickable" onclick="go('caso','${c.id}')">
      <td><b style="color:var(--navy)">${esc(clienteFull(c))}</b><br><small style="color:var(--muted)">${esc(c.id)} · ${fdate(c.fechaAlta)}</small></td>
      <td>${esc(c.cuenta.handle||"—")}<br><small style="color:var(--muted)">${esc(c.cuenta.plataforma||"")}</small></td>
      <td><span class="badge ${ESTADO_COLOR[c.estado]||'b-grey'}"><span class="dot"></span>${esc(c.estado)}</span></td>
      <td>${esc(abLabel(c.abogadoPatrocinante))}</td>
      <td style="width:130px"><div style="font-size:11px;color:var(--muted)">${prog}% completo</div><div class="progress"><i style="width:${prog}%"></i></div></td>
      <td>${c.fechaLimite?`<span class="badge ${c.fechaLimite<new Date().toISOString().slice(0,10)?'b-red':'b-grey'}">${fdate(c.fechaLimite)}</span>`:'—'}</td>
    </tr>`;
  }).join("");
  document.getElementById("view").innerHTML=`
    <div class="pagehead"><div><h2>Casos</h2><div class="sub">${list.length} de ${DB.casos.length} casos</div></div></div>
    <div class="filters">
      <div class="search"><span class="si">🔎</span><input id="fq" placeholder="Buscar por cliente, ID o usuario…" value="${esc(FILTER.q)}" oninput="FILTER.q=this.value;renderCasos();document.getElementById('fq').focus()"></div>
      <select onchange="FILTER.estado=this.value;renderCasos()"><option value="">Todos los estados</option>${opts}</select>
      ${FILTER.estado||FILTER.q?`<button class="btn btn-ghost btn-sm" onclick="FILTER={q:'',estado:''};renderCasos()">Limpiar</button>`:''}
    </div>
    <div class="card">
      <table><thead><tr><th>Cliente</th><th>Cuenta</th><th>Estado</th><th>Patrocinante</th><th>Avance</th><th>Límite</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6"><div class="empty"><div class="ico">📁</div>No hay casos que coincidan</div></td></tr>'}</tbody></table>
    </div>`;
  setTimeout(()=>{const fq=document.getElementById('fq');if(fq){fq.focus();fq.setSelectionRange(fq.value.length,fq.value.length);}},0);
}
function caseProgress(c){
  let done=0,total=7;
  if(c.cliente.dni) done++;
  if(c.cuenta.url) done++;
  if(c.relato.original||c.relato.sintesis) done++;
  if((c.adjuntos||[]).some(a=>a.tipo==="DNI frente")) done++;
  if(c.docs.some(d=>d.tipo==="contrato")) done++;
  if(c.docs.some(d=>d.tipo==="carta_poder")) done++;
  if(c.docs.some(d=>d.tipo==="mediacion")) done++;
  return Math.round(done/total*100);
}

function createCase(){
  const ap=val("nc_ap").trim(), no=val("nc_no").trim();
  if(!ap||!no){ toast("Apellido y nombre son obligatorios","err"); return; }
  DB.counter=(DB.counter||0)+1;
  const id="C-"+String(DB.counter).padStart(4,"0");
  const c=demoCase(); // base shape
  Object.assign(c,{
    id, estado:"Nuevo caso", fechaAlta:new Date().toISOString().slice(0,10),
    responsable:val("nc_resp"), abogadoPatrocinante:val("nc_ab"),
    proximaAccion:"Enviar formulario al cliente", fechaLimite:"",
    cliente:{apellido:ap.toUpperCase(), nombre:no, dni:"", cuit:"", nacionalidad:"Argentina", fechaNac:"", estadoCivil:"", conyuge:"", domicilio:"", localidad:"", provincia:"", cp:"", tel:val("nc_tel"), email:val("nc_email")},
    cuenta:{plataforma:val("nc_plat"), url:"", handle:val("nc_handle"), emailVinc:"", telVinc:"", tipo:"", pautaActiva:false, saldoRetenido:false, cuentasVinc:"", businessManager:false, metodoPago:false, campanasActivas:false, hackeo:false},
    relato:{fechaSusp:"",mensaje:"",tipoSusp:"",apelo:false,recibioResp:false,hackeo:false,recupParcial:false,volvioSusp:false,perdida:"",original:"",sintesis:""},
    finanzas:{moneda:"USD",montoTotal:"",adelanto:"",saldo:"",fechaAdelanto:"",fechaSaldo:"",devolucion:"",estadoPago:"pendiente",medioPago:"",obs:""},
    pagos:[],
    gastos:GASTOS_DEFAULT.map(n=>({id:uid("g"),nombre:n,estado:"pendiente",importe:"",moneda:"ARS",fecha:"",medio:"",obs:"",adjunto:""})),
    docs:[], tareas:[], adjuntos:[], drive:{link:"",creada:false}, objeto:DB.config.objeto, citarFacebook:true, audiencia:null, avance:{},
    historial:[], formToken:null, observaciones:""
  });
  logAction(c,"Caso creado");
  DB.casos.unshift(c);
  if(CLOUD){ CURRENT=c; cloudInsertCase(c); } else { save(); }
  closeModal(); toast("Caso "+id+" creado");
  go("caso", id);
}

function renderCaso(){
  const c=CURRENT; if(!c){ go("casos"); return; }
  setCrumb(clienteFull(c), "Casos /");
  topActions(`<button class="btn btn-ghost btn-sm" onclick="go('casos')">← Volver</button>`);
  let tabs=[
    ["resumen","Resumen"],["avance","Avance"],["cliente","Cliente"],["cuenta","Cuenta afectada"],["relato","Relato"],
    ["doc","Documentación"],["drive","Drive"],["docs","Documentos"],["mediacion","Mediación"],["gastos","Gastos"]
  ];
  if(isSocio()) tabs.push(["finanzas","Finanzas"]);
  tabs.push(["tareas","Tareas"],["historial","Historial"],["obs","Observaciones"]);
  const tabBtns=tabs.map(([k,t])=>{
    let pill="";
    if(k==="docs"&&c.docs.length) pill=`<span class="pill">${c.docs.length}</span>`;
    if(k==="tareas"){const n=(c.tareas||[]).filter(t=>!t.hecha).length; if(n)pill=`<span class="pill">${n}</span>`;}
    if(k==="doc"&&(c.adjuntos||[]).length) pill=`<span class="pill">${c.adjuntos.length}</span>`;
    return `<button class="${ACTIVE_TAB===k?'active':''}" onclick="ACTIVE_TAB='${k}';renderCaso()">${t}${pill}</button>`;
  }).join("");

  const header=`
    <div class="card" style="margin-bottom:18px"><div class="card-b" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px">
      <div>
        <div style="font-size:19px;font-weight:700;color:var(--navy)">${esc(clienteFull(c))}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:3px">${esc(c.id)} · ${esc(c.cuenta.handle||"sin cuenta")} · Alta ${fdate(c.fechaAlta)}</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <select onchange="changeEstado(this.value)" style="padding:8px 12px;border:1px solid var(--line2);border-radius:8px;font-weight:600">
          ${ESTADOS.map(e=>`<option ${c.estado===e?'selected':''}>${e}</option>`).join("")}
        </select>
      </div>
    </div></div>`;

  document.getElementById("view").innerHTML = header + `<div class="tabs">${tabBtns}</div><div id="tabBody"></div>`;
  renderTab();
}
function changeEstado(e){ CURRENT.estado=e; logAction(CURRENT,"Estado cambiado a: "+e); save(); toast("Estado actualizado"); }

function renderTab(){
  const c=CURRENT, t=ACTIVE_TAB, el=document.getElementById("tabBody");
  if(t==="resumen") el.innerHTML=tabResumen(c);
  else if(t==="avance") el.innerHTML=tabAvance(c);
  else if(t==="cliente") el.innerHTML=tabCliente(c);
  else if(t==="cuenta") el.innerHTML=tabCuenta(c);
  else if(t==="relato") el.innerHTML=tabRelato(c);
  else if(t==="doc") el.innerHTML=tabDoc(c);
  else if(t==="drive") el.innerHTML=tabDrive(c);
  else if(t==="docs") el.innerHTML=tabDocs(c);
  else if(t==="mediacion") el.innerHTML=tabMediacion(c);
  else if(t==="gastos") el.innerHTML=tabGastos(c);
  else if(t==="finanzas") el.innerHTML= isSocio()?tabFinanzas(c):lockedMsg();
  else if(t==="tareas") el.innerHTML=tabTareas(c);
  else if(t==="historial") el.innerHTML=tabHistorial(c);
  else if(t==="obs") el.innerHTML=tabObs(c);
}

/* ---------- TAB: AVANCE (tablero / checklist) ---------- */
const AV_STATUS={completo:{c:'st-completo',i:'✓',t:'Completo'},pendiente:{c:'st-pendiente',i:'•',t:'Pendiente'},nc:{c:'st-nc',i:'–',t:'No corresponde'},revision:{c:'st-revision',i:'?',t:'En revisión'},observado:{c:'st-observado',i:'!',t:'Observado'}};
function avBlocks(c){
  const cl=c.cliente,cu=c.cuenta,re=c.relato,f=c.finanzas;
  const adj=t=>(c.adjuntos||[]).some(a=>a.tipo===t);
  const doc=t=>c.docs.filter(d=>d.tipo===t).sort((a,b)=>b.version-a.version)[0];
  const dmin=(t,es)=>{const d=doc(t);return !!(d&&es.includes(d.estado));};
  const b=v=>v?'completo':'pendiente';
  const blocks=[
    {t:"Datos del cliente", items:[
      ["cli_pers","Datos personales completos",b(cl.nombre&&cl.apellido&&cl.dni)],
      ["cli_dom","Domicilio completo",b(cl.domicilio&&cl.localidad&&cl.provincia)],
      ["cli_tel","Teléfono",b(cl.tel)],["cli_mail","Mail",b(cl.email)],
      ["cli_dnif","DNI frente",b(adj("DNI frente"))],["cli_dnid","DNI dorso",b(adj("DNI dorso"))],
    ]},
    {t:"Cuenta afectada", items:[
      ["cu_url","URL de la cuenta",b(cu.url)],["cu_handle","Usuario / handle",b(cu.handle)],
      ["cu_mail","Mail vinculado",b(cu.emailVinc)],["cu_tel","Teléfono vinculado",b(cu.telVinc)],
      ["cu_relato","Relato de hechos",b(re.original||re.sintesis)],
      ["cu_capt","Capturas de suspensión",b(adj("Captura aviso de suspensión"))],
      ["cu_pru","Pruebas adicionales",b(adj("Otra documentación")||adj("Conversaciones / pruebas")||adj("Captura de la cuenta"))],
    ]},
    {t:"Documentación legal", items:[
      ["dl_cg","Contrato generado",b(doc("contrato"))],
      ["dl_ce","Contrato enviado",b(dmin("contrato",["enviado","firmado","final"]))],
      ["dl_cf","Contrato firmado",b(dmin("contrato",["firmado","final"]))],
      ["dl_pg","Carta poder generada",b(doc("carta_poder"))],
      ["dl_pe","Carta poder enviada",b(dmin("carta_poder",["enviado","firmado","final"]))],
      ["dl_pf","Carta poder firmada",b(dmin("carta_poder",["firmado","final"]))],
      ["dl_mg","Planilla de mediación generada",b(doc("mediacion"))],
    ]},
    {t:"Mediación", items:[
      ["me_med","Mediador asignado",b(DB.config.mediador)],
      ["me_gen","Solicitud de mediación generada",b(doc("mediacion"))],
      ["me_env","Solicitud enviada",b(dmin("mediacion",["enviado","firmado","final"]))],
      ["me_fec","Fecha de audiencia",b(c.audiencia&&c.audiencia.fecha)],
      ["me_cal","Audiencia cargada en calendario",b(c.audiencia&&c.audiencia.calCreado)],
      ["me_real","Audiencia realizada",b(c.audiencia&&c.audiencia.realizada)],
    ]},
  ];
  if(isSocio()){
    blocks.splice(3,0,{t:"Finanzas", items:[
      ["fi_comp","Comprobante de pago recibido",b(adj("Comprobante de pago"))],
      ["fi_adel","Adelanto abonado",b(Number(f.adelanto||0)>0)],
      ["fi_sal","Saldo cancelado",f.montoTotal!==""?b(Number(f.saldo||0)<=0):'pendiente'],
      ["fi_full","Pago completo",b(f.estadoPago==='completo')],
    ]});
  }
  return blocks;
}
function avEff(c,key,auto){ return (c.avance&&c.avance[key])?c.avance[key]:auto; }
function setAv(key,v){ CURRENT.avance=CURRENT.avance||{}; if(v==="auto"){delete CURRENT.avance[key];}else{CURRENT.avance[key]=v;} save(); renderTab(); }
function tabAvance(c){
  const html=avBlocks(c).map(bl=>{
    const total=bl.items.length;
    const nc=bl.items.filter(([k,l,a])=>avEff(c,k,a)==='nc').length;
    const done=bl.items.filter(([k,l,a])=>avEff(c,k,a)==='completo').length;
    const pct=(total-nc)>0?Math.round(done/(total-nc)*100):100;
    const items=bl.items.map(([k,l,a])=>{
      const st=avEff(c,k,a); const s=AV_STATUS[st]||AV_STATUS.pendiente; const ov=c.avance&&c.avance[k];
      return `<div class="av-item"><div class="lab"><span class="ic ${s.c}">${s.i}</span>${esc(l)}</div>
        <select onchange="setAv('${k}',this.value)"><option value="auto" ${!ov?'selected':''}>Auto · ${AV_STATUS[a].t}</option>
        ${Object.entries(AV_STATUS).map(([v,o])=>`<option value="${v}" ${ov===v?'selected':''}>${o.t}</option>`).join("")}</select></div>`;
    }).join("");
    return `<div class="av-block"><div class="h">${esc(bl.t)}<span class="pct">${pct}%</span></div>${items}</div>`;
  }).join("");
  return `<div class="alert alert-info"><span>🧭</span><div>Cada bloque es independiente y avanza por separado. El estado se calcula solo según los datos cargados; podés sobrescribirlo manualmente (En revisión, Observado, No corresponde).</div></div>
    <div class="av-grid">${html}</div>`;
}

function saveCuenta(){
  const f=CURRENT.cuenta;
  f.plataforma=val("cu_plat"); f.handle=val("cu_handle"); f.url=val("cu_url"); f.emailVinc=val("cu_em"); f.telVinc=val("cu_tel");
  f.tipo=val("cu_tipo"); f.cuentasVinc=val("cu_vinc");
  f.pautaActiva=chkVal("cu_pauta"); f.saldoRetenido=chkVal("cu_saldo"); f.businessManager=chkVal("cu_bm");
  f.metodoPago=chkVal("cu_mp"); f.campanasActivas=chkVal("cu_camp"); f.hackeo=chkVal("cu_hack");

/* ---------- VALIDATIONS ---------- */
function validateDoc(c,tipo){
  const missing=[]; const cl=c.cliente, cu=c.cuenta, f=c.finanzas;
  const need=(cond,label)=>{ if(!cond) missing.push(label); };
  if(tipo==="contrato"){
    need(cl.nombre&&cl.apellido,"Nombre y apellido"); need(cl.domicilio,"Domicilio"); need(cl.email,"Email");
    need(cl.tel,"Teléfono"); need(cu.handle||cu.url,"Cuenta objeto de la gestión");
    need(f.montoTotal!=="","Monto total"); need(f.adelanto!=="","Adelanto"); need(f.saldo!=="","Saldo");
    need(f.devolucion!=="","Devolución pactada"); need(f.moneda,"Moneda");
  } else if(tipo==="carta_poder"){
    need(cl.nombre&&cl.apellido,"Nombre y apellido"); need(cl.dni,"DNI / identificación"); need(cl.domicilio,"Domicilio");
    need(cl.email,"Email"); need(cu.handle||cu.url,"Cuenta afectada"); need(c.abogadoPatrocinante,"Abogado autorizado");
  } else if(tipo==="mediacion"){
    need(cl.nombre&&cl.apellido,"Nombre y apellido del requirente"); need(cl.dni,"DNI"); need(cl.cuit,"CUIT / CUIL");
    need(cl.domicilio,"Domicilio completo"); need(cl.tel,"Teléfono"); need(cl.email,"Email");
    need(cu.url,"URL de la cuenta afectada"); need(cu.emailVinc,"Email vinculado a la cuenta");
    need(c.relato.sintesis||c.relato.original,"Síntesis del hecho");
    need((c.adjuntos||[]).some(a=>a.tipo==="DNI frente"),"DNI frente adjunto");
    need((c.adjuntos||[]).some(a=>a.tipo==="DNI dorso"),"DNI dorso adjunto");
    need(c.abogadoPatrocinante,"Abogado patrocinante");
  }
  return {ok:missing.length===0, missing};
}

function buildCalUrl(c){
  const a=c.audiencia||{}; const fb=c.citarFacebook!==false;
  const title=`Mediación - ${clienteFull(c)} c/ Meta Platforms Inc.${fb?' y Facebook Argentina S.R.L.':''}`;
  const durMin=parseInt(a.duracion)||60;
  const f=(a.fecha||"").replace(/-/g,""); const h=(a.hora||"10:00").split(":");
  const startD=new Date((a.fecha||new Date().toISOString().slice(0,10))+"T"+(a.hora||"10:00")+":00");
  const endD=new Date(startD.getTime()+durMin*60000);
  const fmt=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
  const det=[`Mediador: ${DB.config.mediador}`,`Cliente: ${clienteFull(c)}`,`Requerida: META PLATFORMS INC${fb?' y FACEBOOK ARGENTINA S.R.L.':''}`,`Modalidad: ${a.modalidad||'-'}`,a.linkReunion?`Link reunión: ${a.linkReunion}`:'',c.drive.link?`Carpeta Drive: ${c.drive.link}`:'',`Expediente interno: ${c.id} (${clienteFull(c)})`,a.obs?`Observaciones: ${a.obs}`:''].filter(Boolean).join("\n");
  let url="https://calendar.google.com/calendar/render?action=TEMPLATE";
  url+="&text="+encodeURIComponent(title)+"&dates="+fmt(startD)+"/"+fmt(endD)+"&details="+encodeURIComponent(det);
  if(a.modalidad==="Presencial"&&a.lugar) url+="&location="+encodeURIComponent(a.lugar);
  else if(a.modalidad==="Virtual"&&a.linkReunion) url+="&location="+encodeURIComponent(a.linkReunion);
  const guests=(a.invitados||[]).filter(Boolean);
  if(guests.length) url+="&add="+encodeURIComponent(guests.join(","));
  return url;
}
async function crearEventoCalendar(){
  const c=CURRENT; const a=readAudiencia();
  if(!a.fecha){ toast("Cargá la fecha de la audiencia","err"); return; }
  if(CLOUD){ await crearEventoAuto(c,a); return; }
  const url=buildCalUrl(c);
  window.open(url,"_blank");
  a.calCreado=true;
  logAction(c,"Evento de mediación creado en Google Calendar ("+fdate(a.fecha)+" "+a.hora+")");
  if(c.estado==="Mediación solicitada"||c.estado==="Mediación pendiente") c.estado="Audiencia fijada";
  save(); toast("Abriendo Google Calendar"); renderTab();
}
async function crearEventoAuto(c,a){
  const fb=c.citarFacebook!==false;
  const title=`Mediación - ${clienteFull(c)} c/ Meta Platforms Inc.${fb?' y Facebook Argentina S.R.L.':''}`;
  const durMin=parseInt(a.duracion)||60;
  const start=new Date((a.fecha)+"T"+(a.hora||"10:00")+":00");
  const end=new Date(start.getTime()+durMin*60000);
  const iso=d=>{const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())+":00";};
  const det=[`Mediador: ${DB.config.mediador}`,`Cliente: ${clienteFull(c)}`,`Requerida: META PLATFORMS INC${fb?' y FACEBOOK ARGENTINA S.R.L.':''}`,`Modalidad: ${a.modalidad||'-'}`,a.linkReunion?`Link reunión: ${a.linkReunion}`:'',c.drive.link?`Carpeta Drive: ${c.drive.link}`:'',`Expediente: ${c.id}`,a.obs?`Obs: ${a.obs}`:''].filter(Boolean).join("\n");
  const location=a.modalidad==="Presencial"?(a.lugar||""):(a.linkReunion||"");
  toast("Creando eventos en los calendarios…");
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(FUNCTIONS_URL+"/calendar-insert",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({invitados:a.invitados||[],title,startISO:iso(start),endISO:iso(end),details:det,location})});
    const j=await r.json();
    if(j.error){ toast("Error: "+j.error,"err"); return; }
    const oks=(j.results||[]).filter(x=>x.ok).length;
    const fails=(j.results||[]).filter(x=>!x.ok);
    a.calCreado=true;
    logAction(c,"Eventos de mediación creados en Google Calendar ("+oks+" agenda/s)");
    if(c.estado==="Mediación solicitada"||c.estado==="Mediación pendiente") c.estado="Audiencia fijada";
    save();
    if(fails.length) toast(oks+" creado/s. Sin Google conectado: "+fails.length,"err");
    else toast("Evento cargado en "+oks+" agenda/s ✓");
    renderTab();
  }catch(e){ console.error(e); toast("Error al crear eventos","err"); }
}

  const c=DB.casos.find(x=>x.formToken===token); if(!c) return;
  const cl=c.cliente, cu=c.cuenta, re=c.relato;
  cu.url=val("cf_url"); cu.handle=val("cf_handle"); cu.emailVinc=val("cf_em"); cu.telVinc=val("cf_tel"); cu.tipo=val("cf_tipo");
  cu.pautaActiva=chkVal("cf_pauta"); cu.saldoRetenido=chkVal("cf_saldo"); cu.businessManager=chkVal("cf_bm"); cu.campanasActivas=chkVal("cf_camp");
  cl.apellido=val("cf_ap").toUpperCase(); cl.nombre=val("cf_no"); cl.dni=val("cf_dni"); cl.cuit=val("cf_cuit"); cl.nacionalidad=val("cf_nac"); cl.fechaNac=val("cf_fnac");
  cl.estadoCivil=val("cf_ec"); cl.conyuge=val("cf_con"); cl.domicilio=val("cf_dom"); cl.localidad=val("cf_loc"); cl.provincia=val("cf_prov"); cl.cp=val("cf_cp"); cl.tel=val("cf_celular"); cl.email=val("cf_email");
  re.fechaSusp=val("cf_fs"); re.tipoSusp=val("cf_ts"); re.mensaje=val("cf_msg"); re.apelo=chkVal("cf_apelo"); re.recibioResp=chkVal("cf_resp"); re.hackeo=chkVal("cf_hack"); re.volvioSusp=chkVal("cf_volvio"); re.original=val("cf_orig");
  // adjuntos por archivo (obligatorios DNI frente/dorso + comprobante de pago)
  const hoy=new Date().toISOString().slice(0,10);
  const fileEl=id=>document.getElementById(id);
  const fDniF=fileEl("cf_f_dnif"), fDniD=fileEl("cf_f_dnid"), fPago=fileEl("cf_f_pago"), fOtros=fileEl("cf_f_otros");
  const tiene=el=>el&&el.files&&el.files.length>0;
  const yaTengo=t=>c.adjuntos.some(a=>a.tipo===t);
  const faltan=[];
  if(!tiene(fDniF)&&!yaTengo("DNI frente")) faltan.push("DNI frente");
  if(!tiene(fDniD)&&!yaTengo("DNI dorso")) faltan.push("DNI dorso");
  if(!tiene(fPago)&&!yaTengo("Comprobante de pago")) faltan.push("Comprobante de pago");
  if(faltan.length){ toast("Faltan adjuntos obligatorios: "+faltan.join(", "),"err"); return; }
  const addFile=(el,tipo)=>{ if(tiene(el)){ c.adjuntos=c.adjuntos.filter(a=>a.tipo!==tipo); c.adjuntos.push({tipo,nombre:el.files[0].name,fecha:hoy}); } };
  addFile(fDniF,"DNI frente"); addFile(fDniD,"DNI dorso"); addFile(fPago,"Comprobante de pago");
  if(tiene(fOtros)){ for(const f of fOtros.files){ c.adjuntos.push({tipo:"Otra documentación",nombre:f.name,fecha:hoy}); } }
  // auto: crear drive + gastos default si faltan
  if(!c.drive.creada){ c.drive.creada=true; c.drive.link="https://drive.google.com/drive/folders/"+uid("")+uid(""); }
  if(!c.gastos||!c.gastos.length){ c.gastos=GASTOS_DEFAULT.map(n=>({id:uid("g"),nombre:n,estado:"pendiente",importe:"",moneda:"ARS",fecha:"",medio:"",obs:"",adjunto:""})); }
  c.estado="Formulario completado";
  logAction(c,"Formulario completado por el cliente");
  logAction(c,"Carpeta de Drive creada automáticamente");
  save();
  document.getElementById("formRoot").innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)"><div class="card" style="max-width:460px;text-align:center"><div class="card-b" style="padding:46px"><div style="font-size:48px">✅</div><h2 style="color:var(--navy);margin:14px 0 8px">¡Formulario enviado!</h2><p style="color:var(--muted)">Gracias. El estudio ya recibió tus datos y documentación. Nos pondremos en contacto a la brevedad.</p><button class="btn btn-ghost" style="margin-top:20px" onclick="backToApp()">Volver a la plataforma (demo)</button></div></div></div>`;
}
function backToApp(){ location.hash=""; document.getElementById("formRoot").classList.add("hidden"); if(SESSION){document.getElementById("app").classList.remove("hidden"); go("caso", DB.casos.find(c=>c.estado).id||"");} else {document.getElementById("login").classList.remove("hidden");} }
function formSuccess(){ document.getElementById("formRoot").innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f5f9"><div class="card" style="max-width:460px;text-align:center"><div class="card-b" style="padding:46px"><div style="font-size:48px">✅</div><h2 style="color:var(--navy);margin:14px 0 8px">¡Formulario enviado!</h2><p style="color:var(--muted)">Gracias. El estudio ya recibió tus datos y documentación. Nos pondremos en contacto a la brevedad.</p></div></div></div>`; }
async function submitClientFormCloud(token){
  const cliente={apellido:val("cf_ap").toUpperCase(),nombre:val("cf_no"),dni:val("cf_dni"),cuit:val("cf_cuit"),nacionalidad:val("cf_nac"),fechaNac:val("cf_fnac"),estadoCivil:val("cf_ec"),conyuge:val("cf_con"),domicilio:val("cf_dom"),localidad:val("cf_loc"),provincia:val("cf_prov"),cp:val("cf_cp"),tel:val("cf_celular"),email:val("cf_email")};
  const cuenta={url:val("cf_url"),handle:val("cf_handle"),emailVinc:val("cf_em"),telVinc:val("cf_tel"),tipo:val("cf_tipo"),pautaActiva:chkVal("cf_pauta"),saldoRetenido:chkVal("cf_saldo"),businessManager:chkVal("cf_bm"),campanasActivas:chkVal("cf_camp")};
  const relato={fechaSusp:val("cf_fs"),tipoSusp:val("cf_ts"),mensaje:val("cf_msg"),apelo:chkVal("cf_apelo"),recibioResp:chkVal("cf_resp"),hackeo:chkVal("cf_hack"),volvioSusp:chkVal("cf_volvio"),original:val("cf_orig")};
  const fe=id=>document.getElementById(id); const tiene=el=>el&&el.files&&el.files.length>0;
  const faltan=[]; if(!tiene(fe("cf_f_dnif")))faltan.push("DNI frente"); if(!tiene(fe("cf_f_dnid")))faltan.push("DNI dorso"); if(!tiene(fe("cf_f_pago")))faltan.push("Comprobante de pago");
  if(faltan.length){ toast("Faltan adjuntos obligatorios: "+faltan.join(", "),"err"); return; }
  const adjuntos=[]; const jobs=[];
  const addJob=(el,t)=>{ if(tiene(el)) for(const f of el.files){ adjuntos.push({tipo:t,nombre:f.name}); jobs.push({tipo:t,file:f}); } };
  addJob(fe("cf_f_dnif"),"DNI frente"); addJob(fe("cf_f_dnid"),"DNI dorso"); addJob(fe("cf_f_pago"),"Comprobante de pago"); addJob(fe("cf_f_otros"),"Otra documentación");
  try{
    const r=await fetch(FUNCTIONS_URL+"/public-form",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},body:JSON.stringify({token,cliente,cuenta,relato,adjuntos})});
    const j=await r.json();
    if(!j.ok){ toast("No se pudo enviar el formulario","err"); return; }
    // subir archivos reales a Google Drive (crea la carpeta del cliente si no existe)
    document.getElementById("formRoot").innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f5f9"><div style="text-align:center;color:#64748b"><div style="font-size:32px">⏳</div><p style="margin-top:10px">Subiendo tus archivos, no cierres esta ventana…</p></div></div>`;
    for(const job of jobs){
      try{
        const b64=await fileToB64(job.file);
        await fetch(FUNCTIONS_URL+"/drive-sync",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},body:JSON.stringify({formToken:token,action:"upload",tipo:job.tipo,nombre:job.file.name,mime:job.file.type||"application/octet-stream",base64:b64})});
      }catch(e){ console.error("upload",job.tipo,e); }
    }
    formSuccess();
  }catch(e){ console.error(e); toast("Error al enviar","err"); }
}
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(file); }); }

function renderFinanzasGlobal(){
  setCrumb("Finanzas global"); topActions("");

      <div class="stat green"><div class="lab">Pactado ARS</div><div class="val">${money(tARS,"ARS")}</div><div class="sub">Cobrado ${money(cARS,"ARS")} · Pend. ${money(pARS,"ARS")}</div></div>

}

  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(FUNCTIONS_URL+"/google-oauth?start=1",{headers:{"Authorization":"Bearer "+session.access_token}});
    const j=await r.json();
    if(j.url){ window.location.href=j.url; }
    else { toast("No se pudo iniciar la conexión con Google","err"); }
  }catch(e){ console.error(e); toast("Error al conectar Google","err"); }
}

function val(id){ const e=document.getElementById(id); return e?e.value:""; }
function chkVal(id){ const e=document.getElementById(id); return e?e.checked:false; }
function inp(id,label,v,type){ return `<div class="field"><label>${esc(label)}</label><input id="${id}" type="${type||'text'}" value="${esc(v)}"></div>`; }
function sel(id,label,opts,v){ return `<div class="field"><label>${esc(label)}</label><select id="${id}">${opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join("")}</select></div>`; }

function modal({title,body,footer,size}){

}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }

function handleGoogleHash(){
  if(location.hash.indexOf("google=ok")>=0){ toast("Google Calendar conectado ✓"); history.replaceState(null,"",location.pathname+location.search); }
  else if(location.hash.indexOf("google=error")>=0){ toast("No se pudo conectar Google","err"); history.replaceState(null,"",location.pathname+location.search); }
}
(async function boot(){
  // Formulario público del cliente (con o sin nube)
  if(location.hash.startsWith("#form=")){
    const tk=location.hash.slice(6);
    if(CLOUD){ renderClientFormCloud(tk); }
    else { loadLocal(); renderClientForm(tk); }
    return;
  }
  if(CLOUD){
    const {data:{session}}=await sb.auth.getSession();
    if(session){ await afterAuth(); }
    else { DB={config:{},abogados:[],usuarios:[],casos:[]}; renderLogin(); }
  } else {
    loadLocal(); renderLogin();
  }
})();
