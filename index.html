function finMonthName(ym){ const [y,m]=ym.split("-").map(Number); const d=new Date(y,(m||1)-1,1); const s=d.toLocaleDateString("es-AR",{month:"long",year:"numeric"}); return s.charAt(0).toUpperCase()+s.slice(1); }
function finMonthShift(delta){ const [y,m]=FINMONTH.split("-").map(Number); const d=new Date(y,(m-1)+delta,1); FINMONTH=d.toISOString().slice(0,7); renderCajaOperativa(); }
function setFinMonth(v){ if(v){ FINMONTH=v; renderCajaOperativa(); } }
// Movimientos de caja de un mes = gastos del estudio (gastosGen) + gastos ABONADOS de cada caso.
// Los gastos de caso se muestran para reconciliar con el disponible (ya lo descuentan), con su concepto y caso.
function movimientosCajaMes(ym){
  const out=[]; const curMonth=new Date().toISOString().slice(0,7);
  (DB.gastosGen||[]).forEach(g=>{ if((g.fecha||"").slice(0,7)!==ym) return;
    out.push({id:g.id,source:'gen',fecha:g.fecha,categoria:g.categoria||'otros',concepto:g.concepto||'—',importe:Number(g.importe||0),moneda:g.moneda==='USD'?'USD':'ARS',estado:g.estado||'abonado',medio:g.medio||'',socio:g.socio||'',casoId:null,casoLabel:''}); });
  (DB.casos||[]).forEach(c=>{ (c.gastos||[]).forEach(g=>{ if(g.estado!=='abonado')return; const imp=Number(g.importe||0); if(!imp)return;
    // Un gasto abonado SIN fecha de pago se imputa al mes actual (para que impacte igual en la caja).
    const gm=(g.fecha||"").slice(0,7); const enMes = gm ? (gm===ym) : (ym===curMonth);
    if(!enMes) return;
    out.push({id:g.id,source:'caso',fecha:g.fecha||'',categoria:'caso',concepto:g.nombre||'Gasto',importe:imp,moneda:g.moneda==='USD'?'USD':'ARS',estado:'abonado',medio:g.medio||'',socio:'',casoId:c.id,casoLabel:clienteFull(c)+' ('+c.id+')',sinFecha:!gm}); }); });
  // Reembolsos al cliente (devolución realizada): salen de la caja, se muestran en el mes en que se hicieron.
  (DB.casos||[]).forEach(c=>{ const f=c.finanzas||{}; const dev=Number(f.devolucion||0); if(f.estadoDevolucion!=='realizada_dev'||dev<=0)return;
    const fr=fechaReembolso(c); const fm=(fr||"").slice(0,7); const enMes = fm ? (fm===ym) : (ym===curMonth); if(!enMes) return;
    out.push({id:'dev-'+c.id,source:'dev',fecha:fr||'',categoria:'reembolso',concepto:'Reembolso al cliente',importe:dev,moneda:f.moneda==='USD'?'USD':'ARS',estado:'abonado',medio:'',socio:'',casoId:c.id,casoLabel:clienteFull(c)+' ('+c.id+')',sinFecha:!fm}); });
  return out;
}
function renderCajaOperativa(){
  setCrumb("Caja operativa"); topActions("");
  const a=calcFinanzasGlobal();
  const z=()=>({USD:0,ARS:0});
  const movMes=movimientosCajaMes(FINMONTH);
  // totales del mes
  const abon=z(), pend=z(), ingr=z(); const porCat={};
  GG_CATS.forEach(([k])=>porCat[k]=z()); porCat['caso']=z();
  movMes.forEach(m=>{ const mo=m.moneda; const imp=m.importe; if(!imp)return; const cat=m.categoria||"otros"; if(!porCat[cat])porCat[cat]=z();
    if(cat==='ingreso'){ if(m.estado!=='pendiente') ingr[mo]+=imp; return; }   // ingreso: suma aparte, no es gasto
    if(m.estado==="pendiente"){ pend[mo]+=imp; } else { abon[mo]+=imp; porCat[cat][mo]+=imp; } });
  // tabla del mes
  const catBadge=k=>`<span class="badge ${k==='empleados'?'b-blue':k==='licencias'?'b-gold':k==='adelanto_socio'?'b-red':k==='reembolso'?'b-red':k==='ingreso'?'b-green':k==='caso'?'b-blue':k==='operativo'?'b-grey':'b-grey'}">${k==='caso'?'Gasto de caso':k==='reembolso'?'Reembolso':esc(ggCatLabel(k))}</span>`;
  const rows=movMes.length?movMes.slice().sort((x,y)=>(y.fecha||"").localeCompare(x.fecha||"")).map(m=>`
    <tr class="clickable" onclick="${m.source==='caso'?`go('caso','${m.casoId}')`:`gastoGenModal('${m.id}')`}">
      <td>${m.sinFecha?'<span style="color:var(--muted)">sin fecha</span>':fdate(m.fecha)}</td>
      <td>${catBadge(m.categoria||'otros')}${m.categoria==='adelanto_socio'&&m.socio?`<br><small style="color:var(--muted)">${esc(userName(m.socio))}</small>`:''}</td>
      <td><b>${esc(m.concepto||'—')}</b>${m.source==='caso'?`<br><small style="color:var(--muted)">📁 ${esc(m.casoLabel)}</small>`:''}</td>
      <td>${money(m.importe,m.moneda)}</td>
      <td><span class="badge ${m.estado==='abonado'?'b-green':'b-amber'}">${esc(m.estado||'—')}</span></td>
      <td>${esc(m.medio||'—')}</td>
    </tr>`).join(""):`<tr><td colspan="6" class="empty">Sin movimientos en ${finMonthName(FINMONTH)}</td></tr>`;
  // desglose por categoría (solo abonado) — incluye gastos de casos
  const catRows=GG_CATS.concat([['caso','Gasto de caso']]).map(([k,t])=>{ if(k==='ingreso')return ''; const v=porCat[k]||z(); if(!v.USD&&!v.ARS&&(k==='otros'||k==='caso'))return ''; return `<tr><td>${catBadge(k)}</td><td style="text-align:right">${money(v.ARS,"ARS")}</td><td style="text-align:right">${money(v.USD,"USD")}</td></tr>`; }).join("");
  // historial mes a mes (últimos 6 meses, abonado) — gastos del estudio + gastos de casos
  const meses=[]; { const [y,m]=FINMONTH.split("-").map(Number); for(let i=0;i<6;i++){ const d=new Date(y,(m-1)-i,1); meses.push(d.toISOString().slice(0,7)); } }
  const histMes=meses.map(ym=>{ const t=z(); movimientosCajaMes(ym).forEach(m=>{ if(m.estado==="pendiente"||m.categoria==='ingreso')return; t[m.moneda]+=m.importe; }); return {ym,t}; });
  const histRows=histMes.map(({ym,t})=>`<tr class="clickable" onclick="setFinMonth('${ym}')" ${ym===FINMONTH?'style="background:var(--grey-bg);font-weight:600"':''}><td>${finMonthName(ym)}</td><td style="text-align:right">${money(t.ARS,"ARS")}</td><td style="text-align:right">${money(t.USD,"USD")}</td></tr>`).join("");

  document.getElementById("view").innerHTML=`
    <div class="pagehead"><div><h2>Caja operativa</h2><div class="sub">Gastos del estudio (sueldos, licencias, operativos, adelantos) + gastos abonados de cada caso</div></div>
      <button class="btn btn-primary" onclick="gastoGenModal()">＋ Nuevo gasto / movimiento</button></div>

    <div class="grid g2" style="margin-bottom:16px">
      <div class="stat green" style="border-left:4px solid #1c7a40"><div class="lab">✅ Caja disponible (real)</div><div class="val" style="font-size:20px">${dosMon(a.caja)}</div><div class="sub">cada movimiento abonado abajo se descuenta de acá</div></div>
      <div class="stat amber" style="border-left:4px solid #d99411"><div class="lab">⏸️ En stand by (posible devolución)</div><div class="val" style="font-size:20px">${dosMon(a.reservaDev)}</div></div>
    </div>

    <div class="card" style="margin-bottom:16px"><div class="card-b" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn btn-ghost btn-sm" onclick="finMonthShift(-1)">‹ Mes anterior</button>
        <b style="font-size:16px;color:var(--navy);min-width:160px;text-align:center">${finMonthName(FINMONTH)}</b>
        <button class="btn btn-ghost btn-sm" onclick="finMonthShift(1)">Mes siguiente ›</button>
        <input type="month" value="${FINMONTH}" onchange="setFinMonth(this.value)" style="padding:6px 8px;border:1px solid var(--line2);border-radius:6px">
      </div>
      <div style="display:flex;gap:18px;flex-wrap:wrap">
        <div><div style="font-size:11px;color:var(--muted)">Gastos abonados del mes</div><div style="font-weight:700;color:#c0392b">${dosMon(abon)}</div></div>
        ${(ingr.USD||ingr.ARS)?`<div><div style="font-size:11px;color:var(--muted)">Ingresos del mes</div><div style="font-weight:700;color:#1c7a40">${dosMon(ingr)}</div></div>`:''}
        <div><div style="font-size:11px;color:var(--muted)">Pendiente del mes</div><div style="font-weight:700;color:#b07d1a">${dosMon(pend)}</div></div>
      </div>
    </div></div>

    <div class="grid" style="grid-template-columns:1.7fr 1fr;gap:16px;align-items:start">
      <div class="card" style="overflow-x:auto"><div class="card-h"><h3>Movimientos de ${finMonthName(FINMONTH)}</h3><span class="badge b-grey">${movMes.length}</span></div>
        <table><thead><tr><th>Fecha</th><th>Categoría</th><th>Concepto</th><th>Importe</th><th>Estado</th><th>Medio</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div>
        <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Por categoría (abonado)</h3></div>
          <table><thead><tr><th>Categoría</th><th style="text-align:right">ARS</th><th style="text-align:right">USD</th></tr></thead><tbody>${catRows||'<tr><td colspan="3" class="empty">—</td></tr>'}</tbody></table></div>
        <div class="card"><div class="card-h"><h3>Últimos meses (abonado)</h3></div>
          <table><thead><tr><th>Mes</th><th style="text-align:right">ARS</th><th style="text-align:right">USD</th></tr></thead><tbody>${histRows}</tbody></table></div>
      </div>
    </div>`;
}

function readEtiquetasFromUI(){
  const pool=etiquetasPool(); const out=[];
  for(let i=0;i<pool.length;i++){ const ne=document.getElementById("etq_n"+i); const ce=document.getElementById("etq_c"+i); if(!ne)continue; const nombre=ne.value.trim(); if(!nombre)continue; out.push({nombre, color:(ce&&ce.value)||"b-grey"}); }
  return out;
}
function addEtiqueta(){
  if(!isSocio()){ toast("Solo los socios pueden editar etiquetas","err"); return; }
  const nombre=(val("etq_new")||"").trim(); if(!nombre){ toast("Escribí el nombre de la etiqueta","err"); return; }
  const list=readEtiquetasFromUI();
  if(list.some(e=>e.nombre.toLowerCase()===nombre.toLowerCase())){ toast("Esa etiqueta ya existe","err"); return; }
  list.push({nombre, color:val("etq_newc")||"b-blue"});
  DB.config.etiquetas=list; save(); toast("Etiqueta agregada"); renderConfig();
}
function delEtiqueta(i){
  if(!isSocio()){ toast("Solo los socios pueden editar etiquetas","err"); return; }
  const list=readEtiquetasFromUI(); const rem=list[i];
  if(rem && !confirm(`¿Eliminar la etiqueta "${rem.nombre}"? Se quitará de la lista (los casos que ya la tengan la conservan hasta que se la saques).`)) return;
  list.splice(i,1);
  DB.config.etiquetas=list; save(); toast("Etiqueta eliminada"); renderConfig();
}
function saveEtiquetas(){

/* ---------- Usuarios en la nube (vía función admin-users, solo socios) ---------- */
let ADMIN_USERS=[];
async function adminUsersCall(payload){
  try{ const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(FUNCTIONS_URL+"/admin-users",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify(payload)});
    return await r.json();
  }catch(e){ return {error:String(e)}; }
}
async function loadAdminUsers(){
  const el=document.getElementById("usersTable"); if(el)el.innerHTML='<div class="empty">Cargando usuarios…</div>';
  const j=await adminUsersCall({action:"list"});
  if(!j.ok){ if(el)el.innerHTML=`<div class="empty">No se pudo cargar la lista${j.error?(' ('+esc(j.error)+')'):''}.${/solo-socios/.test(j.error||'')?' Solo los socios pueden gestionar usuarios.':''}</div>`; return; }
  ADMIN_USERS=j.users||[]; renderUsersTable();
}
function renderUsersTable(){
  const el=document.getElementById("usersTable"); if(!el)return;
  const rows=ADMIN_USERS.map(u=>`<tr>
    <td><b>${esc(u.nombre||'—')}</b><br><small style="color:var(--muted)">${esc(u.email||'')}</small></td>
    <td><span class="badge ${u.rol==='socio'?'b-gold':'b-blue'}">${u.rol==='empleado'?'colaborador':esc(u.rol)}</span></td>

  </tr>`).join("")||`<tr><td colspan="4" class="empty">Sin usuarios</td></tr>`;
  el.innerHTML=`<table><thead><tr><th>Usuario</th><th>Rol</th><th>Último ingreso</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

let TFILTER={scope:"mias",fu:"",festado:"",fprio:""};
function renderTareas(){
  setCrumb("Tareas");
  topActions(`<button class="btn btn-primary" onclick="tareaModal()">＋ Nueva tarea</button>`);
  let list=(DB.tareas||[]).slice();
  if(TFILTER.scope==="mias") list=list.filter(t=>t.creado_por===SESSION.id || (t.asignados||[]).includes(SESSION.id));
  if(TFILTER.fu) list=list.filter(t=>(t.asignados||[]).includes(TFILTER.fu));
  if(TFILTER.festado) list=list.filter(t=>tareaEfEstado(t)===TFILTER.festado);
  if(TFILTER.fprio) list=list.filter(t=>t.prioridad===TFILTER.fprio);
  const today=todayISO();
  const activas=list.filter(t=>!["realizada","cancelada"].includes(t.estado));
  const venc=activas.filter(t=>t.vence&&t.vence<today);
  const hoy=activas.filter(t=>t.vence===today);
  const prox=activas.filter(t=>t.vence&&t.vence>today).sort((a,b)=>(a.vence||'').localeCompare(b.vence||''));
  const sinf=activas.filter(t=>!t.vence);
  const compl=list.filter(t=>["realizada","cancelada"].includes(t.estado)).slice(0,30);
  const sec=(titulo,arr,color)=> arr.length?`<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${titulo}</h3><span class="badge ${color}">${arr.length}</span></div><div class="card-b" style="padding:6px 8px">${arr.map(tareaRow).join("")}</div></div>`:'';
  const userOpts=DB.usuarios.map(u=>`<option value="${u.id}" ${TFILTER.fu===u.id?'selected':''}>${esc(u.nombre)}</option>`).join("");
  const estOpts=ESTADOS_TAREA.map(e=>`<option ${TFILTER.festado===e?'selected':''}>${e}</option>`).join("");
  const prioOpts=PRIORIDADES.map(p=>`<option ${TFILTER.fprio===p?'selected':''}>${p}</option>`).join("");
  document.getElementById("view").innerHTML=`
    <div class="pagehead"><div><h2>${TFILTER.scope==='equipo'?'Tareas del equipo':'Mis tareas'}</h2><div class="sub">${activas.length} pendientes${venc.length?` · ${venc.length} vencidas`:''}</div></div></div>
    <div class="filters">
      ${isSocio()?`<button class="btn btn-ghost btn-sm" style="${TFILTER.scope==='mias'?'background:var(--primary);color:#fff':''}" onclick="TFILTER.scope='mias';renderTareas()">Mis tareas</button><button class="btn btn-ghost btn-sm" style="${TFILTER.scope==='equipo'?'background:var(--primary);color:#fff':''}" onclick="TFILTER.scope='equipo';renderTareas()">Equipo</button>`:''}
      ${TFILTER.scope==='equipo'?`<select onchange="TFILTER.fu=this.value;renderTareas()"><option value="">Todos los usuarios</option>${userOpts}</select>`:''}
      <select onchange="TFILTER.festado=this.value;renderTareas()"><option value="">Todos los estados</option>${estOpts}</select>
      <select onchange="TFILTER.fprio=this.value;renderTareas()"><option value="">Toda prioridad</option>${prioOpts}</select>
    </div>
    ${sec('🔴 Vencidas',venc,'b-red')}
    ${sec('📅 Hoy',hoy,'b-gold')}
    ${sec('⏭️ Próximas',prox,'b-blue')}
    ${sec('📌 Sin fecha',sinf,'b-grey')}
    ${sec('✓ Completadas / canceladas',compl,'b-green')}
    ${(venc.length+hoy.length+prox.length+sinf.length+compl.length)===0?'<div class="card"><div class="empty"><div class="ico">✅</div>No hay tareas todavía. Creá una con "＋ Nueva tarea".</div></div>':''}`;
}
function tareaRow(t){
  const est=tareaEfEstado(t);
  const done=["realizada","cancelada"].includes(t.estado);
  const asig=(t.asignados||[]).map(id=>userName(id)).join(", ")||"—";
  const caso=t.caso_id?DB.casos.find(c=>c.id===t.caso_id):null;
  const estSel=ESTADOS_TAREA.filter(e=>e!=="vencida").map(e=>`<option value="${e}" ${t.estado===e?'selected':''}>${e}</option>`).join("");
  return `<div class="tk-row" data-id="${t.id}">
    <div class="tk-main" onclick="tareaModal('${t.id}')">
      <div class="tk-title" style="${done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.titulo)} <span class="badge ${PRIO_COLOR[t.prioridad]||'b-grey'}">${t.prioridad}</span>${t.privacidad==='privada'?' <span class="badge b-grey">🔒</span>':''}</div>
      <div class="tk-meta">👤 ${esc(asig)}${t.vence?` · 📅 ${fdate(t.vence)}${t.hora?' '+esc(t.hora):''}`:''}${caso?` · 📁 ${esc(clienteFull(caso))}`:''}${t.observaciones?' · 📝':''}</div>
    </div>
    <select class="tk-estado est-${est.replace(/ /g,'_')}" onclick="event.stopPropagation()" onchange="cambiarEstadoTarea('${t.id}', this.value)" title="Cambiar estado">${estSel}</select>
    <button class="tk-kebab" onclick="openTareaMenu('${t.id}', event)" title="Acciones rápidas">⋯</button>
  </div>`;
}
async function cambiarEstadoTarea(id, estado){
  const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;
  if(t.estado===estado) return;
  t.estado=estado;
  await tareaUpsert(t);
  syncTareaCalendar(t);
  if(estado==='realizada' && t.creado_por && t.creado_por!==SESSION.id) notifCreate(t.creado_por,"tarea_completada","Tarea completada: "+t.titulo,"Por "+userName(SESSION.id),t.id,t.caso_id);
  if(estado==='cancelada' && t.creado_por && t.creado_por!==SESSION.id) notifCreate(t.creado_por,"tarea_cancelada","Tarea cancelada: "+t.titulo,"Por "+userName(SESSION.id),t.id,t.caso_id);
  toast("Estado: "+estado);
  if(ROUTE==='tareas')renderTareas(); else if(ROUTE==='caso')renderCaso();
}
async function toggleTareaHecha(id){ const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return; cambiarEstadoTarea(id, t.estado==='realizada'?'pendiente':'realizada'); }
/* --- menú de acciones rápidas --- */
function openTareaMenu(id, ev){
  ev.stopPropagation(); closeTareaMenu();
  const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;
  const canDel=isSocio()||t.creado_por===SESSION.id;
  const m=document.createElement("div"); m.className="tk-menu"; m.id="tkMenu";
  m.innerHTML=`
    <button onclick="tareaModal('${id}');closeTareaMenu()">✎ Editar tarea</button>
    <button onclick="quickFechaHora('${id}')">📅 Cambiar fecha / hora</button>
    <button onclick="quickPrioridad('${id}')">⚑ Cambiar prioridad</button>
    <button onclick="quickReasignar('${id}')">👤 Reasignar</button>
    <button onclick="quickObs('${id}')">📝 Agregar observación</button>
    <div class="tk-menu-sep"></div>
    <button onclick="cambiarEstadoTarea('${id}','realizada');closeTareaMenu()">✅ Marcar realizada</button>
    <button onclick="cambiarEstadoTarea('${id}','cancelada');closeTareaMenu()">🚫 Cancelar tarea</button>
    ${canDel?`<div class="tk-menu-sep"></div><button class="danger" onclick="closeTareaMenu();deleteTareaConfirm('${id}')">🗑 Eliminar</button>`:''}`;
  document.body.appendChild(m);
  const r=ev.currentTarget.getBoundingClientRect();
  m.style.top=Math.min(r.bottom+4, window.innerHeight-m.offsetHeight-8)+"px";
  m.style.left=Math.max(8,(r.right-228))+"px";
  setTimeout(()=>document.addEventListener("click",closeTareaMenuOutside),0);
}
function closeTareaMenu(){ const m=document.getElementById("tkMenu"); if(m)m.remove(); document.removeEventListener("click",closeTareaMenuOutside); }
function closeTareaMenuOutside(e){ const m=document.getElementById("tkMenu"); if(m && !m.contains(e.target)) closeTareaMenu(); }
function quickFechaHora(id){ closeTareaMenu(); const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;

/* ---------- TAREAS ↔ Google Calendar ---------- */
async function syncTareaCalendar(t, opts){
  opts=opts||{};
  if(!CLOUD || !t) return;
  const asign=(t.asignados||[]).filter(Boolean);
  const prev=t.eventos||{};
  const post=async(payload)=>{ const {data:{session}}=await sb.auth.getSession(); return fetch(FUNCTIONS_URL+"/calendar-insert",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(r=>r.json()); };
  // BORRADO total (tarea eliminada/cancelada, sin fecha o sin asignados)
  if(opts.del || t.estado==='cancelada' || !t.vence || asign.length===0){
    if(Object.keys(prev).length){
      try{ await post({delete:true, invitados:Object.keys(prev), eventos:prev}); }catch(e){ console.error("cal del",e); }
      t.eventos={}; if(!opts.del) await tareaUpsert(t);
    }
    return;
  }
  // borrar eventos de usuarios que ya no están asignados
  const removed=Object.keys(prev).filter(u=>!asign.includes(u));
  if(removed.length){ try{ await post({delete:true, invitados:removed, eventos:prev}); }catch(e){} removed.forEach(u=>delete t.eventos[u]); }
  // armar evento
  const nombres=asign.map(id=>userName(id).split(" ")[0]).filter(Boolean).join(", ");
  const done=t.estado==='realizada';
  const title=(done?"✓ ":"")+"Tarea GMJ - "+t.titulo+(nombres?" - "+nombres:"");
  let startISO,endISO,allDay=false;
  if(t.hora){
    const dur=parseInt(t.duracion)||60;
    const s=new Date(t.vence+"T"+t.hora+":00"), e=new Date(s.getTime()+dur*60000);
    const iso=d=>{const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())+":00";};
    startISO=iso(s); endISO=iso(e);
  } else {
    allDay=true; startISO=t.vence;
    const d=new Date(t.vence+"T00:00:00"); d.setDate(d.getDate()+1);
    endISO=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  const caso=t.caso_id?DB.casos.find(c=>c.id===t.caso_id):null;
  const det=[t.descripcion||"", caso?("Caso: "+clienteFull(caso)+" ("+caso.id+")"):"", t.observaciones?("Obs: "+t.observaciones):"", "Prioridad: "+(t.prioridad||"media")].filter(Boolean).join("\n");
  try{
    const j=await post({invitados:asign, title, startISO, endISO, allDay, details:det, eventos:t.eventos||{}});
    if(j&&j.eventos){ t.eventos=Object.assign({}, t.eventos, j.eventos); await tareaUpsert(t);
      const oks=(j.results||[]).filter(x=>x.ok).length, fails=(j.results||[]).filter(x=>!x.ok).length;
      if(oks) toast("📅 Agendado en "+oks+" calendario/s"+(fails?" · "+fails+" sin Google":"")); else if(fails) toast("Ningún asignado conectó su Google","err");
    } else if(j&&j.error){ console.error("cal",j.error); }
  }catch(e){ console.error("syncTareaCalendar",e); }
}

async function saveTareaForm(id){
  const tit=val("tk_tit").trim(); if(!tit){ toast("El título es obligatorio","err"); return; }
  const asignados=Array.from(new Set(Array.from(document.querySelectorAll(".tk_asg:checked")).map(x=>x.value)));
  const casoId=val("tk_caso")||null;
  const caso=casoId?DB.casos.find(c=>c.id===casoId):null;
  let t = id ? (DB.tareas||[]).find(x=>x.id===id) : null;
  const prevAsign = (t && Array.isArray(t.asignados)) ? t.asignados.slice() : [];
  const prevEstado = t ? t.estado : null;
  const isNew=!t;
  const base = t || { id:newTareaId(), creado_por:SESSION.id, created_at:new Date().toISOString(), eventos:{} };
  Object.assign(base, { titulo:tit, descripcion:val("tk_desc"), asignados, caso_id:casoId, cliente_nombre:caso?clienteFull(caso):null, vence:val("tk_vence")||null, hora:val("tk_hora")||null, duracion:val("tk_dur")||null, prioridad:val("tk_prio"), estado:val("tk_est"), observaciones:val("tk_obs"), recordatorio:val("tk_rec"), privacidad:val("tk_priv") });
  await tareaUpsert(base, isNew);
  DB.tareas=DB.tareas||[]; const i=DB.tareas.findIndex(x=>x.id===base.id); if(i>=0)DB.tareas[i]=base; else DB.tareas.push(base);
  closeModal(); toast("Tarea guardada");
  if(ROUTE==='tareas')renderTareas(); else if(ROUTE==='caso')renderCaso();
  syncTareaCalendar(base);
  // notificar a los nuevos asignados
  const detalle=(base.vence?("Vence "+fdate(base.vence)+(base.hora?" "+base.hora:"")):"Sin fecha")+(caso?(" · "+clienteFull(caso)):"");
  asignados.filter(u=>!prevAsign.includes(u)).forEach(u=>notifCreate(u,"tarea_asignada","Te asignaron: "+tit,detalle,base.id,casoId));
  // notificar al creador si un asignado la marcó completada/cancelada desde el form
  if(prevEstado && prevEstado!==base.estado && ["realizada","cancelada"].includes(base.estado) && base.creado_por!==SESSION.id)
    notifCreate(base.creado_por, base.estado==="realizada"?"tarea_completada":"tarea_cancelada", (base.estado==="realizada"?"Tarea completada: ":"Tarea cancelada: ")+tit, "Por "+userName(SESSION.id), base.id, casoId);
}

  <p>Asimismo, el valor del servicio contempla gastos operativos asociados, incluyendo costos de mediación, notificaciones, logística internacional, asistencia letrada y demás erogaciones necesarias para llevar adelante el procedimiento.</p>
  <p><b>Honorarios totales: {{honorarios_total}}</b></p>
  <p><b>Forma de pago:</b></p>
  {{forma_pago}}
  <p>El pago podrá realizarse mediante transferencia bancaria o en efectivo, tanto en dólares estadounidenses como en pesos argentinos, tomando en este último caso el tipo de cambio oficial vigente al día del pago. En caso de optarse por el pago en efectivo, la entrega se coordinará previamente dentro de días y horarios hábiles.</p>
  <p><b>Plazos estimados:</b></p>
  <p>Una vez iniciada la instancia principal de gestión, los casos suelen resolverse en un plazo aproximado de 30 días, sin perjuicio de que el tiempo puede variar según cada situación particular y los procesos internos de la plataforma. A los fines de considerar agotadas las gestiones realizadas, se establece un plazo máximo de 90 días, período dentro del cual se mantiene el seguimiento activo del caso.</p>
  <p><b>Importante:</b></p>
  <p>Se trata de un servicio profesional que implica una obligación de medios y no de resultado, dado que la decisión final depende exclusivamente de las políticas y procesos internos de la plataforma. No obstante, la experiencia en este tipo de gestiones permite abordar los casos con un alto grado de efectividad.</p>

  <div style="margin-top:26px;text-align:center;font-size:11px;color:#555;border-top:1px solid #ccc;padding-top:8px">@gmj.abogados &nbsp;&middot;&nbsp; www.gmj-abogados.com.ar &nbsp;&middot;&nbsp; contacto@gmj-abogados.com.ar</div>`;
}
function tplPresupuesto(p){
  plantillaSeed();
  const pl=(DB.config.plantillas||{}).presupuesto;
  const tpl=(pl&&(pl.html||"").trim())?pl.html:DEFAULT_PRESUPUESTO();
  return presuHeader()+renderPresuPlantilla(tpl,p);
}

/* ---- Listado ---- */
function renderPresupuestos(){
  setCrumb("Presupuestos");
  topActions(`<button class="btn btn-primary btn-sm" onclick="openNewPresupuesto()">＋ Nuevo presupuesto</button>`);
  const list=presupuestosPool().slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const rows=list.length?list.map(p=>{
    const tieneCaso=!!p.casoId;
    return `<tr>
      <td>${fdate(p.fecha)}</td>
      <td><b>${esc(p.cliente.apellido||"")} ${esc(p.cliente.nombre||"")}</b>${p.cuenta&&p.cuenta.url?`<br><small style="color:var(--muted)">${esc(p.cuenta.url)}</small>`:""}</td>
      <td style="text-align:right">${money(p.montoTotal,p.moneda)}</td>
      <td>${(p.reintegro&&p.reintegro.aplica)?`<span class="badge b-gold">reintegro ${money(p.reintegro.importe,p.moneda)}</span>`:`<span class="badge b-grey">sin reintegro</span>`}</td>
      <td>${tieneCaso?`<span class="badge b-green">Caso ${esc(p.casoId)}</span>`:`<span class="badge b-amber">Sin caso</span>`}</td>
      <td style="text-align:center;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="verPresupuesto('${p.id}')">👁 Ver</button>
        <button class="btn btn-ghost btn-sm" onclick="descargarPresupuesto('${p.id}')">⬇ PDF</button>
        ${tieneCaso
          ? `<button class="btn btn-ghost btn-sm" onclick="go('caso','${p.casoId}')">📁 Ver caso</button>`
          : `<button class="btn btn-primary btn-sm" onclick="generarCasoDesdePresupuesto('${p.id}')">➕ Generar caso</button>`}
      </td></tr>`;
  }).join(""):`<tr><td colspan="6" class="empty">Todavía no generaste presupuestos. Tocá “Nuevo presupuesto”.</td></tr>`;
  document.getElementById("view").innerHTML=`
    <div class="pagehead"><div><h2>Presupuestos</h2><div class="sub">Generá presupuestos automáticos · es el primer paso de la contratación</div></div>
      <button class="btn btn-primary" onclick="openNewPresupuesto()">＋ Nuevo presupuesto</button></div>
    <div class="alert alert-info"><span>🧾</span><div>Completá los datos y el sistema arma el presupuesto listo para enviar. Cada presupuesto queda guardado; desde él podés <b>generar el caso</b> con las condiciones económicas ya cargadas.</div></div>
    <div class="card" style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Monto</th><th>Reintegro</th><th>Estado</th><th style="text-align:center">Acciones</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---- Alta ---- */
function openNewPresupuesto(){
  PRESU_CUOTAS=[{label:"Al momento de confirmar el servicio",importe:""},{label:"Antes de la audiencia con META",importe:""}]; PRESU_MANUAL=false;
  modal({title:"Nuevo presupuesto", size:"", body:`
    <div class="frow fr2">${inp("pr_ap","Apellido","")}${inp("pr_no","Nombre","")}</div>
    ${inp("pr_url","Cuenta afectada (URL)","")}
    <div class="frow fr2">${sel("pr_mon","Moneda",["USD","ARS"],"USD")}${inp("pr_total","Monto total (honorarios)","","number")}</div>
    <div class="section-title" style="margin-top:6px">Forma de pago (cuotas)</div>
    <div id="pr_cuotas"></div>
    <button type="button" class="btn btn-ghost btn-sm" onclick="presuAddCuota()" style="margin-top:2px">＋ Agregar cuota</button>
    <div class="hint" style="margin-top:6px">Al generar el caso, la <b>1ª cuota</b> se toma como adelanto y el resto como saldo.</div>
    <div class="section-title" style="margin-top:14px">Política de reintegro</div>
    <div class="check"><input type="checkbox" id="pr_reint_ck" onchange="presuToggleReint()"><label for="pr_reint_ck" style="margin:0;font-weight:500">Tiene reintegro si no se recupera la cuenta</label></div>
    <div id="pr_reint_box" style="display:none;margin-top:8px">${inp("pr_reint","Monto del reintegro parcial","","number")}</div>
    <div class="hint" style="margin-top:4px">Si no corresponde reintegro, dejalo destildado y esa sección no aparece en el presupuesto.</div>`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="presuGenerar()">Generar presupuesto</button>`});
  presuRenderCuotas();
  const t=document.getElementById("pr_total"); if(t) t.addEventListener("input",presuAutoSplit);
}
function presuRenderCuotas(){
  const box=document.getElementById("pr_cuotas"); if(!box) return;
  box.innerHTML=PRESU_CUOTAS.map((q,i)=>`<div class="frow" style="grid-template-columns:1fr 130px 36px;gap:8px;margin-bottom:8px;align-items:end">
    <div class="field" style="margin:0"><label>Concepto</label><input value="${esc(q.label||"")}" oninput="PRESU_CUOTAS[${i}].label=this.value"></div>
    <div class="field" style="margin:0"><label>Importe</label><input type="number" value="${q.importe}" oninput="PRESU_CUOTAS[${i}].importe=this.value;PRESU_MANUAL=true"></div>
    <button type="button" class="btn btn-ghost btn-sm" onclick="presuDelCuota(${i})" title="Quitar" style="height:38px">✕</button>
  </div>`).join("");
}
function presuAddCuota(){ PRESU_CUOTAS.push({label:"Cuota "+(PRESU_CUOTAS.length+1),importe:""}); if(!PRESU_MANUAL)presuAutoSplit(); else presuRenderCuotas(); }
function presuDelCuota(i){ PRESU_CUOTAS.splice(i,1); if(!PRESU_MANUAL)presuAutoSplit(); else presuRenderCuotas(); }
// Reparte el total en partes iguales entre las cuotas (50/50 con dos, o dividido por la cantidad).
// Se mantiene en sincronía mientras el usuario no edite una cuota a mano.
function presuAutoSplit(){
  if(PRESU_MANUAL){ presuRenderCuotas(); return; } // el usuario ya ajustó montos: no pisar
  const total=Number(val("pr_total")||0); const n=PRESU_CUOTAS.length; if(!n) return;
  if(!total){ PRESU_CUOTAS.forEach(q=>q.importe=""); presuRenderCuotas(); return; }
  const each=Math.round((total/n)*100)/100;
  PRESU_CUOTAS.forEach((q,i)=> q.importe = i===n-1 ? Math.round((total-each*(n-1))*100)/100 : each);
  presuRenderCuotas();
}
function presuToggleReint(){ const on=document.getElementById("pr_reint_ck").checked; const b=document.getElementById("pr_reint_box"); if(b) b.style.display=on?"":"none"; }

function presuGenerar(){
  const ap=val("pr_ap").trim(), no=val("pr_no").trim(), url=val("pr_url").trim();
  const moneda=val("pr_mon")||"USD", total=Number(val("pr_total")||0);
  if(!total){ toast("Cargá el monto total","err"); return; }
  const cuotas=PRESU_CUOTAS.map(q=>({label:(q.label||"").trim()||"Cuota", importe:Number(q.importe||0)})).filter(q=>q.importe>0);
  if(!cuotas.length){ toast("Cargá al menos una cuota con importe","err"); return; }
  const reintOn=document.getElementById("pr_reint_ck").checked, reintImp=Number(val("pr_reint")||0);
  const p={
    id:uid("pre"), fecha:todayISO(),
    cliente:{apellido:ap.toUpperCase(), nombre:no}, cuenta:{url},
    moneda, montoTotal:total, cuotas,
    reintegro:{aplica:reintOn&&reintImp>0, importe:reintOn?reintImp:0},
    creadoPor:SESSION?SESSION.id:null, casoId:null, drive:null
  };
  PRESU_DRAFT=p; closeModal(); presuPreview(tplPresupuesto(p), p);
}

/* ---- Previsualización ---- */
function presuPreview(html, p){
  modal({title:"Previsualización — Presupuesto", size:"lg", body:`
    <div class="alert alert-info"><span>✏️</span><div>Revisá el presupuesto. Podés editar el texto antes de guardarlo.${CLOUD?" Al guardar se registra y se sube a Drive + Supabase.":" Al guardar queda registrado en este dispositivo."}</div></div>
    <div id="presuEdit" contenteditable="true" class="docview" style="border:1px solid var(--line);border-radius:8px;padding:30px 36px;background:#fff;max-height:60vh;overflow:auto">${html}</div>`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-ghost" onclick="descargarPresupuestoLive()">⬇ Descargar PDF</button>
      <button class="btn btn-primary" onclick="presuGuardar()">✓ Guardar presupuesto</button>`});
}
function presuCapturarHtml(){ const e=document.getElementById("presuEdit"); return e?e.innerHTML:(PRESU_DRAFT&&PRESU_DRAFT.html)||""; }
function descargarPresupuestoLive(){
  const p=PRESU_DRAFT||{}; const html=presuCapturarHtml();
  toast("Generando PDF…");
  docToPdfFile({tipo:"presupuesto",html}, presuNombreArch(p));
}
async function presuGuardar(){
  const p=PRESU_DRAFT; if(!p){ closeModal(); return; }
  p.html=presuCapturarHtml();
  const pool=presupuestosPool(); const ix=pool.findIndex(x=>x.id===p.id);
  if(ix>=0) pool[ix]=p; else pool.unshift(p);
  closeModal(); toast("Guardando presupuesto…");
  await persistPresupuesto(p);
  toast("Presupuesto guardado ✓"); go("presupuestos");
}

/* ---- Persistencia: Supabase (tabla presupuestos) + Drive (best-effort) ---- */
async function persistPresupuesto(p){
  if(!CLOUD){ if(typeof saveLocal==="function") saveLocal(); return; }
  // 1) Registro en Supabase (tabla 'presupuestos'; en el borrador puede no existir todavía)
  try{
    const row={ id:p.id, fecha:p.fecha, cliente:p.cliente, cuenta:p.cuenta, moneda:p.moneda,
      monto_total:Number(p.montoTotal||0), cuotas:p.cuotas||[], reintegro:p.reintegro||{aplica:false,importe:0},
      html:p.html||"", caso_id:p.casoId||null, creado_por:p.creadoPor||null, updated_at:new Date().toISOString() };
    const { error } = await sb.from("presupuestos").upsert(row);
    if(error) console.warn("presupuestos upsert (tabla pendiente de crear):", error.message);
  }catch(e){ console.warn("persistPresupuesto/supabase", e); }
  // 2) PDF en Drive (a la carpeta del caso si ya existe; si no, a la carpeta general de presupuestos)
  try{
    const b64=await docToPdfBase64({tipo:"presupuesto",html:p.html});
    const nombre=presuNombreArch(p)+".pdf";
    const {data:{session}}=await sb.auth.getSession();
    const hdrs={"Authorization":"Bearer "+(session&&session.access_token),"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY};
    const body = p.casoId
      ? { casoId:p.casoId, action:"upload", tipo:"Presupuesto", nombre, mime:"application/pdf", base64:b64 }
      : { action:"presupuesto", presupuestoId:p.id, nombre, mime:"application/pdf", base64:b64 };
    const r=await fetch(FUNCTIONS_URL+"/drive-sync",{method:"POST",headers:hdrs,body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(j&&(j.link||j.drive||j.respaldo)) p.drive=j.drive||{link:j.link||""};
    else console.warn("drive presupuesto (acción pendiente de agregar al backend):", (j&&(j.detail||j.error))||r.status);
  }catch(e){ console.warn("persistPresupuesto/drive", e); }
}

/* ---- Acciones de la lista ---- */
function verPresupuesto(id){ const p=presupuestosPool().find(x=>x.id===id); if(!p) return; PRESU_DRAFT=p; presuPreview(p.html||tplPresupuesto(p), p); }
function descargarPresupuesto(id){ const p=presupuestosPool().find(x=>x.id===id); if(!p) return; toast("Generando PDF…"); docToPdfFile({tipo:"presupuesto",html:p.html||tplPresupuesto(p)}, presuNombreArch(p)); }

/* ---- Generar el CASO a partir del presupuesto (primer paso de la contratación) ---- */
async function generarCasoDesdePresupuesto(id){
  const p=presupuestosPool().find(x=>x.id===id); if(!p) return;
  if(p.casoId){ go("caso",p.casoId); return; }
  if(!confirm("Se va a crear un caso nuevo a partir de este presupuesto, con el cliente y las condiciones económicas ya cargadas (monto, cuotas y reintegro). ¿Continuar?")) return;
  const {id:idc}=await reservarCasoId();
  const c=demoCase();
  const adelanto=Number((p.cuotas[0]&&p.cuotas[0].importe)||0);
  const saldo=Math.max(Number(p.montoTotal||0)-adelanto,0);
  Object.assign(c,{
    id:idc, estado:"Nuevo caso", fechaAlta:todayISO(),
    responsable:SESSION?SESSION.id:"", abogadoPatrocinante:(DB.abogados[0]&&DB.abogados[0].id)||"",
    proximaAccion:"Enviar formulario al cliente", fechaLimite:"",
    cliente:{apellido:p.cliente.apellido||"", nombre:p.cliente.nombre||"", dni:"", cuit:"", nacionalidad:"Argentina", fechaNac:"", estadoCivil:"", conyuge:"", domicilio:"", localidad:"", provincia:"", cp:"", tel:"", email:""},
    cuenta:{plataforma:"Instagram", url:p.cuenta.url||"", handle:"", emailVinc:"", telVinc:"", tipo:"", pautaActiva:false, saldoRetenido:false, cuentasVinc:"", businessManager:false, metodoPago:false, campanasActivas:false, hackeo:false},
    relato:{fechaSusp:"",mensaje:"",tipoSusp:"",apelo:false,recibioResp:false,hackeo:false,recupParcial:false,volvioSusp:false,perdida:"",original:"",sintesis:""},
    finanzas:{moneda:p.moneda||"USD", montoTotal:p.montoTotal||"", adelanto:adelanto||"", saldo:saldo||"", fechaAdelanto:"", fechaSaldo:"", devolucion:(p.reintegro&&p.reintegro.aplica)?p.reintegro.importe:"", estadoPago:"pendiente", medioPago:"", obs:"Generado desde presupuesto", ...finEstadosDefault(), hist:[]},
    pagos:[],
    gastos:GASTOS_DEFAULT.map(n=>({id:uid("g"),nombre:n,estado:"pendiente",importe:"",moneda:"ARS",fecha:"",medio:"",obs:"",adjunto:""})),
    docs:[], tareas:[], adjuntos:[], drive:{link:"",creada:false}, objeto:DB.config.objeto, citarFacebook:true, audiencia:null, avance:{},
    historial:[], formToken:null, observaciones:"Presupuesto asociado: "+money(p.montoTotal,p.moneda), presupuestoId:p.id
  });
  logAction(c,"Caso creado desde presupuesto");
  DB.casos.unshift(c);
  p.casoId=idc;
  if(CLOUD){ CURRENT=c; try{ await cloudInsertCase(c); }catch(e){ console.error(e); } await persistPresupuesto(p); }
  else { save(); }
  toast("Caso "+idc+" creado desde el presupuesto ✓");
  go("caso", idc);
}

(async function boot(){
  initTheme();
  // Formulario público del cliente (con o sin nube)
  const formTk=getFormToken();
  if(formTk){
    if(CLOUD){ renderClientFormCloud(formTk); }
    else { loadLocal(); renderClientForm(formTk); }
    return;
  }
  if(CLOUD){
    const {data:{session}}=await sb.auth.getSession();
    if(session){ await afterAuth(); }
    else { DB={config:{},abogados:[],usuarios:[],casos:[]}; renderLogin(); }
  } else {
    loadLocal(); renderLogin();
  }
})();
</script>
