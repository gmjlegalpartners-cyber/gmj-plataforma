<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GMJ Legal Partners — Plataforma de Gestión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0f1f3d; --navy2:#16294d; --slate:#1e293b; --slate2:#334155;
  --muted:#64748b; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f1f5f9; --card:#ffffff;
  --gold:#c0972f; --gold-soft:#f7efda; --primary:#1f4e8c; --primary-d:#163a69;
  --green:#15803d; --green-bg:#dcfce7; --amber:#b45309; --amber-bg:#fef3c7;
  --red:#b91c1c; --red-bg:#fee2e2; --blue:#1d4ed8; --blue-bg:#dbeafe;
  --grey-bg:#f1f5f9; --text:#0f172a; --shadow:0 1px 3px rgba(15,31,61,.08),0 1px 2px rgba(15,31,61,.06);
  --shadow-lg:0 10px 30px rgba(15,31,61,.12); --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--primary);text-decoration:none}
.hidden{display:none!important}

/* LOGIN */
#login{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2) 60%,var(--primary-d));display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{background:#fff;border-radius:18px;padding:42px 40px;width:420px;max-width:92vw;box-shadow:var(--shadow-lg);text-align:center}
.brand-mark{width:86px;height:100px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.login-card h1{font-size:20px;color:var(--navy);letter-spacing:.5px}
.login-card .sub{color:var(--muted);font-size:13px;margin-top:4px;margin-bottom:26px}
.role-opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;transition:.15s;width:100%}
.role-opt:hover{border-color:var(--primary);background:#f8fafc;transform:translateY(-1px)}
.role-opt .ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.role-opt .t{font-weight:600;color:var(--navy)}
.role-opt .d{font-size:12px;color:var(--muted)}
.usersel{margin-top:6px}

/* LAYOUT */
#app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);color:#cdd7e6;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20}
.sidebar .logo{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .logo .m{width:40px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar .logo .n{font-weight:700;color:#fff;font-size:14px;line-height:1.1}
.sidebar .logo .n small{display:block;font-weight:400;color:#8ba0bf;font-size:11px;margin-top:2px}
.nav{padding:14px 12px;flex:1;overflow-y:auto}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6f86a8;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#cdd7e6;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.12s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(31,78,140,.4)}
.nav a .i{width:18px;text-align:center;font-size:15px}
.sidebar .foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.userbox{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.userbox .av{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#3a2c06;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.userbox .nm{font-size:13px;color:#fff;font-weight:600}
.userbox .rl{font-size:11px;color:#8ba0bf}
.logout{margin-top:8px;width:100%;padding:8px;border-radius:8px;color:#9fb1cc;font-size:12px;background:rgba(255,255,255,.05)}
.logout:hover{background:rgba(255,255,255,.1);color:#fff}

.main{margin-left:248px;flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:15}
.topbar .crumb{font-size:13px;color:var(--muted)}
.topbar .crumb b{color:var(--navy);font-weight:600;font-size:16px;display:block}
.bell-btn{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s}
.bell-btn:hover{background:var(--bg)}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e23b3b;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.notif-panel{position:absolute;right:0;top:46px;width:360px;max-height:460px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:40}
.notif-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.notif-h h4{margin:0;font-size:14px;color:var(--navy)}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.notif-item:hover{background:var(--bg)}
.notif-item.unread{background:#f3f8ff}
.notif-item .ni-ic{flex-shrink:0;font-size:17px}
.notif-item .ni-t{font-weight:600;color:var(--navy);font-size:13px}
.notif-item .ni-b{color:var(--muted);font-size:12px;margin-top:1px}
.notif-item .ni-d{color:var(--muted);font-size:11px;margin-top:3px}
.tk-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tk-row:hover{background:var(--bg)}
.tk-row .tk-chk{margin-top:0}
.tk-main{flex:1;cursor:pointer;min-width:0}
.tk-title{font-weight:600;color:var(--navy);font-size:13.5px}
.tk-meta{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-estado{border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:12px;background:#fff;cursor:pointer;text-transform:capitalize}
.tk-estado.est-realizada{background:#e8f7ee;border-color:#bce3c9;color:#1c7a40}
.tk-estado.est-cancelada{background:#f0f0f0;color:#888}
.tk-estado.est-vencida{background:#fdeaea;border-color:#f3c0c0;color:#c0392b}
.tk-estado.est-en_curso{background:#eaf2fd;border-color:#bcd4f3;color:#2563b8}
.tk-kebab{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:17px;line-height:1;color:var(--muted);flex-shrink:0}
.tk-kebab:hover{background:var(--bg)}
.tk-menu{position:fixed;z-index:60;width:228px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.16);padding:6px}
.tk-menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--navy)}
.tk-menu button:hover{background:var(--bg)}
.tk-menu button.danger{color:#d12f2f}
.tk-menu-sep{height:1px;background:var(--line);margin:5px 4px}
.content{padding:26px 28px 60px}

/* COMPONENTS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;transition:.13s;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{filter:brightness(.94)}
.btn-ghost{background:#fff;border:1px solid var(--line2);color:var(--slate)}
.btn-ghost:hover{background:#f8fafc;border-color:var(--muted)}
.btn-danger{background:#fff;border:1px solid var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:15px;color:var(--navy)}
.card-b{padding:20px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}

.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:28px;font-weight:700;color:var(--navy);margin-top:6px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
.stat.accent{border-left:4px solid var(--primary)}
.stat.gold{border-left:4px solid var(--gold)}
.stat.green{border-left:4px solid var(--green)}
.stat.amber{border-left:4px solid var(--amber)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:#fafbfc}
td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr.clickable{cursor:pointer;transition:.1s}
tr.clickable:hover{background:#f8fafc}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-grey{background:var(--grey-bg);color:var(--slate2)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gold{background:var(--gold-soft);color:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:6px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--text);transition:.12s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,78,140,.12)}
.field textarea{resize:vertical;min-height:80px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red)}
.frow{display:grid;gap:14px}
.fr2{grid-template-columns:1fr 1fr}
.fr3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:760px){.fr2,.fr3{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:9px;padding:8px 0}
.check input{width:auto}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:22px;padding-bottom:0}
.tabs button{padding:11px 15px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--slate)}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.tabs button .pill{display:inline-block;margin-left:6px;background:var(--grey-bg);color:var(--slate2);border-radius:10px;padding:0 7px;font-size:11px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,31,61,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:760px;max-width:96vw;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.modal.sm{width:480px}.modal.lg{width:920px}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{font-size:16px;color:var(--navy)}
.modal-h .x{font-size:22px;color:var(--muted);width:30px;height:30px;border-radius:7px}
.modal-h .x:hover{background:var(--grey-bg)}
.modal-b{padding:22px;max-height:68vh;overflow-y:auto}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gold);margin:6px 0 12px;padding-bottom:6px;border-bottom:1px dashed var(--line2)}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{color:var(--text);font-weight:500}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ico{font-size:38px;opacity:.4;margin-bottom:10px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:200;font-size:13.5px;display:flex;align-items:center;gap:10px;animation:slidein .25s ease}
.toast.err{background:var(--red)}
.toast.ok .i{color:#86efac}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.pagehead h2{font-size:20px;color:var(--navy)}
.pagehead .sub{font-size:13px;color:var(--muted);margin-top:2px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{width:100%;padding-left:34px}
.search .si{position:absolute;left:11px;top:8px;color:var(--muted)}

.timeline{position:relative;padding-left:24px}
.timeline:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item .d{position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tl-item .act{font-weight:600;color:var(--navy);font-size:13.5px}
.tl-item .meta{font-size:12px;color:var(--muted);margin-top:2px}

.alert{padding:12px 15px;border-radius:9px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.alert-warn{background:var(--amber-bg);color:#92400e;border:1px solid #fde68a}
.alert-info{background:var(--blue-bg);color:#1e40af;border:1px solid #bfdbfe}
.alert-ok{background:var(--green-bg);color:#166534;border:1px solid #bbf7d0}
.alert ul{margin:6px 0 0 18px}

.progress{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:8px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:5px;transition:.3s}

.doc-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
.doc-row .ic{width:40px;height:40px;border-radius:9px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.doc-row .meta small{color:var(--muted);font-size:12px}
.driveitem{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:9px;transition:.1s}
.driveitem:hover{background:#f8fafc}
.driveitem .fi{font-size:18px}
.fileinput{border:1.5px dashed var(--line2);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px}

.copy-link{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:8px 8px 8px 14px}
.copy-link input{flex:1;border:none;background:none;font-size:13px;color:var(--slate);outline:none}

/* checklist / tablero de avance */
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.av-block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.av-block .h{padding:13px 16px;background:var(--navy);color:#fff;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:space-between}
.av-block .h .pct{font-size:12px;font-weight:700;color:#cbb06a}
.av-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px}
.av-item:last-child{border-bottom:none}
.av-item .lab{display:flex;align-items:center;gap:8px}
.av-item .ic{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:#fff}
.st-completo{background:var(--green)}.st-pendiente{background:#cbd5e1;color:#475569}.st-nc{background:#94a3b8}.st-revision{background:var(--blue)}.st-observado{background:var(--amber)}
.av-item select{font-size:11.5px;padding:3px 6px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--slate)}
.av-item.auto select{display:none}
.av-item .autoflag{font-size:10px;color:var(--muted);font-style:italic}

/* print / document preview */
.docview{font-family:"Times New Roman",Georgia,serif;color:#000;background:#fff;line-height:1.5}
.docview h1{text-align:center;font-size:15px;margin-bottom:2px}
.docview h2{text-align:center;font-size:14px;margin-bottom:18px}
.docview p{margin-bottom:11px;text-align:justify;font-size:13px}
.docview .sig{margin-top:50px;display:flex;justify-content:space-around;text-align:center;font-size:12.5px}

@media(max-width:860px){.sidebar{width:64px}.sidebar .logo .n,.nav .sec,.nav a span:not(.i),.userbox .nm,.userbox .rl,.logout{display:none}.main{margin-left:64px}.nav a{justify-content:center}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="brand-mark" id="loginLogo"></div>
    <h1>GMJ LEGAL PARTNERS</h1>
    <div class="sub">Plataforma interna de gestión de casos</div>
    <div id="roleList"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="logo">
      <div class="m" id="sideLogo"></div>
      <div class="n">GMJ Legal Partners<small>Gestión de cuentas digitales</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div class="userbox">
        <div class="av" id="uav">–</div>
        <div><div class="nm" id="unm">–</div><div class="rl" id="url">–</div></div>
      </div>
      <button class="logout" onclick="logout()">Cerrar sesión</button>
      <div id="buildTag" style="text-align:center;font-size:10px;color:var(--muted);margin-top:8px;opacity:.7"></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"><b>Panel</b></div>
      <div style="display:flex;align-items:center;gap:14px">
        <div id="topActions"></div>
        <div id="notifBell" style="position:relative"></div>
      </div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============================================================
   GMJ LEGAL PARTNERS — Plataforma interna
   MODO DUAL:
   - Si SUPABASE_URL y SUPABASE_ANON_KEY están vacíos -> modo LOCAL (localStorage).
   - Si están completos -> modo NUBE (datos compartidos en vivo + login + Calendar).
   Pegá tus claves de Supabase abajo para activar la versión multiusuario.

function cobradoDe(c){ const f=c.finanzas; return (c.pagos||[]).reduce((s,p)=>s+(p.moneda===f.moneda?Number(p.importe||0):0),0); }
function syncAdelanto(c){
  const f=c.finanzas; const ade=Number(f.adelanto||0); c.pagos=c.pagos||[];
  let p=c.pagos.find(x=>x.esAdelanto);
  if(ade>0){
    if(p){ p.importe=ade; p.moneda=f.moneda; p.fecha=f.fechaAdelanto||p.fecha||new Date().toISOString().slice(0,10); p.medio=f.medioPago||p.medio; }
    else { c.pagos.push({id:uid("p"),importe:ade,moneda:f.moneda,fecha:f.fechaAdelanto||new Date().toISOString().slice(0,10),medio:f.medioPago,obs:"Adelanto inicial",esAdelanto:true}); }
  } else if(p){ c.pagos=c.pagos.filter(x=>!x.esAdelanto); }
}
function saldoDe(c){ const f=c.finanzas; return Math.max(Number(f.montoTotal||0)-Number(f.adelanto||0),0); }
function syncSaldo(c){
  const f=c.finanzas; c.pagos=c.pagos||[]; const saldo=saldoDe(c);
  let p=c.pagos.find(x=>x.esSaldo);
  if(f.saldoPagado && saldo>0){
    if(p){ p.importe=saldo; p.moneda=f.moneda; p.fecha=f.fechaSaldoPago||p.fecha||new Date().toISOString().slice(0,10); p.medio=f.medioSaldo||f.medioPago||p.medio; }
    else { c.pagos.push({id:uid("p"),importe:saldo,moneda:f.moneda,fecha:f.fechaSaldoPago||new Date().toISOString().slice(0,10),medio:f.medioSaldo||f.medioPago,obs:"Saldo / diferencia",esSaldo:true}); }
  } else if(p){ c.pagos=c.pagos.filter(x=>!x.esSaldo); }
}
function recalcEstadoPago(c){ const f=c.finanzas; const cob=cobradoDe(c); const tot=Number(f.montoTotal||0);
  if(f.estadoPago!=='vencido') f.estadoPago = cob<=0?'pendiente':(tot>0&&cob>=tot?'completo':'parcial');
  // mantener sincronizado el estado de cobro nuevo (salvo override manual a vencido/saldo)
  if(f.estadoCobro!=='vencido' && f.estadoCobro!=='saldo_pendiente') f.estadoCobro = cob<=0?'no_cobrado':(tot>0&&cob>=tot?'cobrado_completo':'cobro_parcial');
}

function bindRealtime(){
  if(!sb || RT_BOUND) return; RT_BOUND=true;
  sb.channel("gmj-db")
    .on("postgres_changes",{event:"*",schema:"public",table:"casos"}, cloudRefresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"case_finance"}, cloudRefresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"settings"}, cloudRefresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"cambios_divisa"}, cloudRefresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"liquidaciones"}, cloudRefresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"gastos_generales"}, cloudRefresh)
    .subscribe();
  // canal propio para tareas (refresco liviano, no interrumpe)
  sb.channel("gmj-tareas")
    .on("postgres_changes",{event:"*",schema:"public",table:"tareas"}, onTareaChange)
    .subscribe();
  // canal propio para notificaciones (filtrado por usuario)
  sb.channel("gmj-notif")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"notificaciones",filter:"user_id=eq."+SESSION.id}, onNotifInsert)
    .subscribe();
  startLivePolling();
}

/* ---------- TAREAS: persistencia ---------- */
async function tareaUpsert(t, isNew){
  if(CLOUD){
    // En altas usamos INSERT (política de inserción); en ediciones usamos UPDATE
    // (política de edición: socio, creador o asignado). Evita el choque de RLS del upsert.
    const exists = (DB.tareas||[]).some(x=>x.id===t.id);
    const insert = isNew===true || (isNew===undefined && !exists);
    const row={ id:t.id, titulo:t.titulo, descripcion:t.descripcion||null, asignados:t.asignados||[], creado_por:t.creado_por, caso_id:t.caso_id||null, cliente_nombre:t.cliente_nombre||null, vence:t.vence||null, hora:t.hora||null, duracion:t.duracion||null, prioridad:t.prioridad||"media", estado:t.estado||"pendiente", observaciones:t.observaciones||null, recordatorio:t.recordatorio||null, privacidad:t.privacidad||"equipo", eventos:t.eventos||{}, updated_at:new Date().toISOString() };
    let res;
    if(insert){ res=await sb.from("tareas").insert(row).select().maybeSingle(); }
    else { const up={...row}; delete up.creado_por; res=await sb.from("tareas").update(up).eq("id",t.id).select().maybeSingle(); }
    if(res.error){ console.error("tareaUpsert",res.error); toast("Error al guardar la tarea: "+res.error.message,"err"); return null; }
    return res.data;
  } else {
    DB.tareas=DB.tareas||[]; const i=DB.tareas.findIndex(x=>x.id===t.id);
    if(i>=0) DB.tareas[i]=t; else DB.tareas.push(t); saveLocal(); return t;
  }
}
async function tareaDelete(id){
  if(CLOUD){ const {error}=await sb.from("tareas").delete().eq("id",id); if(error){ toast("Error al eliminar: "+error.message,"err"); return false; } }
  DB.tareas=(DB.tareas||[]).filter(t=>t.id!==id); if(!CLOUD) saveLocal(); return true;
}

function tareaVisible(t){ // por las dudas (RLS ya filtra en nube)
  if(isSocio()) return true;
  return t.creado_por===SESSION.id || (t.asignados||[]).includes(SESSION.id) || (t.privacidad!=="privada" && t.caso_id);

}

async function archivarCaso(id, arch){
  const c=DB.casos.find(x=>x.id===id); if(!c) return;
  if(arch && !confirm("¿Archivar este caso? Dejará de aparecer en el listado principal. Se puede restaurar cuando quieras.")) return;
  c.archivado=arch; c.archivadoPor=arch?SESSION.id:null; c.archivadoEn=arch?now():null;
  logAction(c, arch?"Caso archivado":"Caso restaurado");
  await persistCaso(c);
  toast(arch?"Caso archivado":"Caso restaurado");
  if(arch && ROUTE==="caso"){ go("casos"); } else if(ROUTE==="caso"){ renderCaso(); } else { renderCasos(); }
}
async function eliminarCasoDef(id){
  if(!isSocio()){ toast("Solo los socios pueden eliminar definitivamente","err"); return; }
  if(!confirm("¿Eliminar este caso DEFINITIVAMENTE? Esta acción NO se puede deshacer.")) return;
  const motivo = prompt("Motivo de la eliminación (opcional):")||"";
  if(CLOUD){
    try{
      await sb.from("audit_log").insert({accion:"Caso eliminado definitivamente", caso_id:id, detalle:motivo, usuario:SESSION.id});
      const {error}=await sb.from("casos").delete().eq("id",id);
      if(error){ toast("Error al eliminar: "+error.message,"err"); return; }
    }catch(e){ console.error(e); toast("Error al eliminar","err"); return; }
  }
  DB.casos=DB.casos.filter(c=>c.id!==id);
  if(!CLOUD) saveLocal();
  CURRENT=null; toast("Caso eliminado"); go("casos");
}
function caseProgress(c){
  let done=0,total=7;
  if(c.cliente.dni) done++;
  if(c.cuenta.url) done++;
  if(c.relato.original||c.relato.sintesis) done++;
  if((c.adjuntos||[]).some(a=>a.tipo==="DNI frente")) done++;
  if(c.docs.some(d=>d.tipo==="contrato")) done++;
  if(c.docs.some(d=>d.tipo==="carta_poder")) done++;
  if(c.docs.some(d=>d.tipo==="mediacion")) done++;
  return Math.round(done/total*100);
}

const AV_STATUS={completo:{c:'st-completo',i:'✓',t:'Completo'},pendiente:{c:'st-pendiente',i:'•',t:'Pendiente'},nc:{c:'st-nc',i:'–',t:'No corresponde'},revision:{c:'st-revision',i:'?',t:'En revisión'},observado:{c:'st-observado',i:'!',t:'Observado'}};
function avBlocks(c){
  const cl=c.cliente,cu=c.cuenta,re=c.relato,f=c.finanzas;
  const adj=t=>(c.adjuntos||[]).some(a=>a.tipo===t);
  const doc=t=>c.docs.filter(d=>d.tipo===t).sort((a,b)=>b.version-a.version)[0];
  const dmin=(t,es)=>{const d=doc(t);return !!(d&&es.includes(d.estado));};
  const b=v=>v?'completo':'pendiente';
  const blocks=[
    {t:"Datos del cliente", items:[
      ["cli_pers","Datos personales completos",b(cl.nombre&&cl.apellido&&cl.dni)],
      ["cli_dom","Domicilio completo",b(cl.domicilio&&cl.localidad&&cl.provincia)],
      ["cli_tel","Teléfono",b(cl.tel)],["cli_mail","Mail",b(cl.email)],
      ["cli_dnif","DNI frente",b(adj("DNI frente"))],["cli_dnid","DNI dorso",b(adj("DNI dorso"))],
    ]},
    {t:"Cuenta afectada", items:[
      ["cu_url","URL de la cuenta",b(cu.url)],["cu_handle","Usuario / handle",b(cu.handle)],
      ["cu_mail","Mail vinculado",b(cu.emailVinc)],["cu_tel","Teléfono vinculado",b(cu.telVinc)],
      ["cu_relato","Relato de hechos",b(re.original||re.sintesis)],
      ["cu_capt","Capturas de suspensión",b(adj("Captura aviso de suspensión"))],
      ["cu_pru","Pruebas adicionales",b(adj("Otra documentación")||adj("Conversaciones / pruebas")||adj("Captura de la cuenta"))],
    ]},
    {t:"Documentación legal", items:[
      ["dl_cg","Contrato generado",b(doc("contrato"))],
      ["dl_ce","Contrato enviado",b(dmin("contrato",["enviado","firmado","final"]))],
      ["dl_cf","Contrato firmado",b(dmin("contrato",["firmado","final"]))],
      ["dl_pg","Carta poder generada",b(doc("carta_poder"))],
      ["dl_pe","Carta poder enviada",b(dmin("carta_poder",["enviado","firmado","final"]))],
      ["dl_pf","Carta poder firmada",b(dmin("carta_poder",["firmado","final"]))],
      ["dl_mg","Planilla de mediación generada",b(doc("mediacion"))],
    ]},
    {t:"Mediación", items:[
      ["me_med","Mediador asignado",b(DB.config.mediador)],
      ["me_gen","Solicitud de mediación generada",b(doc("mediacion"))],
      ["me_env","Solicitud enviada",b(dmin("mediacion",["enviado","firmado","final"]))],
      ["me_fec","Fecha de audiencia",b(audsOf(c).some(a=>a.fecha))],
      ["me_cal","Audiencia cargada en calendario",b(audsOf(c).some(a=>a.calCreado))],
      ["me_real","Audiencia realizada",b(audsOf(c).some(a=>a.realizada))],
    ]},
  ];
  if(isSocio()){
    blocks.splice(3,0,{t:"Finanzas", items:[
      ["fi_comp","Comprobante de pago recibido",b(adj("Comprobante de pago"))],
      ["fi_adel","Adelanto abonado",b(Number(f.adelanto||0)>0)],
      ["fi_sal","Saldo cancelado",f.montoTotal!==""?b(Number(f.saldo||0)<=0):'pendiente'],
      ["fi_full","Pago completo",b(f.estadoPago==='completo')],
    ]});
  }
  return blocks;
}
function avEff(c,key,auto){ return (c.avance&&c.avance[key])?c.avance[key]:auto; }
function setAv(key,v){ CURRENT.avance=CURRENT.avance||{}; if(v==="auto"){delete CURRENT.avance[key];}else{CURRENT.avance[key]=v;} save(); renderTab(); }
function tabAvance(c){
  const html=avBlocks(c).map(bl=>{
    const total=bl.items.length;
    const nc=bl.items.filter(([k,l,a])=>avEff(c,k,a)==='nc').length;
    const done=bl.items.filter(([k,l,a])=>avEff(c,k,a)==='completo').length;
    const pct=(total-nc)>0?Math.round(done/(total-nc)*100):100;
    const items=bl.items.map(([k,l,a])=>{
      const st=avEff(c,k,a); const s=AV_STATUS[st]||AV_STATUS.pendiente; const ov=c.avance&&c.avance[k];
      return `<div class="av-item"><div class="lab"><span class="ic ${s.c}">${s.i}</span>${esc(l)}</div>
        <select onchange="setAv('${k}',this.value)"><option value="auto" ${!ov?'selected':''}>Auto · ${AV_STATUS[a].t}</option>
        ${Object.entries(AV_STATUS).map(([v,o])=>`<option value="${v}" ${ov===v?'selected':''}>${o.t}</option>`).join("")}</select></div>`;
    }).join("");
    return `<div class="av-block"><div class="h">${esc(bl.t)}<span class="pct">${pct}%</span></div>${items}</div>`;
  }).join("");
  return `<div class="alert alert-info"><span>🧭</span><div>Cada bloque es independiente y avanza por separado. El estado se calcula solo según los datos cargados; podés sobrescribirlo manualmente (En revisión, Observado, No corresponde).</div></div>
    <div class="av-grid">${html}</div>`;
}

/* ---------- VALIDATIONS ---------- */
function validateDoc(c,tipo){
  const missing=[]; const cl=c.cliente, cu=c.cuenta, f=c.finanzas;
  const need=(cond,label)=>{ if(!cond) missing.push(label); };
  if(tipo==="contrato"){
    need(cl.nombre&&cl.apellido,"Nombre y apellido"); need(cl.domicilio,"Domicilio"); need(cl.email,"Email");
    need(cl.tel,"Teléfono"); need(cu.handle||cu.url,"Cuenta objeto de la gestión");
    need(f.montoTotal!=="","Monto total"); need(f.adelanto!=="","Adelanto"); need(f.saldo!=="","Saldo");
    need(f.devolucion!=="","Devolución pactada"); need(f.moneda,"Moneda");
  } else if(tipo==="carta_poder"){
    need(cl.nombre&&cl.apellido,"Nombre y apellido"); need(cl.dni,"DNI / identificación"); need(cl.domicilio,"Domicilio");
    need(cl.email,"Email"); need(cu.handle||cu.url,"Cuenta afectada"); need(c.abogadoPatrocinante,"Abogado autorizado");
  } else if(tipo==="mediacion"){
    need(cl.nombre&&cl.apellido,"Nombre y apellido del requirente"); need(cl.dni,"DNI"); need(cl.cuit,"CUIT / CUIL");
    need(cl.domicilio,"Domicilio completo"); need(cl.tel,"Teléfono"); need(cl.email,"Email");
    need(cu.url,"URL de la cuenta afectada"); need(cu.emailVinc,"Email vinculado a la cuenta");
    need(c.relato.sintesis||c.relato.original,"Síntesis del hecho");
    need((c.adjuntos||[]).some(a=>a.tipo==="DNI frente"),"DNI frente adjunto");
    need((c.adjuntos||[]).some(a=>a.tipo==="DNI dorso"),"DNI dorso adjunto");
    need(c.abogadoPatrocinante,"Abogado patrocinante");
  }
  return {ok:missing.length===0, missing};
}

function readAudInto(a){ a.fecha=val("au_fec"); a.hora=val("au_hora"); a.duracion=val("au_dur"); a.modalidad=val("au_mod"); a.linkReunion=val("au_link"); a.lugar=val("au_lugar"); a.obs=val("au_obs"); return a; }
function resolveAud(c,id){ if(id==="__new__"){ const a={id:uid("a")}; c.audiencias.push(a); return a; } return c.audiencias.find(x=>x.id===id); }
function allInvitados(){ return DB.usuarios.map(u=>u.id); }
async function saveAud(id){
  const c=CURRENT; ensureAudiencias(c); const a=resolveAud(c,id); if(!a) return;
  readAudInto(a);
  if(!a.fecha){ toast("Cargá la fecha de la audiencia","err"); return; }

async function marcarAud(id){ const c=CURRENT; const a=c.audiencias.find(x=>x.id===id); if(!a)return; a.realizada=true; c.estado="Audiencia realizada"; logAction(c,"Audiencia marcada como realizada"); await persistCaso(c); toast("Marcada como realizada"); renderTab(); }
async function eliminarAud(id){ if(!confirm("¿Eliminar esta audiencia? (no borra el evento ya creado en Google Calendar)"))return; const c=CURRENT; c.audiencias=c.audiencias.filter(x=>x.id!==id); logAction(c,"Audiencia eliminada"); await persistCaso(c); EDIT_AUD=null; toast("Audiencia eliminada"); renderTab(); }
async function crearEventoAud(id){
  const c=CURRENT; ensureAudiencias(c); const a=resolveAud(c,id); if(!a) return;
  readAudInto(a);
  if(!a.fecha){ toast("Cargá la fecha de la audiencia","err"); return; }
  if(c.estado==="Mediación solicitada"||c.estado==="Mediación pendiente") c.estado="Audiencia fijada";
  EDIT_AUD=a.id;
  await persistCaso(c);
  if(!CLOUD){ window.open(buildCalUrl(c,a),"_blank"); a.calCreado=true; await persistCaso(c); toast("Abriendo Google Calendar"); renderTab(); return; }
  const fb=c.citarFacebook!==false;
  const title=`Mediación - ${clienteFull(c)} c/ Meta Platforms Inc.${fb?' y Facebook Argentina S.R.L.':''}`;
  const durMin=parseInt(a.duracion)||60;
  const start=new Date((a.fecha)+"T"+(a.hora||"10:00")+":00"); const end=new Date(start.getTime()+durMin*60000);
  const iso=d=>{const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())+":00";};
  const det=[`Mediador: ${DB.config.mediador}`,`Cliente: ${clienteFull(c)}`,`Requerida: META PLATFORMS INC${fb?' y FACEBOOK ARGENTINA S.R.L.':''}`,`Modalidad: ${a.modalidad||'-'}`,a.linkReunion?`Link reunión: ${a.linkReunion}`:'',c.drive&&c.drive.link?`Carpeta Drive: ${c.drive.link}`:'',`Expediente: ${c.id}`,a.obs?`Obs: ${a.obs}`:''].filter(Boolean).join("\n");
  const location=a.modalidad==="Presencial"?(a.lugar||""):(a.linkReunion||"");
  const yaTenia=a.calCreado;
  toast(yaTenia?"Actualizando en los calendarios…":"Cargando en los calendarios…");
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(FUNCTIONS_URL+"/calendar-insert",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({invitados:allInvitados(),title,startISO:iso(start),endISO:iso(end),details:det,location,eventos:a.eventos||{}})});
    const j=await r.json();
    if(j.error){ toast("Audiencia guardada, pero falló el calendario: "+j.error,"err"); renderTab(); return; }
    a.eventos=Object.assign(a.eventos||{}, j.eventos||{}); a.calCreado=true;
    const oks=(j.results||[]).filter(x=>x.ok).length; const fails=(j.results||[]).filter(x=>!x.ok);
    logAction(c,"Audiencia "+(yaTenia?'actualizada':'cargada')+" en Google Calendar ("+oks+" agenda/s)");
    await persistCaso(c);
    if(fails.length) toast(oks+" ok · sin Google: "+fails.length,"err"); else toast((yaTenia?"Actualizado":"Cargado")+" en "+oks+" agenda/s ✓");
    renderTab();
  }catch(e){ console.error(e); toast("Audiencia guardada; error en el calendario","err"); renderTab(); }
}
function buildCalUrl(c,a){
  const fb=c.citarFacebook!==false;
  const title=`Mediación - ${clienteFull(c)} c/ Meta Platforms Inc.${fb?' y Facebook Argentina S.R.L.':''}`;
  const durMin=parseInt(a.duracion)||60;
  const startD=new Date((a.fecha||new Date().toISOString().slice(0,10))+"T"+(a.hora||"10:00")+":00");
  const endD=new Date(startD.getTime()+durMin*60000);
  const fmt=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
  const det=[`Mediador: ${DB.config.mediador}`,`Cliente: ${clienteFull(c)}`,`Modalidad: ${a.modalidad||'-'}`].join("\n");
  let url="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+fmt(startD)+"/"+fmt(endD)+"&details="+encodeURIComponent(det);
  const guests=[DB.config.estudio.mail,(DB.abogados[0]||{}).mail,(DB.abogados[1]||{}).mail,DB.config.asistenteMail].filter(Boolean);
  if(guests.length) url+="&add="+encodeURIComponent(guests.join(","));
  return url;
}

function previewDoc(tipo){
  const c=CURRENT; const v=validateDoc(c,tipo);
  if(!v.ok){ toast("Faltan datos obligatorios","err"); return; }
  const html=buildDocHtml(c,tipo);
  modal({title:"Previsualización — "+docTitle(tipo), size:"lg", body:`
    <div class="alert alert-info"><span>✏️</span><div>Podés editar el texto antes de generar. Al confirmar se guarda en Drive y queda registrado.</div></div>
    <div id="docEdit" contenteditable="true" class="docview" style="border:1px solid var(--line);border-radius:8px;padding:30px 36px;background:#fff">${html}</div>`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="finalizeDoc('${tipo}')">✓ Generar y guardar</button>`});
}
function finalizeDoc(tipo){
  const c=CURRENT;
  const content=document.getElementById("docEdit").innerHTML;
  const ver=(c.docs.filter(d=>d.tipo===tipo).length)+1;
  const doc={id:uid("d"),tipo,version:ver,estado:"borrador",fecha:now(),generadoPor:SESSION.id,html:content};
  c.docs.push(doc);
  // auto estado del caso
  if(tipo==="contrato"&&c.estado==="Documentación completa") c.estado="Contrato enviado";
  logAction(c, docTitle(tipo)+" generado (v"+ver+")");
  save(); closeModal(); toast(docTitle(tipo)+" generado y guardado en Drive"); renderCaso();
}
function docExportCSS(tipo){
  if(tipo==="carta_poder"){
    // compacto para entrar en UNA sola carilla
    return `@page{size:A4;margin:1.4cm 1.6cm}body{font-family:"Times New Roman",serif;font-size:9.6pt;line-height:1.2;color:#000}
      p{text-align:justify;margin:0 0 4.5pt}h1{text-align:center;font-size:12.5pt;margin:0 0 7pt}
      .sig{margin-top:14pt;display:flex;justify-content:center;text-align:center;font-size:9pt}`;
  }
  return `@page{size:A4;margin:2.2cm}body{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5;color:#000}
    p{text-align:justify;margin:0 0 11px}h1,h2{text-align:center;font-size:14pt;margin:0 0 4pt}
    .sig{margin-top:50pt;display:flex;justify-content:space-around;text-align:center;font-size:11pt}`;
}
function downloadDoc(id, fmt){
  const c=CURRENT; const d=c.docs.find(x=>x.id===id);
  const filename = docTitle(d.tipo).replace(/ /g,"_")+"_"+clienteFull(c).replace(/[ ,]+/g,"_")+"_v"+d.version;
  const css=docExportCSS(d.tipo);
  if(fmt==="word"){
    const blob=new Blob(['﻿<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+d.html+'</body></html>'],{type:"application/msword"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename+".doc"; a.click();
    toast("Documento Word descargado");
  } else {
    const w=window.open("","_blank");
    w.document.write(`<html><head><title>${filename}</title><style>${css}</style></head><body>${d.html}<script>window.onload=function(){window.print()}<\/script></body></html>`);
    w.document.close();
    toast("Abriendo vista de impresión / PDF");
  }
  setDocEstadoSilent(d);
}
function setDocEstadoSilent(d){ /* placeholder for download log */ logAction(CURRENT,docTitle(d.tipo)+" descargado"); save(); }

   FINANZAS GLOBAL (socios)
   ============================================================ */
function casoEsHistorial(c){ const f=c.finanzas||{}; return f.estadoLiquidacion==="liquidado_completo"; }
function dosMon(o){ return `<span style="white-space:nowrap">${money(o.USD,"USD")}</span> · <span style="white-space:nowrap">${money(o.ARS,"ARS")}</span>`; }
// costo de un gasto expresado en la moneda del caso (si está en otra moneda pero vinculado a un cambio, se convierte por ese cambio)
function gastoCostoEnCaso(g, casoMoneda){
  const imp=Number(g.importe||0); if(imp<=0) return 0;
  if((g.moneda||casoMoneda)===casoMoneda) return imp;
  if(g.cambioId){ const cx=(DB.cambios||[]).find(c=>c.id===g.cambioId); if(cx && cx.moneda_destino===g.moneda && cx.moneda_origen===casoMoneda && Number(cx.monto_destino)>0){ return Number(cx.monto_origen)*(imp/Number(cx.monto_destino)); } }
  return 0; // otra moneda sin vínculo: no se descuenta del liquidable de ESTE caso (ya impacta en la caja de su moneda)
}
// monto neto del caso disponible para repartir entre socios
function netLiquidableCaso(c){
  const f=c.finanzas||{}; const cob=cobradoDe(c); if(cob<=0) return 0;
  const dev=Number(f.devolucion||0);
  const devEnStandBy = dev>0 && f.estadoResultado!=='favorable' && !['realizada_dev','cancelada_dev'].includes(f.estadoDevolucion);
  const reservaCaso = devEnStandBy ? Math.min(dev,cob) : 0;
  const devRealizada = f.estadoDevolucion==='realizada_dev'?dev:0;
  let gastosCaso=0; (c.gastos||[]).forEach(g=>{ if(g.estado==='abonado') gastosCaso+=gastoCostoEnCaso(g, f.moneda); });
  const liq=liquidacionesDe(c.id).reduce((s,l)=>s+(l.reparto||[]).reduce((ss,r)=>ss+Number(r.monto||0),0),0);
  return Math.max(cob - reservaCaso - devRealizada - gastosCaso - liq, 0);
}
// lista unificada de TODOS los gastos (de casos + generales) para analizar en un solo lugar
function allGastos(){
  const out=[];
  casosActivos().forEach(c=>(c.gastos||[]).forEach(g=>{ if(!Number(g.importe||0))return; out.push({fecha:g.fecha,concepto:g.nombre,importe:Number(g.importe||0),moneda:g.moneda,estado:g.estado,medio:g.medio,origen:clienteFull(c),casoId:c.id,gid:g.id,cambioId:g.cambioId,tipo:'caso'}); }));
  (DB.gastosGen||[]).forEach(g=>{ if(!Number(g.importe||0))return; out.push({fecha:g.fecha,concepto:g.concepto,importe:Number(g.importe||0),moneda:g.moneda,estado:g.estado,medio:g.medio,origen:'General del estudio',ggId:g.id,cambioId:g.cambio_id,tipo:'general'}); });
  out.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  return out;
}
function calcFinanzasGlobal(){
  const z=()=>({USD:0,ARS:0}); const cur=m=>(m==="ARS"?"ARS":"USD");
  const a={pendCobro:z(),pendDev:z(),pendGasto:z(),pendLiq:z(),cobrado:z(),gastosPag:z(),devRealizada:z(),fxOut:z(),fxIn:z(),liquidado:z(),reservaDev:z()};
  // liquidado por caso (suma de repartos)
  const liqByCaso={};
  (DB.liquidaciones||[]).forEach(l=>{ const m=cur(l.moneda); const dist=(l.reparto||[]).reduce((s,r)=>s+Number(r.monto||0),0); a.liquidado[m]+=dist; liqByCaso[l.caso_id]=(liqByCaso[l.caso_id]||0)+dist; });
  casosActivos().forEach(c=>{
    const f=c.finanzas||{}; const m=cur(f.moneda); const cob=cobradoDe(c); const dev=Number(f.devolucion||0);
    a.cobrado[m]+=cob;
    // ¿la devolución pactada está "en stand by"? (cobrada pero podríamos tener que devolverla)
    // Se reserva mientras el caso no se resolvió favorable y la devolución no se realizó/canceló.
    const devEnStandBy = dev>0 && f.estadoResultado!=='favorable' && !['realizada_dev','cancelada_dev'].includes(f.estadoDevolucion);
    const reservaCaso = devEnStandBy ? Math.min(dev, cob) : 0; // sólo se puede reservar lo efectivamente cobrado
    if(!casoEsHistorial(c)){
      a.pendCobro[m]+=Math.max(Number(f.montoTotal||0)-cob,0);
      if(devEnStandBy) a.reservaDev[m]+=reservaCaso;
      if(["pendiente_dev","parcial_dev"].includes(f.estadoDevolucion)) a.pendDev[m]+=dev;
      // pendiente de liquidar: cobrado − devoluciones (hechas o en stand by) − gastos del caso − ya liquidado
      a.pendLiq[m]+=netLiquidableCaso(c);
    }
    if(f.estadoDevolucion==="realizada_dev") a.devRealizada[m]+=dev;
    (c.gastos||[]).forEach(g=>{ const gm=cur(g.moneda); const imp=Number(g.importe||0); if(!imp||g.estado==='no corresponde')return; if(g.estado==='abonado') a.gastosPag[gm]+=imp; else a.pendGasto[gm]+=imp; });
  });
  // gastos generales del estudio (no atados a un caso)
  (DB.gastosGen||[]).forEach(g=>{ const gm=cur(g.moneda); const imp=Number(g.importe||0); if(!imp)return; if(g.estado==='pendiente') a.pendGasto[gm]+=imp; else a.gastosPag[gm]+=imp; });
  (DB.cambios||[]).forEach(x=>{ const mo=cur(x.moneda_origen), md=cur(x.moneda_destino); a.fxOut[mo]+=Number(x.monto_origen||0); a.fxIn[md]+=Number(x.monto_destino||0); });
  // caja bruta (toda la plata que entró menos lo que salió)
  a.cajaBruta={
    USD: a.cobrado.USD - a.gastosPag.USD - a.devRealizada.USD - a.fxOut.USD + a.fxIn.USD - a.liquidado.USD,
    ARS: a.cobrado.ARS - a.gastosPag.ARS - a.devRealizada.ARS - a.fxOut.ARS + a.fxIn.ARS - a.liquidado.ARS
  };
  // caja DISPONIBLE real del estudio = bruta menos lo reservado por posibles devoluciones (stand by)
  a.caja={ USD: a.cajaBruta.USD - a.reservaDev.USD, ARS: a.cajaBruta.ARS - a.reservaDev.ARS };
  return a;
}

async function saveCambio(id){
  const mo=val("cx_mo"),md=val("cx_md"); const io=Number(val("cx_io")||0), idd=Number(val("cx_id")||0);
  if(!io||!idd){ toast("Cargá los dos montos","err"); return; }
  if(mo===md){ toast("Las monedas de origen y destino deben ser distintas","err"); return; }
  const tc=val("cx_tc")?Number(val("cx_tc")):(io?+(idd/io).toFixed(2):0);
  const isNew=!id;
  const base = id?(DB.cambios||[]).find(c=>c.id===id):{id:newTareaId(), usuario:SESSION.id, created_at:new Date().toISOString()};
  Object.assign(base,{fecha:val("cx_fecha")||null,moneda_origen:mo,monto_origen:io,moneda_destino:md,monto_destino:idd,tipo_cambio:tc,medio:val("cx_medio"),motivo:val("cx_motivo"),caso_id:val("cx_caso")||null,obs:val("cx_obs")});
  const r=await cambioUpsert(base,isNew);
  if(r){ DB.cambios=DB.cambios||[]; const i=DB.cambios.findIndex(c=>c.id===base.id); if(i>=0)DB.cambios[i]=CLOUD?r:base; else DB.cambios.unshift(CLOUD?r:base); }
  closeModal(); toast("Cambio de divisa registrado"); if(ROUTE==="finanzas")renderFinanzasGlobal();
}
function cambioDeleteConfirm(id){ if(!confirm("¿Eliminar este cambio de divisa?"))return; cambioDelete(id).then(ok=>{ if(ok){ closeModal(); toast("Cambio eliminado"); if(ROUTE==="finanzas")renderFinanzasGlobal(); } }); }

function liqHistorialRows(filtroSocio){
  const rows=[];

    (l.reparto||[]).forEach(r=>{ if(filtroSocio && r.socio_id!==filtroSocio) return; rows.push({fecha:l.fecha, cliente:caso?clienteFull(caso):'—', socio:r.nombre||userName(r.socio_id), monto:Number(r.monto||0), moneda:l.moneda, estado:l.estado, liqId:l.id}); }); });
  rows.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));

}
function openLiqById(id){ const l=(DB.liquidaciones||[]).find(x=>x.id===id); if(l) liqModal(l.caso_id, id); }
function resumenPorSocio(){
  const acc={};
  (DB.liquidaciones||[]).forEach(l=>{ const m=l.moneda==='ARS'?'ARS':'USD'; (l.reparto||[]).forEach(r=>{ const k=r.socio_id||r.nombre; acc[k]=acc[k]||{nombre:r.nombre||userName(r.socio_id),USD:0,ARS:0}; acc[k][m]+=Number(r.monto||0); }); });
  return acc;
}

/* ---------- Usuarios en la nube (vía función admin-users, solo socios) ---------- */
let ADMIN_USERS=[];
async function adminUsersCall(payload){
  try{ const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(FUNCTIONS_URL+"/admin-users",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify(payload)});
    return await r.json();
  }catch(e){ return {error:String(e)}; }
}
async function loadAdminUsers(){
  const el=document.getElementById("usersTable"); if(el)el.innerHTML='<div class="empty">Cargando usuarios…</div>';
  const j=await adminUsersCall({action:"list"});
  if(!j.ok){ if(el)el.innerHTML=`<div class="empty">No se pudo cargar la lista${j.error?(' ('+esc(j.error)+')'):''}.${/solo-socios/.test(j.error||'')?' Solo los socios pueden gestionar usuarios.':''}</div>`; return; }
  ADMIN_USERS=j.users||[]; renderUsersTable();
}
function renderUsersTable(){
  const el=document.getElementById("usersTable"); if(!el)return;
  const rows=ADMIN_USERS.map(u=>`<tr>
    <td><b>${esc(u.nombre||'—')}</b><br><small style="color:var(--muted)">${esc(u.email||'')}</small></td>

  if(pass.length<6){ toast("La contraseña debe tener al menos 6 caracteres","err"); return; }
  toast("Creando usuario…");
  const j=await adminUsersCall({action:"create",nombre:val("nu_nom"),email,password:pass,rol:val("nu_rol")});
  if(!j.ok){ toast("Error: "+(j.error||"no se pudo crear"),"err"); return; }
  closeModal(); toast("Usuario creado ✓"); loadAdminUsers();

let TFILTER={scope:"mias",fu:"",festado:"",fprio:""};
function renderTareas(){
  setCrumb("Tareas");
  topActions(`<button class="btn btn-primary" onclick="tareaModal()">＋ Nueva tarea</button>`);
  let list=(DB.tareas||[]).slice();
  if(TFILTER.scope==="mias") list=list.filter(t=>t.creado_por===SESSION.id || (t.asignados||[]).includes(SESSION.id));
  if(TFILTER.fu) list=list.filter(t=>(t.asignados||[]).includes(TFILTER.fu));
  if(TFILTER.festado) list=list.filter(t=>tareaEfEstado(t)===TFILTER.festado);
  if(TFILTER.fprio) list=list.filter(t=>t.prioridad===TFILTER.fprio);
  const today=new Date().toISOString().slice(0,10);
  const activas=list.filter(t=>!["realizada","cancelada"].includes(t.estado));
  const venc=activas.filter(t=>t.vence&&t.vence<today);
  const hoy=activas.filter(t=>t.vence===today);
  const prox=activas.filter(t=>t.vence&&t.vence>today).sort((a,b)=>(a.vence||'').localeCompare(b.vence||''));
  const sinf=activas.filter(t=>!t.vence);
  const compl=list.filter(t=>["realizada","cancelada"].includes(t.estado)).slice(0,30);
  const sec=(titulo,arr,color)=> arr.length?`<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${titulo}</h3><span class="badge ${color}">${arr.length}</span></div><div class="card-b" style="padding:6px 8px">${arr.map(tareaRow).join("")}</div></div>`:'';
  const userOpts=DB.usuarios.map(u=>`<option value="${u.id}" ${TFILTER.fu===u.id?'selected':''}>${esc(u.nombre)}</option>`).join("");
  const estOpts=ESTADOS_TAREA.map(e=>`<option ${TFILTER.festado===e?'selected':''}>${e}</option>`).join("");
  const prioOpts=PRIORIDADES.map(p=>`<option ${TFILTER.fprio===p?'selected':''}>${p}</option>`).join("");
  document.getElementById("view").innerHTML=`
    <div class="pagehead"><div><h2>${TFILTER.scope==='equipo'?'Tareas del equipo':'Mis tareas'}</h2><div class="sub">${activas.length} pendientes${venc.length?` · ${venc.length} vencidas`:''}</div></div></div>
    <div class="filters">
      ${isSocio()?`<button class="btn btn-ghost btn-sm" style="${TFILTER.scope==='mias'?'background:var(--primary);color:#fff':''}" onclick="TFILTER.scope='mias';renderTareas()">Mis tareas</button><button class="btn btn-ghost btn-sm" style="${TFILTER.scope==='equipo'?'background:var(--primary);color:#fff':''}" onclick="TFILTER.scope='equipo';renderTareas()">Equipo</button>`:''}
      ${TFILTER.scope==='equipo'?`<select onchange="TFILTER.fu=this.value;renderTareas()"><option value="">Todos los usuarios</option>${userOpts}</select>`:''}
      <select onchange="TFILTER.festado=this.value;renderTareas()"><option value="">Todos los estados</option>${estOpts}</select>
      <select onchange="TFILTER.fprio=this.value;renderTareas()"><option value="">Toda prioridad</option>${prioOpts}</select>
    </div>
    ${sec('🔴 Vencidas',venc,'b-red')}
    ${sec('📅 Hoy',hoy,'b-gold')}
    ${sec('⏭️ Próximas',prox,'b-blue')}
    ${sec('📌 Sin fecha',sinf,'b-grey')}
    ${sec('✓ Completadas / canceladas',compl,'b-green')}
    ${(venc.length+hoy.length+prox.length+sinf.length+compl.length)===0?'<div class="card"><div class="empty"><div class="ico">✅</div>No hay tareas todavía. Creá una con "＋ Nueva tarea".</div></div>':''}`;
}
function tareaRow(t){
  const est=tareaEfEstado(t);
  const done=["realizada","cancelada"].includes(t.estado);
  const asig=(t.asignados||[]).map(id=>userName(id)).join(", ")||"—";
  const caso=t.caso_id?DB.casos.find(c=>c.id===t.caso_id):null;
  const estSel=ESTADOS_TAREA.filter(e=>e!=="vencida").map(e=>`<option value="${e}" ${t.estado===e?'selected':''}>${e}</option>`).join("");
  return `<div class="tk-row" data-id="${t.id}">
    <div class="tk-main" onclick="tareaModal('${t.id}')">
      <div class="tk-title" style="${done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.titulo)} <span class="badge ${PRIO_COLOR[t.prioridad]||'b-grey'}">${t.prioridad}</span>${t.privacidad==='privada'?' <span class="badge b-grey">🔒</span>':''}</div>
      <div class="tk-meta">👤 ${esc(asig)}${t.vence?` · 📅 ${fdate(t.vence)}${t.hora?' '+esc(t.hora):''}`:''}${caso?` · 📁 ${esc(clienteFull(caso))}`:''}${t.observaciones?' · 📝':''}</div>
    </div>
    <select class="tk-estado est-${est.replace(/ /g,'_')}" onclick="event.stopPropagation()" onchange="cambiarEstadoTarea('${t.id}', this.value)" title="Cambiar estado">${estSel}</select>
    <button class="tk-kebab" onclick="openTareaMenu('${t.id}', event)" title="Acciones rápidas">⋯</button>
  </div>`;
}
async function cambiarEstadoTarea(id, estado){
  const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;
  if(t.estado===estado) return;
  t.estado=estado;
  await tareaUpsert(t);
  syncTareaCalendar(t);
  if(estado==='realizada' && t.creado_por && t.creado_por!==SESSION.id) notifCreate(t.creado_por,"tarea_completada","Tarea completada: "+t.titulo,"Por "+userName(SESSION.id),t.id,t.caso_id);
  if(estado==='cancelada' && t.creado_por && t.creado_por!==SESSION.id) notifCreate(t.creado_por,"tarea_cancelada","Tarea cancelada: "+t.titulo,"Por "+userName(SESSION.id),t.id,t.caso_id);
  toast("Estado: "+estado);
  if(ROUTE==='tareas')renderTareas(); else if(ROUTE==='caso')renderCaso();
}
async function toggleTareaHecha(id){ const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return; cambiarEstadoTarea(id, t.estado==='realizada'?'pendiente':'realizada'); }
/* --- menú de acciones rápidas --- */
function openTareaMenu(id, ev){
  ev.stopPropagation(); closeTareaMenu();
  const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;
  const canDel=isSocio()||t.creado_por===SESSION.id;
  const m=document.createElement("div"); m.className="tk-menu"; m.id="tkMenu";
  m.innerHTML=`
    <button onclick="tareaModal('${id}');closeTareaMenu()">✎ Editar tarea</button>
    <button onclick="quickFechaHora('${id}')">📅 Cambiar fecha / hora</button>
    <button onclick="quickPrioridad('${id}')">⚑ Cambiar prioridad</button>
    <button onclick="quickReasignar('${id}')">👤 Reasignar</button>
    <button onclick="quickObs('${id}')">📝 Agregar observación</button>
    <div class="tk-menu-sep"></div>
    <button onclick="cambiarEstadoTarea('${id}','realizada');closeTareaMenu()">✅ Marcar realizada</button>
    <button onclick="cambiarEstadoTarea('${id}','cancelada');closeTareaMenu()">🚫 Cancelar tarea</button>
    ${canDel?`<div class="tk-menu-sep"></div><button class="danger" onclick="closeTareaMenu();deleteTareaConfirm('${id}')">🗑 Eliminar</button>`:''}`;
  document.body.appendChild(m);
  const r=ev.currentTarget.getBoundingClientRect();
  m.style.top=Math.min(r.bottom+4, window.innerHeight-m.offsetHeight-8)+"px";
  m.style.left=Math.max(8,(r.right-228))+"px";
  setTimeout(()=>document.addEventListener("click",closeTareaMenuOutside),0);
}
function closeTareaMenu(){ const m=document.getElementById("tkMenu"); if(m)m.remove(); document.removeEventListener("click",closeTareaMenuOutside); }
function closeTareaMenuOutside(e){ const m=document.getElementById("tkMenu"); if(m && !m.contains(e.target)) closeTareaMenu(); }
function quickFechaHora(id){ closeTareaMenu(); const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;
  modal({title:"Fecha y hora", size:"sm", body:`<div class="frow fr3">${inp("qf_v","Vence",t.vence||"","date")}${inp("qf_h","Hora",t.hora||"","time")}${sel("qf_d","Duración",["","30 min","60 min","90 min","120 min"],t.duracion||"")}</div>`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveQuickTarea('${id}',{vence:val('qf_v')||null,hora:val('qf_h')||null,duracion:val('qf_d')})">Guardar</button>`}); }
function quickPrioridad(id){ closeTareaMenu(); const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;
  modal({title:"Prioridad", size:"sm", body:`<div class="field"><label>Prioridad</label><select id="qp_p">${PRIORIDADES.map(p=>`<option ${t.prioridad===p?'selected':''}>${p}</option>`).join("")}</select></div>`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveQuickTarea('${id}',{prioridad:val('qp_p')})">Guardar</button>`}); }
function quickReasignar(id){ closeTareaMenu(); const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return; const asg=t.asignados||[];
  const checks=DB.usuarios.map(u=>`<label class="check" style="display:block;padding:4px 0"><input type="checkbox" class="qr_a" value="${u.id}" ${asg.includes(u.id)?'checked':''}> ${esc(u.nombre)}</label>`).join("");
  modal({title:"Reasignar tarea", size:"sm", body:`<div style="border:1px solid var(--line2);border-radius:8px;padding:8px 10px">${checks||'<span style="color:var(--muted)">No hay usuarios</span>'}</div>`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveQuickReasignar('${id}')">Guardar</button>`}); }
function quickObs(id){ closeTareaMenu(); const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;
  modal({title:"Agregar observación", size:"sm", body:`<div class="field"><textarea id="qo_t" rows="3" placeholder="Escribí una observación…"></textarea></div>${t.observaciones?`<div class="sub" style="white-space:pre-wrap">Anteriores:\n${esc(t.observaciones)}</div>`:''}`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveQuickObs('${id}')">Guardar</button>`}); }
async function saveQuickTarea(id, patch){
  const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;
  Object.assign(t, patch);
  await tareaUpsert(t); syncTareaCalendar(t);
  closeModal(); toast("Tarea actualizada");
  if(ROUTE==='tareas')renderTareas(); else if(ROUTE==='caso')renderCaso();
}
async function saveQuickReasignar(id){
  const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;
  const prev=(t.asignados||[]).slice();
  t.asignados=Array.from(document.querySelectorAll(".qr_a:checked")).map(x=>x.value);
  await tareaUpsert(t); syncTareaCalendar(t);
  t.asignados.filter(u=>!prev.includes(u)).forEach(u=>notifCreate(u,"tarea_asignada","Te asignaron: "+t.titulo,(t.vence?("Vence "+fdate(t.vence)):"Sin fecha"),t.id,t.caso_id));
  closeModal(); toast("Tarea reasignada");
  if(ROUTE==='tareas')renderTareas(); else if(ROUTE==='caso')renderCaso();
}
async function saveQuickObs(id){
  const t=(DB.tareas||[]).find(x=>x.id===id); if(!t)return;
  const nv=val("qo_t").trim(); if(!nv){ closeModal(); return; }
  t.observaciones=(t.observaciones?t.observaciones+"\n":"")+`[${now()} · ${userName(SESSION.id)}] ${nv}`;
  await tareaUpsert(t);
  closeModal(); toast("Observación agregada");
  if(ROUTE==='tareas')renderTareas(); else if(ROUTE==='caso')renderCaso();
}
/* ---------- TAREAS ↔ Google Calendar ---------- */
async function syncTareaCalendar(t, opts){
  opts=opts||{};
  if(!CLOUD || !t) return;
  const asign=(t.asignados||[]).filter(Boolean);
  const prev=t.eventos||{};
  const post=async(payload)=>{ const {data:{session}}=await sb.auth.getSession(); return fetch(FUNCTIONS_URL+"/calendar-insert",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(r=>r.json()); };
  // BORRADO total (tarea eliminada/cancelada, sin fecha o sin asignados)
  if(opts.del || t.estado==='cancelada' || !t.vence || asign.length===0){
    if(Object.keys(prev).length){
      try{ await post({delete:true, invitados:Object.keys(prev), eventos:prev}); }catch(e){ console.error("cal del",e); }
      t.eventos={}; if(!opts.del) await tareaUpsert(t);
    }
    return;
  }
  // borrar eventos de usuarios que ya no están asignados
  const removed=Object.keys(prev).filter(u=>!asign.includes(u));
  if(removed.length){ try{ await post({delete:true, invitados:removed, eventos:prev}); }catch(e){} removed.forEach(u=>delete t.eventos[u]); }
  // armar evento
  const nombres=asign.map(id=>userName(id).split(" ")[0]).filter(Boolean).join(", ");
  const done=t.estado==='realizada';
  const title=(done?"✓ ":"")+"Tarea GMJ - "+t.titulo+(nombres?" - "+nombres:"");
  let startISO,endISO,allDay=false;
  if(t.hora){
    const dur=parseInt(t.duracion)||60;
    const s=new Date(t.vence+"T"+t.hora+":00"), e=new Date(s.getTime()+dur*60000);
    const iso=d=>{const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())+":00";};
    startISO=iso(s); endISO=iso(e);
  } else {
    allDay=true; startISO=t.vence;
    const d=new Date(t.vence+"T00:00:00"); d.setDate(d.getDate()+1);
    endISO=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  const caso=t.caso_id?DB.casos.find(c=>c.id===t.caso_id):null;
  const det=[t.descripcion||"", caso?("Caso: "+clienteFull(caso)+" ("+caso.id+")"):"", t.observaciones?("Obs: "+t.observaciones):"", "Prioridad: "+(t.prioridad||"media")].filter(Boolean).join("\n");
  try{
    const j=await post({invitados:asign, title, startISO, endISO, allDay, details:det, eventos:t.eventos||{}});
    if(j&&j.eventos){ t.eventos=Object.assign({}, t.eventos, j.eventos); await tareaUpsert(t);
      const oks=(j.results||[]).filter(x=>x.ok).length, fails=(j.results||[]).filter(x=>!x.ok).length;
      if(oks) toast("📅 Agendado en "+oks+" calendario/s"+(fails?" · "+fails+" sin Google":"")); else if(fails) toast("Ningún asignado conectó su Google","err");
    } else if(j&&j.error){ console.error("cal",j.error); }
  }catch(e){ console.error("syncTareaCalendar",e); }
}
function newTareaId(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(uid("t")+uid("")+uid("")); }
function tareaModal(id){
  const editing = !!id;
  const t = editing ? (DB.tareas||[]).find(x=>x.id===id) : {asignados:[SESSION.id], prioridad:"media", estado:"pendiente", privacidad:(ROUTE==='caso'?'caso':'equipo'), caso_id:(ROUTE==='caso'&&CURRENT?CURRENT.id:"")};
  if(!t){ toast("Tarea no encontrada","err"); return; }
  const asg=t.asignados||[];
  const asgChecks=DB.usuarios.map(u=>`<label class="check" style="padding:3px 0;display:inline-flex;margin-right:16px"><input type="checkbox" class="tk_asg" value="${u.id}" ${asg.includes(u.id)?'checked':''}> <span style="font-weight:500">${esc(u.nombre)}</span></label>`).join("");
  const casoOpts=`<option value="">— Sin caso —</option>`+casosActivos().map(c=>`<option value="${c.id}" ${t.caso_id===c.id?'selected':''}>${esc(clienteFull(c))} · ${c.id}</option>`).join("");
  const ejem=TAREA_EJEMPLOS.map(e=>`<option value="${esc(e)}"></option>`).join("");
  const prioOpts=PRIORIDADES.map(p=>`<option ${t.prioridad===p?'selected':''}>${p}</option>`).join("");
  const estOpts=ESTADOS_TAREA.map(e=>`<option ${(t.estado||'pendiente')===e?'selected':''}>${e}</option>`).join("");
  const privOpts=PRIVACIDADES.map(([v,l])=>`<option value="${v}" ${(t.privacidad||'equipo')===v?'selected':''}>${esc(l)}</option>`).join("");
  modal({title:editing?"Editar tarea":"Nueva tarea", size:"", body:`
    <div class="field"><label>Título <span class="req">*</span></label><input id="tk_tit" list="tk_ej" value="${esc(t.titulo||'')}" placeholder="Ej: Enviar contrato a cliente"><datalist id="tk_ej">${ejem}</datalist></div>
    <div class="field"><label>Descripción</label><textarea id="tk_desc" rows="2">${esc(t.descripcion||'')}</textarea></div>
    <div class="field"><label>Asignar a</label><div style="border:1px solid var(--line2);border-radius:8px;padding:8px 10px">${asgChecks||'<span style="color:var(--muted)">No hay usuarios</span>'}</div></div>
    <div class="frow fr2">
      <div class="field"><label>Caso vinculado</label><select id="tk_caso">${casoOpts}</select></div>
      <div class="field"><label>Privacidad</label><select id="tk_priv">${privOpts}</select></div>
    </div>
    <div class="frow fr3">${inp("tk_vence","Vence",t.vence||"","date")}${inp("tk_hora","Hora",t.hora||"","time")}${sel("tk_dur","Duración",["","30 min","60 min","90 min","120 min"],t.duracion||"")}</div>
    <div class="frow fr2">
      <div class="field"><label>Prioridad</label><select id="tk_prio">${prioOpts}</select></div>
      <div class="field"><label>Estado</label><select id="tk_est">${estOpts}</select></div>
    </div>
    ${inp("tk_rec","Recordatorio (texto)",t.recordatorio||"")}
    <div class="field"><label>Observaciones</label><textarea id="tk_obs" rows="2">${esc(t.observaciones||'')}</textarea></div>`,
    footer:`${editing?`<button class="btn btn-danger" onclick="deleteTareaConfirm('${id}')">Eliminar</button>`:''}<div style="flex:1"></div><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveTareaForm('${id||''}')">Guardar tarea</button>`});
}
async function saveTareaForm(id){
  const tit=val("tk_tit").trim(); if(!tit){ toast("El título es obligatorio","err"); return; }
  const asignados=Array.from(document.querySelectorAll(".tk_asg:checked")).map(x=>x.value);
  const casoId=val("tk_caso")||null;
  const caso=casoId?DB.casos.find(c=>c.id===casoId):null;
  let t = id ? (DB.tareas||[]).find(x=>x.id===id) : null;
  const prevAsign = (t && Array.isArray(t.asignados)) ? t.asignados.slice() : [];
  const prevEstado = t ? t.estado : null;
  const isNew=!t;
  const base = t || { id:newTareaId(), creado_por:SESSION.id, created_at:new Date().toISOString(), eventos:{} };
  Object.assign(base, { titulo:tit, descripcion:val("tk_desc"), asignados, caso_id:casoId, cliente_nombre:caso?clienteFull(caso):null, vence:val("tk_vence")||null, hora:val("tk_hora")||null, duracion:val("tk_dur")||null, prioridad:val("tk_prio"), estado:val("tk_est"), observaciones:val("tk_obs"), recordatorio:val("tk_rec"), privacidad:val("tk_priv") });
  await tareaUpsert(base, isNew);
  DB.tareas=DB.tareas||[]; const i=DB.tareas.findIndex(x=>x.id===base.id); if(i>=0)DB.tareas[i]=base; else DB.tareas.push(base);
  closeModal(); toast("Tarea guardada");
  if(ROUTE==='tareas')renderTareas(); else if(ROUTE==='caso')renderCaso();
  syncTareaCalendar(base);
  // notificar a los nuevos asignados
  const detalle=(base.vence?("Vence "+fdate(base.vence)+(base.hora?" "+base.hora:"")):"Sin fecha")+(caso?(" · "+clienteFull(caso)):"");
  asignados.filter(u=>!prevAsign.includes(u)).forEach(u=>notifCreate(u,"tarea_asignada","Te asignaron: "+tit,detalle,base.id,casoId));
  // notificar al creador si un asignado la marcó completada/cancelada desde el form
  if(prevEstado && prevEstado!==base.estado && ["realizada","cancelada"].includes(base.estado) && base.creado_por!==SESSION.id)
    notifCreate(base.creado_por, base.estado==="realizada"?"tarea_completada":"tarea_cancelada", (base.estado==="realizada"?"Tarea completada: ":"Tarea cancelada: ")+tit, "Por "+userName(SESSION.id), base.id, casoId);
}
async function deleteTareaConfirm(id){ if(!confirm("¿Eliminar esta tarea? Esta acción no se puede deshacer."))return; const t=(DB.tareas||[]).find(x=>x.id===id); if(t)await syncTareaCalendar(t,{del:true}); const ok=await tareaDelete(id); if(!ok)return; closeModal(); toast("Tarea eliminada"); if(ROUTE==='tareas')renderTareas(); else if(ROUTE==='caso')renderCaso(); }

/* ============================================================
   UI HELPERS (inputs, modal)
   ============================================================ */
function val(id){ const e=document.getElementById(id); return e?e.value:""; }
function chkVal(id){ const e=document.getElementById(id); return e?e.checked:false; }
function inp(id,label,v,type){ return `<div class="field"><label>${esc(label)}</label><input id="${id}" type="${type||'text'}" value="${esc(v)}"></div>`; }
function sel(id,label,opts,v){ return `<div class="field"><label>${esc(label)}</label><select id="${id}">${opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join("")}</select></div>`; }
function chk(id,label,v){ return `<div class="check"><input type="checkbox" id="${id}" ${v?'checked':''}><label for="${id}" style="margin:0;font-weight:500">${esc(label)}</label></div>`; }
function formCard(title, fields, onsave){
  return `<div class="card"><div class="card-h"><h3>${esc(title)}</h3></div><div class="card-b">
    <div class="frow fr2">${fields.join("")}</div>
    <div style="margin-top:16px"><button class="btn btn-primary" onclick="${onsave}">Guardar cambios</button></div></div></div>`;
}
function modal({title,body,footer,size}){
  document.getElementById("modalRoot").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal ${size||''}"><div class="modal-h"><h3>${esc(title)}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b">${body}</div>${footer?`<div class="modal-f">${footer}</div>`:''}</div></div>`;
}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }

/* ============================================================
   BOOT
   ============================================================ */
function handleGoogleHash(){
  if(location.hash.indexOf("google=ok")>=0){ toast("Google Calendar conectado ✓"); history.replaceState(null,"",location.pathname+location.search); }
  else if(location.hash.indexOf("google=error")>=0){ toast("No se pudo conectar Google","err"); history.replaceState(null,"",location.pathname+location.search); }
}
(async function boot(){
  // Formulario público del cliente (con o sin nube)
  if(location.hash.startsWith("#form=")){
    const tk=location.hash.slice(6);
    if(CLOUD){ renderClientFormCloud(tk); }
    else { loadLocal(); renderClientForm(tk); }
    return;
  }
  if(CLOUD){
    const {data:{session}}=await sb.auth.getSession();
    if(session){ await afterAuth(); }
    else { DB={config:{},abogados:[],usuarios:[],casos:[]}; renderLogin(); }
  } else {
    loadLocal(); renderLogin();
  }
})();
</script>
