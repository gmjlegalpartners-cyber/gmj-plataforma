function ensureHtml2Pdf(){
  return new Promise((res,rej)=>{
    if(window.html2pdf) return res();
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
    s.onload=()=>res(); s.onerror=()=>rej(new Error("No se pudo cargar el generador de PDF"));
    document.head.appendChild(s);
  });
}
// jsPDF por separado (el bundle de html2pdf no expone el global). Lo usa el "Paquete para IA".
function ensureJsPDF(){
  return new Promise((res,rej)=>{
    if(window.jspdf && window.jspdf.jsPDF) return res();
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>res(); s.onerror=()=>rej(new Error("No se pudo cargar jsPDF"));
    document.head.appendChild(s);
  });
}
function _pdfWrap(d){
  const small=d.tipo==="carta_poder";
  const scoped='<style>.pdfbody{font-family:"Times New Roman",Georgia,serif;font-size:'+(small?'12px':'13px')+';line-height:1.35;color:#000}.pdfbody p{text-align:justify;margin:0 0 7px}.pdfbody h1,.pdfbody h2{text-align:center;font-size:16px;margin:0 0 6px}.pdfbody img{max-width:100%}.pdfbody table{page-break-inside:avoid}</style>';
  // IMPORTANTE: html2canvas sólo captura contenido que esté DENTRO del viewport (0,0).
  // Lo ubicamos en (0,0) del documento dentro de un contenedor recortado a 0x0
  // (overflow:hidden) para que sea invisible. Usamos position:ABSOLUTE (no fixed):
  // en Safari los elementos position:fixed hacen que html2canvas recorte el margen
  // izquierdo. Las funciones de render llevan el scroll a (0,0) antes de capturar.
  const holder=document.createElement("div");
  holder.className="_pdfholder";
  holder.style.cssText="position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;z-index:-1;opacity:1;pointer-events:none";
  const wrap=document.createElement("div"); wrap.className="pdfbody";
  wrap.style.cssText="position:absolute;left:0;top:0;width:794px;background:#fff;padding:0";
  wrap.innerHTML=scoped+d.html;
  holder.appendChild(wrap);
  document.body.appendChild(holder);
  wrap._holder=holder;
  return wrap;
}
function _pdfCleanup(wrap){ try{ ((wrap&&wrap._holder)||wrap).remove(); }catch(e){} }
function _pdfWaitImages(el){
  const imgs=[].slice.call(el.querySelectorAll("img"));
  if(!imgs.length) return Promise.resolve();
  return Promise.all(imgs.map(im=>(im.complete&&im.naturalHeight!==0)?Promise.resolve():new Promise(res=>{im.onload=im.onerror=()=>res(); setTimeout(res,4000);})));
}
function _pdfOpt(filename, el){
  // Ancho FIJO del elemento (794px) — no scrollWidth, que en Safari puede reportar
  // de más y descentrar/recortar la captura. Alto = scrollHeight (contenido real).
  const sw=el?(el.offsetWidth||794):794, sh=el?el.scrollHeight:0;
  return { margin:[12,14,14,14], filename:(filename||"documento")+".pdf",
    image:{type:"jpeg",quality:0.98},
    html2canvas:{scale:2,backgroundColor:"#ffffff",useCORS:true,width:sw,height:sh,windowWidth:sw,windowHeight:sh,scrollX:0,scrollY:0,x:0,y:0},
    jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}, pagebreak:{mode:["css","legacy"]} };
}
// Renderiza el documento a PDF DENTRO DE UN IFRAME AISLADO.
// Es la forma más robusta cross-browser: el documento vive en su propio contexto,
// sin el scroll ni el posicionamiento de la página, que en Safari recortaban el margen.
async function _renderDocPdf(d, mode, filename){
  await ensureHtml2Pdf();
  const small=d.tipo==="carta_poder";
  const styles='<style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff}'
    +'.pdfbody{font-family:"Times New Roman",Georgia,serif;font-size:'+(small?'12px':'13px')+';line-height:1.35;color:#000;width:794px;background:#fff;padding:0}'
    +'.pdfbody p{text-align:justify;margin:0 0 7px}.pdfbody h1,.pdfbody h2{text-align:center;font-size:16px;margin:0 0 6px}.pdfbody img{max-width:100%}.pdfbody table{page-break-inside:avoid;width:100%}.pdfbody .sig{margin-top:22px}</style>';
  const iframe=document.createElement("iframe");
  iframe.setAttribute("aria-hidden","true");
  iframe.style.cssText="position:fixed;top:0;left:0;width:820px;height:1200px;border:0;background:#fff;opacity:0;pointer-events:none;z-index:-99999";
  document.body.appendChild(iframe);
  try{
    const idoc=iframe.contentDocument||(iframe.contentWindow&&iframe.contentWindow.document);
    idoc.open();
    idoc.write('<!doctype html><html><head><meta charset="utf-8">'+styles+'</head><body><div class="pdfbody">'+d.html+'</div></body></html>');
    idoc.close();
    const wrap=idoc.querySelector(".pdfbody");
    await _pdfWaitImages(wrap);
    await new Promise(r=>setTimeout(r,60));
    const sh=wrap.scrollHeight||1123;
    const opt={ margin:[12,14,14,14], filename:(filename||"documento")+".pdf",
      image:{type:"jpeg",quality:0.98},
      html2canvas:{scale:2,backgroundColor:"#ffffff",useCORS:true,width:794,height:sh,windowWidth:794,windowHeight:sh},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}, pagebreak:{mode:["css","legacy"]} };
    if(mode==="save"){ await window.html2pdf().set(opt).from(wrap).save(); return; }
    const pdf=await window.html2pdf().set(opt).from(wrap).toPdf().get("pdf");
    return String(pdf.output("datauristring")).split(",")[1]||"";
  } finally { try{ iframe.remove(); }catch(e){} }
}
function _preloadImgs(srcs){
  return Promise.all(srcs.map(src=>new Promise(res=>{ if(!src){res({src,w:0,h:0});return;} const im=new Image(); im.onload=()=>res({src,w:im.naturalWidth,h:im.naturalHeight}); im.onerror=()=>res({src,w:0,h:0}); im.src=src; })));
}
// Renderiza contrato / carta poder / mediación con jsPDF dibujando el texto (sin
// html2canvas). Es 100% confiable en todos los navegadores (Safari incluido) y no
// se recorta. Mantiene membrete, títulos, negritas y firmas.
// Construye el PDF (sync) a una escala dada. Devuelve el objeto jsPDF.
function _buildDocPdf(d, cont, cache, S){
  const JsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  const pdf=new JsPDF({unit:"mm",format:"a4",orientation:"portrait"});
  const small=d.tipo==="carta_poder";
  const PW=210,PH=297,ML=18,MR=18,MT=17,MB=16, maxW=PW-ML-MR;
  const mm=pt=>pt*0.3527;
  const bodyPt=(small?10.5:11)*S, h1Pt=15*S, h2Pt=12.5*S, footPt=8*S, labPt=9*S, namePt=9.5*S, sigH=16*S;
  let y=MT;
  const need=h=>{ if(y+h>PH-MB){ pdf.addPage(); y=MT; } };
  const cellLines=cell=>{ if(!cell) return []; const t=document.createElement("div"); t.innerHTML=(cell.innerHTML||"").replace(/<br\s*\/?>/gi,"\n"); return (t.textContent||"").split("\n").map(s=>s.trim()).filter(Boolean); };
  function heading(text,pt){ pdf.setFont("times","bold"); pdf.setFontSize(pt); const L=pdf.splitTextToSize(text,maxW); const lh=mm(pt)*1.25; L.forEach(ln=>{ need(lh); pdf.text(ln,PW/2,y,{align:"center",baseline:"top"}); y+=lh; }); }
  function para(node,pt,extraGap){ const runs=[]; (function walk(n,b){ for(const ch of n.childNodes){ if(ch.nodeType===3){ const t=ch.textContent.replace(/\s+/g," "); if(t) runs.push({t,b}); } else if(ch.nodeType===1){ if(ch.tagName==="BR") runs.push({br:1}); else if(ch.tagName!=="IMG") walk(ch, b|| /^(B|STRONG)$/.test(ch.tagName)); } } })(node,false);
    const words=[]; runs.forEach(r=>{ if(r.br){words.push({br:1});return;} r.t.split(" ").forEach(w=>{ if(w!=="") words.push({t:w,b:r.b}); }); });
    pdf.setFontSize(pt); const lh=mm(pt)*1.42; need(lh); let x=ML, started=false;
    for(const w of words){ if(w.br){ y+=lh; need(lh); x=ML; started=false; continue; } pdf.setFont("times", w.b?"bold":"normal"); const wd=pdf.getTextWidth(w.t); const spw=pdf.getTextWidth(" "); if(started && x+spw+wd>ML+maxW){ y+=lh; need(lh); x=ML; started=false; } if(started) x+=spw; pdf.text(w.t,x,y,{baseline:"top"}); x+=wd; started=true; }
    y+=lh+(extraGap===false?0:mm(pt)*0.55);
  }
  function placeImgsIn(imgs, colX, colW, h, atY){ const items=imgs.map(im=>{ const c=cache[im.getAttribute("src")]||{w:0,h:0}; const w=c.h?(c.w/c.h)*h:0; return {src:im.getAttribute("src"),w,h}; }).filter(it=>it.w>0); let tot=items.reduce((s,it)=>s+it.w+2,0); if(tot>colW){ const k=colW/tot; items.forEach(it=>{ it.w*=k; it.h*=k; }); tot=colW; } const drawY=(atY!=null?atY:y); let sx=colX+(colW-tot)/2; items.forEach(it=>{ try{ pdf.addImage(it.src,"PNG",sx,drawY,it.w,it.h); }catch(e){} sx+=it.w+2; }); }
  function renderSigTable(tbl){ const rows=tbl.rows; if(!rows||!rows.length){ return; } const top=rows[0].cells, lab=rows[1]?rows[1].cells:[];
    const estImgs=top[0]?[].slice.call(top[0].querySelectorAll("img")):[]; const cliImgs=(top[2]?[].slice.call(top[2].querySelectorAll("img")):[]);
    const half=(maxW-10)/2, lx=ML, rx=ML+half+10; const sigHEst=sigH*1.5; need(sigHEst+22*S); y+=9*S;
    const topY=y; placeImgsIn(estImgs,lx,half,sigHEst,topY); placeImgsIn(cliImgs,rx,half,sigH,topY); y=topY+sigHEst+1.5;
    pdf.setDrawColor(20,20,20); pdf.setLineWidth(0.3); pdf.line(lx,y,lx+half,y); pdf.line(rx,y,rx+half,y); y+=3.5;
    const el=cellLines(lab[0]), cl=cellLines(lab[2]); const n=Math.max(el.length,cl.length); pdf.setFontSize(labPt);
    for(let i=0;i<n;i++){ const lh=mm(labPt)*1.28; need(lh); pdf.setFont("times", i===0?"bold":"normal"); if(el[i]) pdf.text(el[i], lx+half/2, y, {align:"center",baseline:"top"}); if(cl[i]) pdf.text(cl[i], rx+half/2, y, {align:"center",baseline:"top"}); y+=lh; }
    y+=4;
  }
  function renderSigDiv(div){ const img=div.querySelector("img"); need(sigH+16*S); y+=8*S;
    if(img && cache[img.getAttribute("src")] && cache[img.getAttribute("src")].w){ placeImgsIn([img], ML, maxW*0.5, sigH); y+=sigH+1.5; } else { y+=4; }
    pdf.setDrawColor(20,20,20); pdf.setLineWidth(0.3); pdf.line(ML, y, ML+maxW*0.5, y); y+=3.5;
    const lines=cellLines(div).filter(s=>!/^_+$/.test(s)); pdf.setFontSize(namePt); pdf.setFont("times","normal");
    lines.forEach(ln=>{ const lh=mm(namePt)*1.28; need(lh); pdf.text(ln, ML, y, {baseline:"top"}); y+=lh; }); y+=4;
  }
  function renderLetterhead(){ pdf.setFont("times","bold"); pdf.setFontSize(h1Pt); need(12); pdf.text("GMJ LEGAL PARTNERS", PW/2, y, {align:"center",baseline:"top"}); y+=mm(h1Pt)*1.1;
    pdf.setFont("times","normal"); pdf.setFontSize(footPt); pdf.setTextColor(90); pdf.text("CABA - contacto@gmj-abogados.com.ar", PW/2, y, {align:"center",baseline:"top"}); pdf.setTextColor(0); y+=mm(footPt)*1.2+1;
    pdf.setDrawColor(22,41,77); pdf.setLineWidth(0.6); pdf.line(ML,y,PW-MR,y); y+=5;
  }
  function renderPresuHead(el){ const img=el.querySelector(":scope > img")||el.querySelector("img"); const src=img&&img.getAttribute("src"); const ci=src&&cache[src];
    if(src&&ci&&ci.w){ const w=26, h=w*(ci.h/ci.w||1.18); need(h+11); try{ pdf.addImage(src,"PNG",(PW-w)/2,y,w,h); }catch(e){} y+=h+2.5; }
    pdf.setFont("times","bold"); pdf.setFontSize(h1Pt); need(mm(h1Pt)*1.2); pdf.text("GMJ LEGAL PARTNERS", PW/2, y, {align:"center",baseline:"top"}); y+=mm(h1Pt)*1.12;
    pdf.setDrawColor(22,41,77); pdf.setLineWidth(0.6); pdf.line(ML,y,PW-MR,y); y+=5; }
  function paraAlign(el, pt){ const st=el.getAttribute("style")||""; const align=/text-align:\s*right/.test(st)?"right":/text-align:\s*center/.test(st)?"center":"left";
    const t=(el.textContent||"").replace(/\s+/g," ").trim(); if(!t) return; pdf.setFont("times","normal"); pdf.setFontSize(pt); const lh=mm(pt)*1.42;
    pdf.splitTextToSize(t,maxW).forEach(ln=>{ need(lh); const x=align==="right"?(PW-MR):align==="center"?(PW/2):ML; pdf.text(ln,x,y,{align:align,baseline:"top"}); y+=lh; }); y+=mm(pt)*0.4; }
  function renderList(el){ for(const li of [].slice.call(el.children)){ if(li.tagName!=="LI") continue; const b=document.createElement("span"); b.textContent="\u2022  "; li.insertBefore(b, li.firstChild); para(li, bodyPt, false); } y+=mm(bodyPt)*0.4; }
  function walkBlock(node){ for(const el of [].slice.call(node.children)){ const tag=el.tagName;
    if(tag==="H1") heading(el.textContent.trim(),h1Pt);
    else if(tag==="H2") heading(el.textContent.trim(),h2Pt);
    else if(tag==="P") para(el, bodyPt);
    else if(tag==="UL"||tag==="OL") renderList(el);
    else if(tag==="TABLE") renderSigTable(el);
    else if(tag==="DIV"){ const txt=el.textContent||"";
      if(el.classList.contains("sig")) renderSigDiv(el);
      else if(el.querySelector(":scope > img")) renderPresuHead(el);
      else if(/Constancia de aceptaci/i.test(txt)) para(el, footPt, false);
      else if(/GMJ LEGAL PARTNERS/.test(txt) && el.querySelector(":scope > div") && !el.querySelector("p")) renderLetterhead();
      else if(el.children.length===0 && txt.trim()) paraAlign(el, /gmj\.abogados|contacto@|www\.|@gmj/i.test(txt)?footPt:bodyPt);
      else walkBlock(el);
    }
  } }
  walkBlock(cont);
  return pdf;
}
let _LOGO_PNG_CACHE=null;
async function logoToPng(){
  if(_LOGO_PNG_CACHE) return _LOGO_PNG_CACHE;
  const uri="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(LOGO_FULL);
  const img=new Image(); img.width=120; img.height=142;
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=uri; });
  const sc=4; const cv=document.createElement("canvas"); cv.width=120*sc; cv.height=142*sc;
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  try{ _LOGO_PNG_CACHE=cv.toDataURL("image/png"); }catch(e){ _LOGO_PNG_CACHE=null; }
  return _LOGO_PNG_CACHE;
}
async function _renderDocPdfJs(d, mode, filename){
  await ensureJsPDF();
  const cont=document.createElement("div"); cont.style.cssText="position:absolute;left:-99999px;top:0;width:794px"; cont.innerHTML=d.html; document.body.appendChild(cont);
  try{
    if(d.tipo==="presupuesto"){ try{ const png=await logoToPng(); if(png) cont.querySelectorAll("img").forEach(im=>{ if((im.getAttribute("src")||"").indexOf("image/svg")>=0) im.setAttribute("src",png); }); }catch(e){ console.warn("logoToPng",e); } }
    const imgEls=[].slice.call(cont.querySelectorAll("img"));
    const cache={}; (await _preloadImgs(imgEls.map(im=>im.getAttribute("src")))).forEach(o=>{ cache[o.src]=o; });
    // Auto-ajuste: contrato máximo 2 hojas, carta poder máximo 1. Se prueba a escala 1
    // y se va achicando la tipografía hasta que entre en el máximo de hojas.
    const target = d.tipo==="carta_poder"?1 : d.tipo==="contrato"?2 : 99;
    let pdf=null;
    for(const S of [1,0.97,0.94,0.91,0.88,0.85,0.82,0.79,0.76,0.72,0.68]){ pdf=_buildDocPdf(d, cont, cache, S); if(pdf.getNumberOfPages()<=target) break; }
    if(mode==="save"){ pdf.save((filename||"documento")+".pdf"); return; }
    return String(pdf.output("datauristring")).split(",")[1]||"";
  } finally { try{ cont.remove(); }catch(e){} }
}
async function docToPdfFile(d, filename){
  if(d && (d.tipo==="contrato"||d.tipo==="carta_poder"||d.tipo==="presupuesto")){ try{ return await _renderDocPdfJs(d,"save",filename); }catch(e){ console.error("jsPDF render, uso fallback",e); } }
  return _renderDocPdf(d,"save",filename);
}
async function docToPdfBase64(d){
  if(d && (d.tipo==="contrato"||d.tipo==="carta_poder"||d.tipo==="presupuesto")){ try{ return await _renderDocPdfJs(d,"b64","doc"); }catch(e){ console.error("jsPDF render, uso fallback",e); } }
  return _renderDocPdf(d,"b64","doc");
}

/* ---------- VALIDATIONS ---------- */
function validateDoc(c,tipo){
  const missing=[]; const cl=c.cliente, cu=c.cuenta, f=c.finanzas;
  const need=(cond,label)=>{ if(!cond) missing.push(label); };
  if(tipo==="contrato"){
    need(cl.nombre&&cl.apellido,"Nombre y apellido"); need(cl.domicilio,"Domicilio"); need(cl.email,"Email");
    need(cl.tel,"Teléfono"); need(cu.handle||cu.url,"Cuenta objeto de la gestión");
    need(f.montoTotal!=="","Monto total"); need(f.adelanto!=="","Adelanto"); need(f.saldo!=="","Saldo");
    need(f.moneda,"Moneda"); // Devolución: opcional. Si queda vacía o en 0, el contrato se genera sin la cláusula de reintegro.
  } else if(tipo==="carta_poder"){
    need(cl.nombre&&cl.apellido,"Nombre y apellido"); need(cl.dni,"DNI / identificación"); need(cl.domicilio,"Domicilio");
    need(cl.email,"Email"); need(cu.handle||cu.url,"Cuenta afectada"); need(c.abogadoPatrocinante,"Abogado autorizado");
  } else if(tipo==="mediacion"){
    need(cl.nombre&&cl.apellido,"Nombre y apellido del requirente"); need(cl.dni,"DNI"); need(cl.cuit,"CUIT / CUIL");
    need(cl.domicilio,"Domicilio completo"); need(cl.tel,"Teléfono"); need(cl.email,"Email");
    need(cu.url,"URL de la cuenta afectada"); need(cu.emailVinc,"Email vinculado a la cuenta");
    need(c.relato.sintesis||c.relato.original,"Síntesis del hecho");
    need((c.adjuntos||[]).some(a=>a.tipo==="DNI frente"),"DNI frente adjunto");
    need((c.adjuntos||[]).some(a=>a.tipo==="DNI dorso"),"DNI dorso adjunto");
    need(c.abogadoPatrocinante,"Abogado patrocinante");
  } else if(tipo==="informe"){
    need(cl.nombre&&cl.apellido,"Nombre y apellido del titular");
    need(cl.dni,"DNI / documento");
    need(cu.url||cu.handle,"URL de la cuenta principal");
    need(cu.emailVinc,"Email vinculado a la cuenta principal");
    need(c.relato.sintesis||c.relato.original,"Síntesis del caso (o relato original)");
    need(c.relato.fechaSusp,"Fecha aproximada de suspensión");
    need(c.abogadoPatrocinante,"Abogado interviniente");
  }
  return {ok:missing.length===0, missing};
}

let EDIT_AUD=null;
function audsOf(c){ if(c.audiencias) return c.audiencias; if(c.audiencia&&c.audiencia.fecha) return [Object.assign({id:'a0'},c.audiencia)]; return []; }
// Próxima audiencia a realizarse: la más cercana pendiente (fecha >= hoy y no realizada). Si no hay futuras, la más reciente.
function proxAud(c){ const A=(audsOf(c)||[]).filter(a=>a.fecha); if(!A.length) return null; const hoy=todayISO(); const key=a=>(a.fecha||'')+(a.hora||''); const fut=A.filter(a=>!a.realizada && a.fecha>=hoy).sort((x,y)=>key(x).localeCompare(key(y))); return fut.length?fut[0]:A.slice().sort((x,y)=>key(y).localeCompare(key(x)))[0]; }
// Selector de fecha/hora amigable (flatpickr) para el editor de audiencias. En celular usa el nativo.
function initAudPickers(){
  if(typeof flatpickr==='undefined') return;
  try{
    var f=document.getElementById('au_fec');
    if(f && !f._flatpickr) flatpickr(f,{dateFormat:"Y-m-d",altInput:true,altFormat:"j M Y",locale:(flatpickr.l10ns&&flatpickr.l10ns.es)?"es":"default"});
    var h=document.getElementById('au_hora');
    if(h && !h._flatpickr) flatpickr(h,{enableTime:true,noCalendar:true,dateFormat:"H:i",time_24hr:true,minuteIncrement:15});
  }catch(e){ console.warn("flatpickr init",e); }
}
function ensureAudiencias(c){ if(!c.audiencias){ c.audiencias=(c.audiencia&&c.audiencia.fecha)?[Object.assign({id:uid('a')},c.audiencia)]:[]; } if(c.audiencia!==undefined) delete c.audiencia; }

function buildCalUrl(c,a){
  const fb=c.citarFacebook!==false;
  const title=`Mediación - ${clienteFull(c)} c/ Meta Platforms Inc.${fb?' y Facebook Argentina S.R.L.':''}`;
  const durMin=parseInt(a.duracion)||60;
  const startD=new Date((a.fecha||todayISO())+"T"+(a.hora||"10:00")+":00");
  const endD=new Date(startD.getTime()+durMin*60000);
  const fmt=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
  const det=[`Mediador: ${DB.config.mediador}`,`Cliente: ${clienteFull(c)}`,`Modalidad: ${a.modalidad||'-'}`].join("\n");
  let url="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+fmt(startD)+"/"+fmt(endD)+"&details="+encodeURIComponent(det);
  const guests=[DB.config.estudio.mail,(DB.abogados[0]||{}).mail,(DB.abogados[1]||{}).mail,DB.config.asistenteMail].filter(Boolean);
  if(guests.length) url+="&add="+encodeURIComponent(guests.join(","));
  return url;
}

function tabFinanzas(c){
  const f=c.finanzas;
  const cobrado=cobradoDe(c);
  const pend=Number(f.montoTotal||0)-cobrado;
  // --- adelanto en otra moneda (carga inicial) ---
  const aMon=f.monedaAdelanto||f.moneda, aTc=f.tcAdelanto||"";
  const aDistinta=aMon!==f.moneda;
  const aEquivIni=(aDistinta && Number(aTc)>0 && Number(f.adelanto)>0)
    ? (f.moneda==="USD"?money(Number(f.adelanto)*Number(aTc),"ARS"):money(Number(f.adelanto)/Number(aTc),"USD"))
    : "—";
  // total efectivamente recibido en pesos (pagos cargados en ARS), para mostrar en paralelo
  const otra = f.moneda==="USD" ? "ARS" : "USD";
  const recibidoOtra=(c.pagos||[]).filter(p=>p.moneda===otra).reduce((s,p)=>s+Number(p.importe||0),0);

      ? (Number(p.tc||0)>0 ? `${money(equiv,f.moneda)}<br><small style="color:var(--muted)">TC ${Number(p.tc).toLocaleString("es-AR")}</small>` : `<small style="color:var(--red)">falta TC</small>`)

    return `<tr><td>${fdate(p.fecha)}</td><td>${money(p.importe,p.moneda)}</td><td>${equivCell}</td><td>${esc(p.medio||"—")}</td><td>${tipo}${esc(p.obs||"")}</td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="editPago('${p.id}')" title="Editar pago">✎</button><button class="btn btn-ghost btn-sm" onclick="delPago('${p.id}')" title="Eliminar">✕</button></td></tr>`;
  }).join("")||`<tr><td colspan="6" class="empty">Sin pagos registrados</td></tr>`;
  return `<div class="grid g4" style="margin-bottom:18px">
    <div class="stat gold"><div class="lab">Monto total</div><div class="val">${money(f.montoTotal,f.moneda)}</div></div>
    <div class="stat green"><div class="lab">Cobrado</div><div class="val">${money(cobrado,f.moneda)}</div>${cobradoSub}</div>
    <div class="stat amber"><div class="lab">Pendiente</div><div class="val">${money(pend,f.moneda)}</div></div>
    <div class="stat accent"><div class="lab">Devolución pactada</div><div class="val">${money(f.devolucion,f.moneda)}</div><div class="sub">${Number(f.devolucion||0)>0?(f.estadoResultado==='favorable'?'no se devuelve (favorable)':['realizada_dev','cancelada_dev'].includes(f.estadoDevolucion)?finLabel(f.estadoDevolucion):'⏸️ en stand by hasta resolver'):'—'}</div></div>
  </div>
  ${(isSocio() && Number(f.devolucion||0)>0 && f.estadoResultado!=='favorable' && !['realizada_dev','cancelada_dev'].includes(f.estadoDevolucion)) ? `
  <div class="card" style="margin-bottom:18px;border-left:4px solid var(--amber)"><div class="card-b" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <div style="flex:1;min-width:220px"><div style="font-weight:700;color:var(--navy);font-size:14px">⏸️ Devolución congelada en stand by: ${money(Math.min(Number(f.devolucion||0),baseReservaStandBy(c)),f.moneda)}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:3px">Esta plata queda apartada por si hay que devolverla. Cuando se <b>recupere la cuenta del cliente</b>, liberá el stand by para que pase a la caja disponible del estudio.</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" style="background:#e8f7ee;color:#1c7a40;border:1px solid #bfe6cd" onclick="standByCobrado('${c.id}')" title="Se recuperó la cuenta: la reserva pasa a caja disponible">✓ Cuenta recuperada</button>
      <button class="btn btn-sm" style="background:#fdeeee;color:#c0392b;border:1px solid #f2c9c9" onclick="standByReembolsado('${c.id}')" title="Se devolvió la plata al cliente">↩ Reembolsado</button>
    </div>
  </div></div>` : ''}
  <div class="grid g2">
    <div class="card"><div class="card-h"><h3>Condiciones económicas</h3></div><div class="card-b">
      <div class="frow fr2"><div class="field"><label>Moneda del precio</label><select id="fi_mon" onchange="finAdelRecalc()"><option ${f.moneda==="USD"?"selected":""}>USD</option><option ${f.moneda==="ARS"?"selected":""}>ARS</option></select><div class="hint">Moneda en la que se cerró el precio</div></div><div class="field"><label>Estado de cobro (automático)</label><div style="padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--grey-bg)"><span class="badge ${FIN_COLOR[f.estadoCobro]||'b-grey'}">${finLabel(f.estadoCobro)}</span></div><div class="hint">Se calcula con los pagos del Plan de pagos</div></div></div>
      <div class="frow fr2">${inp("fi_total","Monto total pactado",f.montoTotal,"number")}<div class="field"><label>Adelanto abonado</label><input id="fi_adel" type="number" value="${esc(f.adelanto)}" oninput="finAdelRecalc()"><div class="hint">En la moneda del precio. Si se cobró en pesos, indicá la moneda y el TC abajo.</div></div></div>
      <div class="frow fr2"><div class="field"><label>Moneda en que se cobró el adelanto</label><select id="fi_adelMon" onchange="finAdelRecalc()"><option ${aMon==="USD"?"selected":""}>USD</option><option ${aMon==="ARS"?"selected":""}>ARS</option></select></div><div class="field" id="fi_adelTcBox" style="${aDistinta?'':'display:none'}"><label>Tipo de cambio (ARS por 1 USD)</label><input id="fi_adelTc" type="number" value="${esc(aTc)}" oninput="finAdelRecalc()"><div class="hint">Se cobró ≈ <b id="fi_adelEquiv">${aEquivIni}</b></div></div></div>
      <div class="frow fr2"><div class="field"><label>Saldo pendiente (automático)</label><input id="fi_saldo" value="${esc(f.saldo)}" disabled style="background:var(--grey-bg);color:var(--muted)"><div class="hint">Monto total − adelanto. Para marcarlo pagado usá el <b>Plan de pagos</b> abajo.</div></div>${inp("fi_dev","Devolución (resultado negativo)",f.devolucion,"number")}</div>
      <div class="frow fr2">${inp("fi_fadel","Fecha pago adelanto",f.fechaAdelanto,"date")}${inp("fi_fsaldo","Fecha prevista saldo",f.fechaSaldo,"date")}</div>
      ${inp("fi_medio","Medio de pago",f.medioPago)}
      <div class="field"><label>Observaciones financieras</label><textarea id="fi_obs" rows="2">${esc(f.obs)}</textarea></div>
      <div class="alert alert-info"><span>🔗</span><div>Estos montos se usan automáticamente al generar el contrato.</div></div>
      <button class="btn btn-primary" onclick="saveFinanzas()">Guardar finanzas</button>
    </div></div>
    <div class="card"><div class="card-h"><h3>Historial de pagos</h3><button class="btn btn-ghost btn-sm" onclick="addPago()">＋ Registrar otro pago</button></div>
      <table><thead><tr><th>Fecha</th><th>Importe</th><th>Equivale (${f.moneda})</th><th>Medio</th><th>Obs.</th><th></th></tr></thead><tbody>${pagos}</tbody></table></div>
  </div>
  ${finPlanPagos(c)}
  ${finEstadoBlock(c)}
  ${finHistCard(c)}`;
}
function finEstadoBlock(c){
  const f=c.finanzas; const soc=isSocio();
  const selBox=(id,label,opts,v,locked)=>`<div class="field"><label>${label}</label><select id="${id}" ${locked?'disabled style="background:var(--grey-bg);color:var(--muted)"':''}>${opts.map(o=>`<option value="${o}" ${v===o?'selected':''}>${finLabel(o)}</option>`).join("")}</select>${locked?'<div class="hint">Solo socios</div>':''}</div>`;
  const saldoAbierto=Math.max(Number(f.montoTotal||0)-cobradoDe(c),0);
  const incBox = soc ? `<div style="margin-top:12px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--amber-bg)">
      <label class="check" style="display:flex;gap:9px;align-items:flex-start;margin:0;font-weight:500;cursor:pointer">
        <input type="checkbox" ${f.saldoIncobrable?'checked':''} onchange="toggleIncobrable(this.checked)" style="margin-top:2px">
        <span>Saldo incobrable — el cliente no abonará el saldo (caso resuelto sin cobro).<br><small style="color:var(--muted)">El saldo pendiente${saldoAbierto>0?` (${money(saldoAbierto,f.moneda)})`:''} sale de “pendiente por cobrar” y pasa a <b>“Dejado de percibir”</b>.</small></span>
      </label>
      ${f.saldoIncobrable?`<div class="frow fr2" style="margin-top:9px">
        <div class="field"><label>Fecha</label><input type="date" value="${f.fechaIncobrable||''}" onchange="setIncobrableCampo('fechaIncobrable',this.value)"></div>
        <div class="field"><label>Motivo (opcional)</label><input value="${esc(f.motivoIncobrable||'')}" onchange="setIncobrableCampo('motivoIncobrable',this.value)" placeholder="Ej: recuperó la cuenta y no quiso seguir"></div>
      </div>`:''}
    </div>` : '';
  return `<div class="card" style="margin-top:18px"><div class="card-h"><h3>Estado financiero del caso</h3>
      <span class="badge ${FIN_COLOR[f.estadoCobro]||'b-grey'}">${finLabel(f.estadoCobro)}</span>${f.saldoIncobrable?'<span class="badge b-amber" style="margin-left:6px">Saldo incobrable</span>':''}</div><div class="card-b">
    <div class="frow fr2">${selBox("fe_cobro","Estado de cobro",FIN_COBRO,f.estadoCobro,false)}${selBox("fe_res","Resultado del caso",FIN_RESULTADO,f.estadoResultado,!soc)}</div>
    <div class="frow fr2">${selBox("fe_dev","Devolución al cliente",FIN_DEVOLUCION,f.estadoDevolucion,!soc)}${selBox("fe_liq","Liquidación entre socios",FIN_LIQUIDACION,f.estadoLiquidacion,!soc)}</div>
    <button class="btn btn-primary" onclick="saveFinEstados()">Guardar estado financiero</button>
    ${incBox}
  </div></div>`;
}
function toggleIncobrable(on){ const c=CURRENT,f=c.finanzas; f.saldoIncobrable=!!on;
  if(on&&!f.fechaIncobrable) f.fechaIncobrable=todayISO();
  const saldoAbierto=Math.max(Number(f.montoTotal||0)-cobradoDe(c),0);
  finLog(c, on?"Saldo marcado como incobrable (dejado de percibir)":"Saldo incobrable desmarcado", on?money(saldoAbierto,f.moneda):"");
  save(); renderCaso();
}
function setIncobrableCampo(campo,valor){ CURRENT.finanzas[campo]=valor; save(); }
function finHistCard(c){
  const h=(c.finanzas.hist||[]);
  const rows=h.length?h.map(x=>`<div class="tl-item"><div class="d"></div><div class="act">${esc(x.accion)}${x.detalle?` — <span style="color:var(--muted)">${esc(x.detalle)}</span>`:''}</div><div class="meta">${esc(userName(x.usuario))} · ${esc(x.fecha)}</div></div>`).join(""):'<div class="empty">Sin movimientos financieros registrados</div>';
  return `<div class="card" style="margin-top:18px"><div class="card-h"><h3>Historial financiero del caso</h3></div><div class="card-b"><div class="timeline">${rows}</div></div></div>`;
}
function finPlanPagos(c){
  const f=c.finanzas; const ade=Number(f.adelanto||0); const saldo=saldoDe(c);
  const adePagado = ade>0;
  const saldoPagado = !!f.saldoPagado;
  const fila=(num,titulo,monto,pagado,fecha,medio,accion)=>`<div class="driveitem" style="border-bottom:1px solid var(--line);align-items:center;gap:10px">
     <div style="width:26px;height:26px;border-radius:50%;background:${pagado?'#e8f7ee':'#fff5e6'};color:${pagado?'#1c7a40':'#b07d1a'};display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">${pagado?'✓':num}</div>
     <div style="flex:1"><b>${titulo}</b> · ${money(monto,f.moneda)}<br><small style="color:var(--muted)">${pagado?('Pagado'+(fecha?' el '+fdate(fecha):'')+(medio?' · '+esc(medio):'')):'Pendiente de pago'}</small></div>
     <div>${accion||(pagado?'<span class="badge b-green">Pagado</span>':'<span class="badge b-amber">Pendiente</span>')}</div></div>`;
  const _cobradoTotal = adePagado && (saldoPagado || saldo<=0);
  return `<div class="card" style="margin-top:18px"><div class="card-h"><h3>Plan de pagos</h3><span class="badge ${_cobradoTotal?'b-green':adePagado?'b-amber':'b-grey'}">${_cobradoTotal?'Cobrado completo':adePagado?'Falta el saldo':'Sin pagos'}</span></div><div class="card-b" style="padding:6px 8px">
    ${fila('1','Adelanto',ade,adePagado,f.fechaAdelanto,f.medioPago, adePagado?'<span class="badge b-green">Pagado</span>':'<span class="badge b-grey">Cargá el adelanto arriba</span>')}
    ${saldo>0?fila('2','Saldo / diferencia',saldo,saldoPagado,f.fechaSaldoPago,f.medioSaldo, saldoPagado?`<button class="btn btn-ghost btn-sm" onclick="desmarcarSaldo()">Deshacer</button>`:`<button class="btn btn-primary btn-sm" onclick="marcarSaldoPagado()">✓ Registrar pago del saldo</button>`):'<div class="empty" style="padding:10px">Sin saldo: el adelanto cubre el total.</div>'}
  </div></div>`;
}
function marcarSaldoPagado(){ const c=CURRENT,f=c.finanzas; const saldo=saldoDe(c); const otra=f.moneda==="USD"?"ARS":"USD";
  modal({title:"Registrar pago del saldo", size:"sm", body:`
    <div class="alert alert-info"><span>💵</span><div>Saldo / diferencia pactado: <b>${money(saldo,f.moneda)}</b></div></div>
    ${sel("sp_mon","Moneda en que se cobró",[f.moneda,otra],f.moneda)}
    <div id="sp_tcbox" style="display:none">
      <div class="frow fr2">${inp("sp_tc",`Tipo de cambio (ARS por 1 USD)`,"","number")}<div class="field"><label>Equivale a recibir</label><div id="sp_equiv" style="padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--grey-bg);font-weight:600">—</div></div></div>
    </div>
    <div class="frow fr2">${inp("sp_fec","Fecha del pago",todayISO(),"date")}${inp("sp_med","Medio de pago",f.medioPago||"")}</div>
    ${inp("sp_obs","Observaciones (opcional)","")}`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmSaldoPagado()">Confirmar pago del saldo</button>`});
  const rec=()=>{ const mon=val("sp_mon"), box=document.getElementById("sp_tcbox");
    if(mon!==f.moneda){ box.style.display="block"; const tc=Number(val("sp_tc")||0);
      // saldo está en la moneda del caso; si se cobró en la otra, importe = saldo * (o /) TC
      let recibe="—"; if(tc>0){ recibe = f.moneda==="USD" ? money(saldo*tc,"ARS") : money(saldo/tc,"USD"); }
      document.getElementById("sp_equiv").textContent=recibe;
    } else box.style.display="none"; };
  ["sp_mon","sp_tc"].forEach(id=>{ const el=document.getElementById(id); if(el){ el.addEventListener("input",rec); el.addEventListener("change",rec);} });
  rec();
}
function confirmSaldoPagado(){ const c=CURRENT,f=c.finanzas; const saldo=saldoDe(c); const mon=val("sp_mon");
  if(mon!==f.moneda){ const tc=Number(val("sp_tc")||0); if(!(tc>0)){ toast("Cargá el tipo de cambio para registrar el saldo en "+mon,"err"); return; } f.monedaSaldo=mon; f.tcSaldo=tc; }
  else { f.monedaSaldo=""; f.tcSaldo=""; }
  f.saldoPagado=true; f.fechaSaldoPago=val("sp_fec"); f.medioSaldo=val("sp_med");
  syncSaldo(c); recalcEstadoPago(c);
  const tot=Number(f.montoTotal||0); if(f.estadoCobro!=='vencido') f.estadoCobro = (tot>0 && cobradoDe(c)>=tot)?'cobrado_completo':'cobro_parcial';
  const det = f.monedaSaldo ? `${money(f.moneda==="USD"?saldo*f.tcSaldo:saldo/f.tcSaldo, f.monedaSaldo)} · TC ${Number(f.tcSaldo).toLocaleString("es-AR")} · ≈ ${money(saldo,f.moneda)}` : money(saldo,f.moneda);
  finLog(c,"Pago del saldo registrado", det+(f.medioSaldo?' · '+f.medioSaldo:'')+(val("sp_obs")?' · '+val("sp_obs"):''));
  save(); closeModal(); toast("Saldo registrado como pagado ✓"); renderCaso();
}
function desmarcarSaldo(){ if(!confirm("¿Deshacer el pago del saldo?"))return; const c=CURRENT,f=c.finanzas; f.saldoPagado=false; syncSaldo(c); recalcEstadoPago(c); if(f.estadoCobro==='cobrado_completo')f.estadoCobro='cobro_parcial'; finLog(c,"Pago del saldo deshecho",""); save(); renderCaso(); }
function finLog(c, accion, detalle){ c.finanzas.hist=c.finanzas.hist||[]; c.finanzas.hist.unshift({fecha:now(), usuario:SESSION.id, accion, detalle:detalle||""}); }
function saveFinEstados(){ const c=CURRENT, f=c.finanzas; const soc=isSocio();
  f.estadoCobro=val("fe_cobro");
  if(soc){ f.estadoResultado=val("fe_res"); f.estadoDevolucion=val("fe_dev"); f.estadoLiquidacion=val("fe_liq"); }
  finLog(c,"Estado financiero actualizado",`cobro: ${finLabel(f.estadoCobro)}${soc?` · resultado: ${finLabel(f.estadoResultado)} · devolución: ${finLabel(f.estadoDevolucion)} · liquidación: ${finLabel(f.estadoLiquidacion)}`:''}`);
  save(); toast("Estado financiero guardado"); renderCaso(); }
// Recalcula en vivo la moneda/TC del adelanto durante la carga inicial
function finAdelRecalc(){
  const caseMon=val("fi_mon"), box=document.getElementById("fi_adelTcBox");
  if(!box) return;
  const aMon=val("fi_adelMon");
  if(aMon!==caseMon){ box.style.display="";
    const tc=Number(val("fi_adelTc")||0), ade=Number(val("fi_adel")||0);
    let rec="—"; if(tc>0 && ade>0){ rec = caseMon==="USD" ? money(ade*tc,"ARS") : money(ade/tc,"USD"); }
    const el=document.getElementById("fi_adelEquiv"); if(el) el.textContent=rec;
  } else { box.style.display="none"; }
}
function saveFinanzas(){ const c=CURRENT, f=c.finanzas;
  f.moneda=val("fi_mon"); f.montoTotal=val("fi_total"); f.adelanto=val("fi_adel"); f.devolucion=val("fi_dev"); f.fechaAdelanto=val("fi_fadel"); f.fechaSaldo=val("fi_fsaldo"); f.medioPago=val("fi_medio"); f.obs=val("fi_obs");
  // moneda + TC del adelanto (carga inicial)
  const aMon=val("fi_adelMon");
  if(aMon && aMon!==f.moneda){ const aTc=Number(val("fi_adelTc")||0); if(Number(f.adelanto)>0 && !(aTc>0)){ toast("Cargá el tipo de cambio del adelanto cobrado en "+aMon,"err"); return; } f.monedaAdelanto=aMon; f.tcAdelanto=val("fi_adelTc"); }
  else { f.monedaAdelanto=""; f.tcAdelanto=""; }
  const tot=Number(f.montoTotal||0), ade=Number(f.adelanto||0);
  f.saldo = f.montoTotal===""?"":Math.max(tot-ade,0);
  syncAdelanto(c); syncSaldo(c); recalcEstadoPago(c);
  finLog(c,"Condiciones económicas actualizadas",`total: ${money(f.montoTotal,f.moneda)} · adelanto: ${money(f.adelanto,f.moneda)} · saldo: ${money(f.saldo,f.moneda)}`);
  logAction(c,"Finanzas actualizadas"); save(); toast("Finanzas guardadas"); renderCaso(); }
function addPago(){
  const fm=CURRENT.finanzas.moneda;
  modal({title:"Registrar pago", size:"sm", body:`
    <div class="frow fr2">${inp("pa_imp","Importe",CURRENT.finanzas.adelanto||"","number")}${sel("pa_mon","Moneda del pago",["USD","ARS"],fm)}</div>
    <div id="pa_tcbox" style="display:none">
      <div class="frow fr2">${inp("pa_tc","Tipo de cambio (ARS por 1 USD)","","number")}<div class="field"><label>Equivale a</label><div id="pa_equiv" style="padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--grey-bg);font-weight:600">—</div></div></div>
      <div class="hint" style="margin:-4px 0 8px">El precio del caso está en <b>${fm}</b>. Cargá el TC del día y el sistema imputa el equivalente al total pactado.</div>
    </div>
    <div class="frow fr2">${inp("pa_fec","Fecha",todayISO(),"date")}${inp("pa_med","Medio de pago",CURRENT.finanzas.medioPago)}</div>
    ${inp("pa_obs","Observaciones","")}`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="savePago()">Registrar</button>`});
  const recompute=()=>{
    const fmon=CURRENT.finanzas.moneda, mon=val("pa_mon"), box=document.getElementById("pa_tcbox");
    if(mon!==fmon){ box.style.display="block";
      const eq=pagoEnMonedaCaso({importe:val("pa_imp"),moneda:mon,tc:val("pa_tc")},fmon);
      document.getElementById("pa_equiv").textContent = (Number(val("pa_tc"))>0 && Number(val("pa_imp"))>0)?money(eq,fmon):"—";
    } else { box.style.display="none"; }
  };
  ["pa_mon","pa_imp","pa_tc"].forEach(id=>{ const el=document.getElementById(id); if(el){ el.addEventListener("input",recompute); el.addEventListener("change",recompute);} });
  recompute();
}
function savePago(){ const imp=val("pa_imp"),mon=val("pa_mon"),fmon=CURRENT.finanzas.moneda;
  const p={id:uid("p"),importe:imp,moneda:mon,fecha:val("pa_fec"),medio:val("pa_med"),obs:val("pa_obs")};
  if(mon!==fmon){ const tc=val("pa_tc"); if(!(Number(tc)>0)){ toast("Cargá el tipo de cambio para imputar el pago en "+mon,"err"); return; } p.tc=tc; }
  CURRENT.pagos.push(p); recalcEstadoPago(CURRENT);
  const detalle=money(imp,mon)+(mon!==fmon?` · TC ${Number(p.tc).toLocaleString("es-AR")} · ≈ ${money(pagoEnMonedaCaso(p,fmon),fmon)}`:'')+(val("pa_med")?` · ${val("pa_med")}`:'');
  finLog(CURRENT,"Pago recibido",detalle); logAction(CURRENT,"Pago registrado: "+money(imp,mon)); save(); closeModal(); toast("Pago registrado"); renderCaso(); }
function delPago(id){ const p=(CURRENT.pagos||[]).find(x=>x.id===id); CURRENT.pagos=CURRENT.pagos.filter(x=>x.id!==id); if(p){ if(p.esSaldo)CURRENT.finanzas.saldoPagado=false; if(p.esAdelanto)CURRENT.finanzas.adelanto=""; finLog(CURRENT,"Pago eliminado",money(p.importe,p.moneda)); } recalcEstadoPago(CURRENT); save(); renderCaso(); }
function editPago(id){
  const p=(CURRENT.pagos||[]).find(x=>x.id===id); if(!p){ toast("Pago no encontrado","err"); return; }
  const fm=CURRENT.finanzas.moneda; const tipo=p.esAdelanto?'Adelanto':p.esSaldo?'Saldo':'Pago';

// Genera un .doc en formato MHTML (multipart) para que Word muestre las imágenes
// incrustadas (base64). Reemplaza cada data-URI por un adjunto referenciado por nombre.
function buildDocMhtml(html, css){
  const boundary="----=_NextPart_GMJ_"+Math.random().toString(36).slice(2);
  const parts=[]; let idx=0;
  const extDe=(mime)=>({ "image/png":"png","image/jpeg":"jpg","image/jpg":"jpg","image/gif":"gif","image/webp":"png","image/bmp":"bmp" }[mime.toLowerCase()]||"png");
  const htmlOut = html.replace(/<img\b[^>]*>/gi, (tag)=>{
    return tag.replace(/src\s*=\s*["']data:(image\/[a-z0-9.+-]+);base64,([^"']+)["']/i, (m,mime,b64)=>{
      idx++; const name="image"+idx+"."+extDe(mime);
      parts.push({name, mime, b64:b64.replace(/\s+/g,"")});
      return 'src="'+name+'"';
    });
  });
  const full='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+htmlOut+'</body></html>';
  let mht="MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary=\""+boundary+"\"\r\n\r\n";
  mht+="--"+boundary+"\r\nContent-Type: text/html; charset=\"utf-8\"\r\nContent-Transfer-Encoding: 8bit\r\nContent-Location: file:///C:/gmj/doc.htm\r\n\r\n"+full+"\r\n\r\n";
  for(const p of parts){
    const b64lines=p.b64.replace(/.{76}/g,"$&\r\n");
    mht+="--"+boundary+"\r\nContent-Type: "+p.mime+"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/gmj/"+p.name+"\r\n\r\n"+b64lines+"\r\n\r\n";
  }
  mht+="--"+boundary+"--\r\n";
  return mht;
}
function downloadDoc(id, fmt){
  const c=CURRENT; const d=c.docs.find(x=>x.id===id);
  const filename = docTitle(d.tipo).replace(/ /g,"_")+"_"+clienteFull(c).replace(/[ ,]+/g,"_")+"_v"+d.version;
  const css=docExportCSS(d.tipo);
  if(fmt==="word"){
    let blob;
    if(/src\s*=\s*["']data:image\//i.test(d.html)){
      // El documento tiene imágenes (ej. firmas). Word NO renderiza base64 en HTML,
      // así que generamos un .doc en formato MHTML con las imágenes como adjuntos.
      blob=new Blob([buildDocMhtml(d.html,css)],{type:"application/msword"});
    } else {
      blob=new Blob(['﻿<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+d.html+'</body></html>'],{type:"application/msword"});
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename+".doc"; a.click();
    toast("Documento Word descargado");
  } else {
    const w=window.open("","_blank");
    w.document.write(`<html><head><title>${filename}</title><style>${css}</style></head><body>${d.html}<script>window.onload=function(){window.print()}<\/script></body></html>`);
    w.document.close();
    toast("Abriendo vista de impresión / PDF");
  }
  setDocEstadoSilent(d);
}

  const _mt=money(f.montoTotal,m), _ad=money(f.adelanto,m), _sd=money(f.saldo,m);

    mediador:DB.config.mediador||'', objeto:c.objeto||DB.config.objeto||'',
    abogado1:a1.nombre||'', abogado1_domicilio:a1.domicilio||'', abogado1_tel:a1.tel||'', abogado1_mail:a1.mail||'',
    abogado2:a2.nombre||'', abogado2_domicilio:a2.domicilio||'', abogado2_tel:a2.tel||'', abogado2_mail:a2.mail||'',
    patrocinante:pat.nombre||'', patrocinante_domicilio:pat.domicilio||'', patrocinante_tomo:pat.tomo||'', patrocinante_folio:pat.folio||'', patrocinante_matricula:pat.matricula||'', patrocinante_tel:pat.tel||'', patrocinante_mail:pat.mail||'',
    fecha_larga:longDate(""), fecha_es:`${fecha.getDate()} de ${mesesEs[fecha.getMonth()]} de ${fecha.getFullYear()}`, fecha_en:`${mesesEn[fecha.getMonth()]} ${fecha.getDate()}, ${fecha.getFullYear()}`,
    sintesis:((c.relato&&(c.relato.sintesis||c.relato.original))||'').replace(/\n/g,"<br>"), requeridos_bloque:reqBloque

function plCmd(cmd){ try{document.execCommand(cmd,false,null);}catch(e){} const ed=plEd(); if(ed)ed.focus(); savePlRange(); }
function plFormat(tag){ try{document.execCommand('formatBlock',false,tag);}catch(e){} const ed=plEd(); if(ed)ed.focus(); savePlRange(); }
function savePlRange(){ const s=window.getSelection(); if(s&&s.rangeCount){ const r=s.getRangeAt(0); const ed=plEd(); if(ed&&ed.contains(r.commonAncestorContainer)) PL_RANGE=r.cloneRange(); } }
function plInsertImage(){
  savePlRange();
  const fi=document.createElement("input"); fi.type="file"; fi.accept="image/*";
  fi.onchange=()=>{ const f=fi.files&&fi.files[0]; if(!f)return;
    if(f.size>3*1024*1024){ toast("La imagen es muy grande (máx 3 MB)","err"); return; }
    const rd=new FileReader();
    rd.onload=()=>{ const ed=plEd(); if(!ed)return; ed.focus();
      const sel=window.getSelection(); if(PL_RANGE){ sel.removeAllRanges(); sel.addRange(PL_RANGE); }
      const html='<img class="pl-img" src="'+rd.result+'" style="width:240px;height:auto;display:block;margin:8px 0;cursor:pointer">';
      if(!document.execCommand('insertHTML',false,html)){ ed.innerHTML+=html; }
      savePlRange();
      // seleccionar la imagen recién insertada
      setTimeout(()=>{ const imgs=ed.querySelectorAll("img"); if(imgs.length) plImgSelect(imgs[imgs.length-1]); },30);
    };
    rd.readAsDataURL(f);
  };
  fi.click();
}

let PL_IMG=null;
function plEditorClick(e){
  const t=e.target;

  else if(!(t && t.closest && t.closest("#plImgBar"))){ plImgDeselect(); }
}
function plImgUIEnsure(){
  if(document.getElementById("plImgBar")) return;
  const bar=document.createElement("div"); bar.id="plImgBar";
  bar.style.cssText="position:fixed;z-index:99999;display:none;background:#1f2937;color:#fff;border-radius:8px;padding:5px;box-shadow:0 6px 22px rgba(0,0,0,.28);font-size:11px;gap:3px;align-items:center;flex-wrap:wrap;max-width:330px";
  const b=(label,fn,title)=>`<button type="button" title="${title||''}" data-fn="${fn}" style="background:#374151;color:#fff;border:none;border-radius:5px;padding:4px 7px;margin:1px;cursor:pointer;font-size:11px">${label}</button>`;
  bar.innerHTML =
    b("−","resize:-20","Más chica")+b("+","resize:20","Más grande")+
    `<span style="opacity:.4;margin:0 2px">|</span>`+
    b("25%","width:25")+b("50%","width:50")+b("100%","width:100")+
    `<span style="opacity:.4;margin:0 2px">|</span>`+
    b("En línea","wrap:inline","La imagen sigue el texto")+
    b("Izq","wrap:left","Texto a la derecha")+
    b("Centro","wrap:center")+
    b("Der","wrap:right","Texto a la izquierda")+
    `<span style="opacity:.4;margin:0 2px">|</span>`+
    b("Detrás","wrap:behind","Detrás del texto, se puede arrastrar")+
    b("Delante","wrap:front","Delante del texto, se puede arrastrar")+
    `<span style="opacity:.4;margin:0 2px">|</span>`+
    b("🗑","del","Quitar imagen");
  bar.addEventListener("mousedown",(e)=>{ e.preventDefault(); });
  bar.addEventListener("click",(e)=>{
    const btn=e.target.closest("button[data-fn]"); if(!btn||!PL_IMG)return;
    const [fn,arg]=btn.getAttribute("data-fn").split(":");
    if(fn==="resize") plImgResize(parseInt(arg,10));
    else if(fn==="width") plImgWidth(parseInt(arg,10));
    else if(fn==="wrap") plImgWrap(arg);
    else if(fn==="del"){ const ed=plEd(); PL_IMG.remove(); plImgDeselect(); if(ed)ed.focus(); }
  });
  document.body.appendChild(bar);
  const h=document.createElement("div"); h.id="plImgHandle";
  h.style.cssText="position:fixed;z-index:99999;display:none;width:14px;height:14px;background:#2563eb;border:2px solid #fff;border-radius:50%;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,.4)";
  h.addEventListener("mousedown",plImgResizeStart);
  document.body.appendChild(h);
  const ol=document.createElement("div"); ol.id="plImgOutline";
  ol.style.cssText="position:fixed;z-index:99998;display:none;border:2px dashed #2563eb;pointer-events:none;border-radius:2px";
  document.body.appendChild(ol);
  window.addEventListener("scroll",plImgReposition,true);
  window.addEventListener("resize",plImgReposition);
}
function plImgSelect(img){
  plImgUIEnsure(); PL_IMG=img;
  img.onmousedown=plImgDragStart;
  plImgReposition();
  document.getElementById("plImgBar").style.display="flex";
  document.getElementById("plImgHandle").style.display="block";
  document.getElementById("plImgOutline").style.display="block";
}
function plImgDeselect(){
  if(PL_IMG){ PL_IMG.onmousedown=null; PL_IMG=null; }
  ["plImgBar","plImgHandle","plImgOutline"].forEach(id=>{ const el=document.getElementById(id); if(el)el.style.display="none"; });
}
function plImgReposition(){
  if(!PL_IMG) return;
  const r=PL_IMG.getBoundingClientRect();
  const bar=document.getElementById("plImgBar");
  const h=document.getElementById("plImgHandle");
  const ol=document.getElementById("plImgOutline");
  if(ol){ ol.style.left=(r.left-2)+"px"; ol.style.top=(r.top-2)+"px"; ol.style.width=(r.width)+"px"; ol.style.height=(r.height)+"px"; }
  if(h){ h.style.left=(r.right-7)+"px"; h.style.top=(r.bottom-7)+"px"; }
  if(bar){ let top=r.top-44; if(top<6)top=r.bottom+8; let left=r.left; if(left+330>window.innerWidth)left=Math.max(6,window.innerWidth-336); bar.style.left=left+"px"; bar.style.top=top+"px"; }
}
function plImgResize(deltaPct){
  if(!PL_IMG) return;
  const w=PL_IMG.getBoundingClientRect().width;
  PL_IMG.style.width=Math.max(40,Math.round(w*(1+deltaPct/100)))+"px";
  PL_IMG.style.height="auto"; plImgReposition();
}
function plImgWidth(pct){
  if(!PL_IMG) return;
  PL_IMG.style.width=pct+"%"; PL_IMG.style.height="auto"; plImgReposition();
}
function plImgWrap(mode){
  if(!PL_IMG) return;
  const ed=plEd(); const s=PL_IMG.style;
  s.float=""; s.position=""; s.zIndex=""; s.left=""; s.top=""; s.display=""; s.margin=""; s.verticalAlign=""; s.cursor="pointer";
  if(mode==="inline"){ s.display="inline-block"; s.margin="0 4px"; s.verticalAlign="middle"; }
  else if(mode==="left"){ s.float="left"; s.margin="4px 14px 8px 0"; }
  else if(mode==="right"){ s.float="right"; s.margin="4px 0 8px 14px"; }
  else if(mode==="center"){ s.display="block"; s.margin="10px auto"; }
  else if(mode==="behind"||mode==="front"){
    const er=ed.getBoundingClientRect(); const ir=PL_IMG.getBoundingClientRect();
    s.position="absolute"; s.display="block"; s.margin="0";
    s.left=Math.max(0,Math.round(ir.left-er.left+ed.scrollLeft))+"px";
    s.top=Math.max(0,Math.round(ir.top-er.top+ed.scrollTop))+"px";
    s.zIndex = mode==="behind" ? "-1" : "5";
    s.cursor="move";
  }
  plImgReposition();
}
function plImgResizeStart(e){
  if(!PL_IMG) return; e.preventDefault(); e.stopPropagation();
  const startX=e.clientX, startW=PL_IMG.getBoundingClientRect().width;
  const move=(ev)=>{ PL_IMG.style.width=Math.max(40,Math.round(startW+(ev.clientX-startX)))+"px"; PL_IMG.style.height="auto"; plImgReposition(); };
  const up=()=>{ document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up); };
  document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
}
function plImgDragStart(e){
  if(!PL_IMG || getComputedStyle(PL_IMG).position!=="absolute") return;
  e.preventDefault(); e.stopPropagation();
  const ed=plEd(); const er=ed.getBoundingClientRect(); const ir=PL_IMG.getBoundingClientRect();
  const offX=e.clientX-ir.left, offY=e.clientY-ir.top;
  const move=(ev)=>{
    let left=Math.round(ev.clientX-er.left-offX+ed.scrollLeft);
    let top=Math.round(ev.clientY-er.top-offY+ed.scrollTop);
    PL_IMG.style.left=Math.max(0,left)+"px"; PL_IMG.style.top=Math.max(0,top)+"px"; plImgReposition();
  };
  const up=()=>{ document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up); };
  document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
}
function insertVar(tok){

  savePlRange();
}

function previewPlantilla(){

  w.document.close();
}
function longDate(d){
  const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

}

// Texto por defecto del contrato (dos versiones editables: con y sin reintegro).
// Usa placeholders {{...}} que rellena renderPlantilla. Las firmas y el cierre los
// agrega el código (no van en la plantilla) para no romper paginación ni firma.
function DEFAULT_CONTRATO(hayReintegro){
  const ORD=["PRIMERA","SEGUNDA","TERCERA","CUARTA","QUINTA","SEXTA","SÉPTIMA","OCTAVA","NOVENA","DÉCIMA","DÉCIMO PRIMERA","DÉCIMO SEGUNDA"];
  const cls=[];
  cls.push(["OBJETO Y ALCANCE.","EL CLIENTE contrata a EL ESTUDIO para realizar gestiones profesionales, legales, administrativas y/o prejudiciales tendientes a procurar la rehabilitación, recuperación o reactivación de la cuenta digital indicada. El servicio podrá comprender análisis del caso, revisión de documentación, preparación de reclamos, comunicaciones, intimaciones, presentaciones, seguimiento del trámite e intervención en instancia de audiencia o comunicación formal con Meta, Instagram, sus representantes, apoderados o áreas correspondientes, conforme la estrategia profesional definida por EL ESTUDIO."]);
  cls.push(["NATURALEZA DEL SERVICIO.","EL ESTUDIO actuará con diligencia profesional, buena fe y criterio técnico-jurídico. EL CLIENTE declara comprender que Meta, Instagram y/o sus empresas vinculadas poseen políticas internas, sistemas de revisión, canales administrativos y criterios de decisión propios, ajenos al control directo de EL ESTUDIO. En consecuencia, el servicio no implica garantía absoluta de resultado, "+(hayReintegro?"sin perjuicio del régimen de reintegro expresamente pactado para el supuesto de resultado negativo.":"asumiendo EL ESTUDIO una obligación de medios y no de resultado.")]);
  cls.push(["HONORARIOS Y FORMA DE PAGO.","{{clausula_pago}}"]);
  cls.push(["PLAZO.","EL ESTUDIO realizará las gestiones correspondientes dentro de un plazo máximo de noventa (90) días corridos, contados desde la fecha en que se haya celebrado y/o cumplido la instancia de audiencia, comunicación formal o gestión prejudicial con Meta, Instagram, sus representantes o apoderados. EL CLIENTE reconoce que los tiempos concretos pueden depender de respuestas de Meta, revisiones internas de la plataforma, canales administrativos, disponibilidad de instancias prejudiciales o cualquier otra circunstancia ajena al control directo de EL ESTUDIO."]);
  cls.push(["CUMPLIMIENTO Y NUEVA SUSPENSIÓN.","El presente contrato se considerará cumplido por EL ESTUDIO si, como resultado de las gestiones realizadas, se obtiene la rehabilitación, reactivación, recuperación o restitución razonable del acceso a la cuenta. Una vez obtenida la rehabilitación, EL ESTUDIO no será responsable por nuevas suspensiones, bloqueos, restricciones, inhabilitaciones, denuncias, cierres, pérdidas de acceso o limitaciones posteriores, cualquiera sea su causa. Si luego de rehabilitada la cuenta volviera a ser suspendida o restringida, ello será considerado un hecho nuevo, autónomo e independiente, que requerirá una nueva evaluación profesional y, eventualmente, una nueva contratación."]);
  if(hayReintegro) cls.push(["REINTEGRO POR RESULTADO NEGATIVO.","Si vencido el plazo de noventa (90) días corridos, contado desde la fecha en que se haya celebrado y/o cumplido la instancia de audiencia, comunicación formal o gestión prejudicial con Meta, Instagram, sus representantes o apoderados, no se hubiera logrado la rehabilitación, recuperación o reactivación de la cuenta, EL ESTUDIO reintegrará a EL CLIENTE la suma de <b>{{devolucion}}</b>, dentro de los treinta (30) días hábiles de vencido dicho plazo o de comunicarse el cierre negativo del caso, lo que ocurra primero. Las partes dejan constancia de que el monto no reintegrable, en caso de existir, responde a análisis legal, gastos operativos, tareas profesionales, preparación de documentación, comunicaciones, audiencia y demás gestiones efectivamente realizadas."]);
  cls.push(["OBLIGACIONES Y DECLARACIONES DEL CLIENTE.","EL CLIENTE se obliga a brindar información completa, veraz y actualizada; entregar documentación, capturas, correos, notificaciones, datos de contacto, antecedentes y demás elementos necesarios; responder los requerimientos de EL ESTUDIO; y no realizar gestiones paralelas, contradictorias o perjudiciales sin aviso previo. EL CLIENTE declara ser titular, administrador legítimo, representante autorizado o persona con interés legítimo sobre la cuenta, y no ocultar antecedentes relevantes vinculados a la suspensión o bloqueo. La información falsa, incompleta o tardía, o las acciones que perjudiquen la estrategia, podrán afectar el resultado y liberar a EL ESTUDIO de responsabilidad por demoras, rechazos o imposibilidad de avanzar."]);

/* ── Firma electrónica del cliente (pad de dibujo) ── */
let SIGPAD=null;
function sigPadInit(){
  const cv=document.getElementById("cf_sigpad"); if(!cv) return;
  const ctx=cv.getContext("2d");
  const ratio=Math.max(window.devicePixelRatio||1,1);
  const cssW=cv.offsetWidth||700, cssH=180;
  cv.width=cssW*ratio; cv.height=cssH*ratio; ctx.scale(ratio,ratio);
  ctx.lineWidth=2.2; ctx.lineJoin="round"; ctx.lineCap="round"; ctx.strokeStyle="#111827";
  let drawing=false, empty=true, last=null;
  const pos=e=>{ const r=cv.getBoundingClientRect(); const t=(e.touches&&e.touches[0])?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; };
  const start=e=>{ drawing=true; last=pos(e); if(e.cancelable)e.preventDefault(); };
  const move=e=>{ if(!drawing)return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; empty=false; if(e.cancelable)e.preventDefault(); };
  const end=()=>{ drawing=false; };
  cv.addEventListener("mousedown",start); cv.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
  cv.addEventListener("touchstart",start,{passive:false}); cv.addEventListener("touchmove",move,{passive:false}); cv.addEventListener("touchend",end);
  SIGPAD={cv,ctx,isEmpty:()=>empty,clear:()=>{ctx.clearRect(0,0,cv.width,cv.height);empty=true;}};
}
function sigPadClear(){ if(SIGPAD)SIGPAD.clear(); }
function sigPadEmpty(){ return !SIGPAD || SIGPAD.isEmpty(); }
function sigPadDataURL(){ return SIGPAD ? SIGPAD.cv.toDataURL("image/png") : ""; }

function docsClienteGenerar(c, consent){
  FIRMA_CLIENTE = (consent&&consent.firmaImg)||"";
  try{
    // Usa buildDocHtml → misma fuente que la generación manual del panel

let DOCS_CLIENTE=null;
async function descargarDocCliente(tipo){
  if(!DOCS_CLIENTE){ toast("No hay documento para descargar","err"); return; }
  const dtipo = tipo==="contrato"?"contrato":"carta_poder"; // el motor jsPDF usa "carta_poder"
  const html = tipo==="contrato"?DOCS_CLIENTE.contrato:DOCS_CLIENTE.poder;
  const filename = (tipo==="contrato"?"Contrato_de_servicios_":"Carta_poder_")+(DOCS_CLIENTE.nombreArch||"cliente")+".pdf";
  toast("Generando tu PDF, aguardá un momento…");
  try{
    const b64=await docToPdfBase64({tipo:dtipo, html});
    if(!b64){ toast("No se pudo generar el PDF","err"); return; }
    const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:"application/pdf"}));
    const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 2000);
    toast("✓ Descarga iniciada");
  }catch(e){ console.error("descargarDocCliente",e); toast("No se pudo generar el PDF","err"); }
}

// Genera los documentos firmados, calcula la huella SHA-256 de cada PDF y guarda el
// registro inmutable de consentimiento (versión LOCAL / borrador; en la nube lo hace la edge function).
async function finalizarFirmaLocal(c){
  const consent=armarConsentimiento();
  const docs=docsClienteGenerar(c, consent);
  DOCS_CLIENTE={ contrato:docs.contrato, poder:docs.poder, nombreArch:(clienteFull(c)||"cliente").replace(/[ ,]+/g,"_") };
  // Huella de integridad de cada PDF firmado (mismo motor jsPDF que usa la descarga del cliente).
  try{
    const cB64=await docToPdfBase64({tipo:"contrato", html:docs.contrato});
    const pB64=await docToPdfBase64({tipo:"carta_poder", html:docs.poder});
    consent.contratoHash = cB64? await sha256Hex(b64ToBytes(cB64)) : "";
    consent.poderHash    = pB64? await sha256Hex(b64ToBytes(pB64)) : "";
  }catch(e){ console.error("hash docs",e); }
  // En modo local no hay servidor: se marca el origen de los sellos. En la nube, IP y timestamp los pone la edge function.
  consent.ip="(local · demo)"; consent.serverTs=consent.fecha;
  c.consentimiento=consent;
  // Registro inmutable (en la nube = fila de la tabla `consentimientos`).
  DB.consentimientos=DB.consentimientos||[];
  DB.consentimientos.push({ ...consent, casoId:c.id, cliente:clienteFull(c), email:(c.cliente&&c.cliente.email)||"" });
  c.docs=c.docs||[]; const hoyN=now();
  c.docs.push({id:uid("d"),tipo:"contrato",version:(c.docs.filter(d=>d.tipo==="contrato").length)+1,estado:"firmado",fecha:hoyN,generadoPor:"cliente",html:docs.contrato,autofirma:true,hash:consent.contratoHash});
  c.docs.push({id:uid("d"),tipo:"carta_poder",version:(c.docs.filter(d=>d.tipo==="carta_poder").length)+1,estado:"firmado",fecha:hoyN,generadoPor:"cliente",html:docs.poder,autofirma:true,hash:consent.poderHash});
  logAction(c,"Contrato y carta poder generados y firmados electrónicamente por el cliente");
  logAction(c,"Registro de consentimiento almacenado (SHA-256, T&C v"+(consent.tycVersion||"")+")");
  try{ save(); }catch(e){ console.error("save",e); }
  formSuccessConDocs();
}

    for(let t=16;t<64;t++){ const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3); const s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10); w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0; }
    let [a,bb,c,d,e,f,g,hh]=H;
    for(let t=0;t<64;t++){ const S1=rr(e,6)^rr(e,11)^rr(e,25); const ch=(e&f)^(~e&g); const t1=(hh+S1+ch+K[t]+w[t])>>>0; const S0=rr(a,2)^rr(a,13)^rr(a,22); const mj=(a&bb)^(a&c)^(bb&c); const t2=(S0+mj)>>>0; hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0; }
    H=[(H[0]+a)>>>0,(H[1]+bb)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+hh)>>>0];
  }
  return H.map(x=>("00000000"+(x>>>0).toString(16)).slice(-8)).join("");
}

/* ============================================================
   FINANZAS GLOBAL (socios)
   ============================================================ */
function casoEsHistorial(c){ const f=c.finanzas||{}; return f.estadoLiquidacion==="liquidado_completo"; }
function dosMon(o){ return `<span style="white-space:nowrap">${money(o.USD,"USD")}</span> · <span style="white-space:nowrap">${money(o.ARS,"ARS")}</span>`; }
// costo de un gasto expresado en la moneda del caso (si está en otra moneda pero vinculado a un cambio, se convierte por ese cambio)
function gastoCostoEnCaso(g, casoMoneda){
  const imp=Number(g.importe||0); if(imp<=0) return 0;
  if((g.moneda||casoMoneda)===casoMoneda) return imp;
  if(g.cambioId){ const cx=(DB.cambios||[]).find(c=>c.id===g.cambioId); if(cx && cx.moneda_destino===g.moneda && cx.moneda_origen===casoMoneda && Number(cx.monto_destino)>0){ return Number(cx.monto_origen)*(imp/Number(cx.monto_destino)); } }
  return 0; // otra moneda sin vínculo: no se descuenta del liquidable de ESTE caso (ya impacta en la caja de su moneda)
}
// monto neto del caso disponible para repartir entre socios
function netLiquidableCaso(c){
  const f=c.finanzas||{}; const cob=cobradoDe(c); if(cob<=0) return 0;
  const dev=Number(f.devolucion||0);
  const devEnStandBy = dev>0 && f.estadoResultado!=='favorable' && !['realizada_dev','cancelada_dev'].includes(f.estadoDevolucion);
  // El stand by se respalda con lo cobrado del SALDO (2ª cuota); si fue pago único, con todo lo cobrado.
  const reservaCaso = devEnStandBy ? Math.min(dev, baseReservaStandBy(c)) : 0;
  const devRealizada = f.estadoDevolucion==='realizada_dev'?dev:0;
  let gastosCaso=0; (c.gastos||[]).forEach(g=>{ if(g.estado==='abonado') gastosCaso+=gastoCostoEnCaso(g, f.moneda); });
  const liq=liquidacionesDe(c.id).reduce((s,l)=>s+(l.reparto||[]).reduce((ss,r)=>ss+Number(r.monto||0),0),0);
  return Math.max(cob - reservaCaso - devRealizada - gastosCaso - liq, 0);
}
// Desglose del STAND BY: por cada caso abierto con devolución pactada sin resolver,
// cuánto está efectivamente reservado (respaldado por lo cobrado del saldo/2ª cuota o el total si fue pago único)
// y cuánto falta fondear (parte de la devolución cuyo saldo todavía no se cobró).
function standByDetalle(){
  const out=[];
  casosActivos().forEach(c=>{
    if(casoEsHistorial(c)) return;
    const f=c.finanzas||{}; const dev=Number(f.devolucion||0);
    const devEnStandBy = dev>0 && f.estadoResultado!=='favorable' && !['realizada_dev','cancelada_dev'].includes(f.estadoDevolucion);
    if(!devEnStandBy) return;
    const pagoUnico = saldoDe(c) <= 0;              // pagó todo junto (sin saldo dividido)
    const saldoCobrado = baseReservaStandBy(c);     // base que respalda el stand by
    const reserva = Math.min(dev, saldoCobrado);    // lo que hoy impacta en stand by
    const sinFondear = Math.max(dev - reserva, 0);  // devolución aún sin respaldo cobrado
    out.push({ c, moneda:f.moneda, dev, saldoCobrado, reserva, sinFondear, pagoUnico,
               totalPagado: Number(f.montoTotal||0)>0 && cobradoDe(c)>=Number(f.montoTotal||0) });
  });
  // primero los que ya tienen reserva efectiva, ordenados por monto reservado desc
  out.sort((a,b)=> (b.reserva-a.reserva) || (b.dev-a.dev));
  return out;
}
// Tras resolver un stand by, refresca la pantalla donde estás (ficha del caso o Finanzas global).

// "Cuenta recuperada": el caso se resolvió FAVORABLE → el estudio se queda la plata reservada.
// Sale del stand by y pasa a la caja disponible (ya estaba en la caja bruta).

// lista unificada de TODOS los gastos (de casos + generales) para analizar en un solo lugar
function allGastos(){
  const out=[];
  casosActivos().forEach(c=>(c.gastos||[]).forEach(g=>{ if(!Number(g.importe||0))return; out.push({fecha:g.fecha,concepto:g.nombre,importe:Number(g.importe||0),moneda:g.moneda,estado:g.estado,medio:g.medio,origen:clienteFull(c),casoId:c.id,gid:g.id,cambioId:g.cambioId,tipo:'caso'}); }));
  (DB.gastosGen||[]).forEach(g=>{ if(!Number(g.importe||0))return; out.push({fecha:g.fecha,concepto:g.concepto,importe:Number(g.importe||0),moneda:g.moneda,estado:g.estado,medio:g.medio,origen:'General del estudio',ggId:g.id,cambioId:g.cambio_id,categoria:g.categoria,tipo:'general'}); });
  out.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  return out;

function calcFinanzasGlobal(){
  const z=()=>({USD:0,ARS:0}); const cur=m=>(m==="ARS"?"ARS":"USD");
  const a={pendCobro:z(),dejadoPercibir:z(),pendDev:z(),pendGasto:z(),cobrado:z(),cobradoReal:z(),gastosPag:z(),devRealizada:z(),fxOut:z(),fxIn:z(),adelantosSocios:z(),reservaDev:z(),ingresos:z()};
  casosActivos().forEach(c=>{
    const f=c.finanzas||{}; const m=cur(f.moneda); const cob=cobradoDe(c); const dev=Number(f.devolucion||0);
    a.cobrado[m]+=cob; // cobrado medido en la moneda PACTADA (para facturación)
    // caja REAL: el efectivo entra en la moneda en que efectivamente se pagó
    (c.pagos||[]).forEach(p=>{ a.cobradoReal[cur(p.moneda)] += Number(p.importe||0); });
    // ¿la devolución pactada está "en stand by"? (cobrada pero podríamos tener que devolverla)
    // Se reserva mientras el caso no se resolvió favorable y la devolución no se realizó/canceló.
    const devEnStandBy = dev>0 && f.estadoResultado!=='favorable' && !['realizada_dev','cancelada_dev'].includes(f.estadoDevolucion);
    // El stand by se respalda con lo cobrado del SALDO (2ª cuota); si fue pago único, con todo lo cobrado.
    const reservaCaso = devEnStandBy ? Math.min(dev, baseReservaStandBy(c)) : 0;
    const noCob=Math.max(Number(f.montoTotal||0)-cob,0);
    // Saldo que el cliente no va a abonar (caso resuelto sin cobro): sale de "pendiente por cobrar" y va a "dejado de percibir".
    if(f.saldoIncobrable) a.dejadoPercibir[m]+=noCob;
    if(!casoEsHistorial(c)){
      if(!f.saldoIncobrable) a.pendCobro[m]+=noCob;
      if(devEnStandBy) a.reservaDev[m]+=reservaCaso;
      if(["pendiente_dev","parcial_dev"].includes(f.estadoDevolucion)) a.pendDev[m]+=dev;
    }
    if(f.estadoDevolucion==="realizada_dev") a.devRealizada[m]+=dev;
    (c.gastos||[]).forEach(g=>{ const gm=cur(g.moneda); const imp=Number(g.importe||0); if(!imp||g.estado==='no corresponde')return; if(g.estado==='abonado') a.gastosPag[gm]+=imp; else a.pendGasto[gm]+=imp; });
  });
  // gastos generales del estudio (no atados a un caso)
  // Los "adelantos entre socios" NO son gasto operativo: cuentan como liquidación a socios.
  (DB.gastosGen||[]).forEach(g=>{ const gm=cur(g.moneda); const imp=Number(g.importe||0); if(!imp)return;
    if(g.categoria==='adelanto_socio'){ if(g.estado!=='pendiente') a.adelantosSocios[gm]+=imp; return; }
    if(g.categoria==='ingreso'){ if(g.estado!=='pendiente') a.ingresos[gm]+=imp; return; }  // ingreso extra: SUMA a la caja
    if(g.estado==='pendiente') a.pendGasto[gm]+=imp; else a.gastosPag[gm]+=imp;
  });
  (DB.cambios||[]).forEach(x=>{ const mo=cur(x.moneda_origen), md=cur(x.moneda_destino); a.fxOut[mo]+=Number(x.monto_origen||0); a.fxIn[md]+=Number(x.monto_destino||0); });
  // caja bruta (toda la plata REAL que entró menos lo que salió, por moneda efectiva)
  a.cajaBruta={
    USD: a.cobradoReal.USD + a.ingresos.USD - a.gastosPag.USD - a.adelantosSocios.USD - a.devRealizada.USD - a.fxOut.USD + a.fxIn.USD,
    ARS: a.cobradoReal.ARS + a.ingresos.ARS - a.gastosPag.ARS - a.adelantosSocios.ARS - a.devRealizada.ARS - a.fxOut.ARS + a.fxIn.ARS
  };
  // caja DISPONIBLE real del estudio = bruta menos lo reservado por posibles devoluciones (stand by)
  a.caja={ USD: a.cajaBruta.USD - a.reservaDev.USD, ARS: a.cajaBruta.ARS - a.reservaDev.ARS };
  return a;
}
// Liquidación entre socios: lo retirado por cada socio (adelantos) y lo que le queda pendiente.
// Repartible = caja disponible + adelantos ya retirados − gastos pendientes (programados). Se divide entre la cantidad de socios.
function liquidacionesSocios(a){
  const byName={};
  socios().forEach(u=>{ const n=u.nombre||"Socio"; if(!byName[n]) byName[n]={nombre:n, ids:[], USD:0, ARS:0, items:[]}; byName[n].ids.push(u.id); });
  (DB.gastosGen||[]).forEach(g=>{ if(g.categoria!=='adelanto_socio'||g.estado==='pendiente')return; const imp=Number(g.importe||0); if(!imp)return; const m=g.moneda==='USD'?'USD':'ARS';
    let entry=Object.values(byName).find(s=>s.ids.includes(g.socio));
    if(!entry){ byName['(sin asignar)']=byName['(sin asignar)']||{nombre:'(sin asignar)',ids:[],USD:0,ARS:0,items:[]}; entry=byName['(sin asignar)']; }
    entry[m]+=imp;
    entry.items.push({ fecha:g.fecha||"", concepto:g.concepto||"Adelanto", monto:imp, moneda:m });
  });
  const list=Object.values(byName);
  list.forEach(s=>s.items.sort((x,y)=>(y.fecha||"").localeCompare(x.fecha||"")));
  const nSoc=Math.max(list.filter(s=>s.nombre!=='(sin asignar)').length,1);
  const r2=n=>Math.round((Number(n)||0)*100)/100; // a centavos: evita diferencias fantasma por decimales sueltos
  list.forEach(s=>{ s.USD=r2(s.USD); s.ARS=r2(s.ARS); });
  // Bolsa repartible = caja disponible + lo ya retirado por socios − gastos pendientes. Se parte en partes iguales.
  const distrib={ USD:r2(a.caja.USD + a.adelantosSocios.USD - a.pendGasto.USD), ARS:r2(a.caja.ARS + a.adelantosSocios.ARS - a.pendGasto.ARS) };
  const share={ USD:r2(distrib.USD/nSoc), ARS:r2(distrib.ARS/nSoc) };
  list.forEach(s=>{ const real=s.nombre!=='(sin asignar)'; s.pendiente={ USD: real?r2(share.USD - s.USD):0, ARS: real?r2(share.ARS - s.ARS):0 }; });
  return {list, distrib, share, nSoc};
}
// Bloque visual de la liquidación entre socios: bolsa, la mitad de cada uno, retirado y cuánto falta para emparejar.
function liqSociosBlockHtml(liqSoc, a){
  const reales = liqSoc.list.filter(s=>s.nombre!=='(sin asignar)');
  const sinAsig = liqSoc.list.find(s=>s.nombre==='(sin asignar)');
  if(!reales.length) return '<div class="empty">No hay socios cargados.</div>';
  const compenLinea=(mon)=>{
    const arr=reales.map(s=>({n:s.nombre, ret:s[mon]})).sort((a,b)=>b.ret-a.ret);
    if(arr.length<2) return `<span style="color:var(--muted)">${mon}: hay un solo socio cargado.</span>`;
    const diff=Math.round((arr[0].ret-arr[1].ret)*100)/100;              // diferencia entre lo retirado por cada socio
    const resto=Math.round((liqSoc.share[mon]-arr[0].ret)*100)/100;      // lo que aún le queda a cada uno por retirar de la caja
    if(Math.abs(diff)<0.01){
      return `<span style="color:var(--muted)">${mon}: <b>emparejado</b> — ambos socios retiraron lo mismo${resto>0.005?`; queda ${money(resto,mon)} por retirar para cada uno de la caja`:''}.</span>`;
    }
    return `${mon}: <b>${esc(arr[1].n)}</b> retiró <b>${money(diff,mon)}</b> menos que <b>${esc(arr[0].n)}</b>; para emparejar puede retirar esa diferencia.`;
  };
  const cards = reales.map(s=>{
    const cell=(mon)=>{
      const pend=s.pendiente[mon];
      const estado = Math.abs(pend)<0.005 ? `<span style="color:#1c7a40">en su mitad</span>`
        : (pend>0 ? `le corresponde <b style="color:#1c7a40">${money(pend,mon)}</b> más` : `retiró de más <b style="color:#c0392b">${money(-pend,mon)}</b>`);
      return `<div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:1px 0"><span style="color:var(--muted)">${mon}</span><span style="text-align:right">retiró ${money(s[mon],mon)} · le toca ${money(liqSoc.share[mon],mon)} · ${estado}</span></div>`;
    };
    return `<div class="stat clickable" style="border-left:4px solid #7c5cbf;cursor:pointer" onclick="liqSocioDetalle('${esc(s.nombre).replace(/'/g,"\\'")}')" title="Ver detalle de adelantos">
      <div class="lab">⚖️ ${esc(s.nombre)} <span style="font-weight:400;color:var(--muted);font-size:11px">— ver detalle</span></div>
      ${cell("ARS")}${cell("USD")}
    </div>`;
  }).join("");
  const adel = (a&&a.adelantosSocios)||{ARS:0,USD:0};
  const queda = { ARS: Math.round((liqSoc.distrib.ARS-(adel.ARS||0))*100)/100, USD: Math.round((liqSoc.distrib.USD-(adel.USD||0))*100)/100 };
  const bolsa = `<div class="hint" style="margin-bottom:8px">
      <b>Queda por repartir ahora:</b> <b style="color:#1c7a40">${money(queda.ARS,"ARS")}</b> · <b style="color:#1c7a40">${money(queda.USD,"USD")}</b> — a cada socio le corresponde <b>${money(liqSoc.share.ARS,"ARS")}</b> · <b>${money(liqSoc.share.USD,"USD")}</b> del total.
      <br><span style="color:var(--muted)">Total a repartir (histórico) ${money(liqSoc.distrib.ARS,"ARS")} · ${money(liqSoc.distrib.USD,"USD")} − ya retirado por socios ${money(adel.ARS,"ARS")} · ${money(adel.USD,"USD")} = lo que queda arriba.</span></div>`;
  const compen = `<div class="alert alert-info" style="margin-top:8px"><span>⚖️</span><div>${compenLinea("ARS")}<br>${compenLinea("USD")}</div></div>`;
  const aviso = (sinAsig && (sinAsig.ARS||sinAsig.USD)) ? `<div class="alert alert-warn" style="margin-top:8px"><span>⚠</span><div>Hay adelantos <b>sin socio asignado</b> (${money(sinAsig.ARS,"ARS")} · ${money(sinAsig.USD,"USD")}). Asignales el socio en Caja operativa para que la compensación sea exacta.</div></div>` : "";
  return `${bolsa}<div class="grid g2">${cards}</div>${compen}${aviso}`;
}
// Detalle de adelantos de un socio (fecha, concepto, monto).

/* ---------- LIQUIDACIÓN ENTRE SOCIOS (solo socios) ---------- */
function socios(){ return DB.usuarios.filter(u=>u.rol==='socio'); }
function liquidacionesDe(casoId){ return (DB.liquidaciones||[]).filter(l=>l.caso_id===casoId); }
const LIQ_EST={pendiente:"Pendiente",liquidado_parcial:"Liquidado parcialmente",liquidado_completo:"Liquidado completamente"};
async function liqUpsert(l, isNew){
  if(CLOUD){
    const row={id:l.id,caso_id:l.caso_id||null,fecha:l.fecha||null,moneda:l.moneda||"USD",monto_total:Number(l.monto_total||0),reparto:l.reparto||[],gastos_descontados:Number(l.gastos_descontados||0),devolucion_cliente:Number(l.devolucion_cliente||0),estado:l.estado||"pendiente",obs:l.obs||null,usuario:l.usuario,created_at:l.created_at||new Date().toISOString()};
    const ins=isNew===true || !(DB.liquidaciones||[]).some(x=>x.id===l.id);
    let res; if(ins) res=await sb.from("liquidaciones").insert(row).select().maybeSingle(); else res=await sb.from("liquidaciones").update(row).eq("id",l.id).select().maybeSingle();
    if(res.error){ console.error("liqUpsert",res.error); toast("Error al guardar la liquidación: "+res.error.message,"err"); return null; } return res.data;
